   a4:"À {lIV}, il faut sortir, ou en finir avec la chose. {A} veut la garder vivante, quoi qu'il en coûte.",
   opts:["Attirer la chose dans un piège avec un appât.","Démasquer {a} devant les survivants et les rallier.","Tout faire brûler ou sauter, et fuir avec ce qui reste."],
   sec:["{Od}, ce que les coureurs étaient venus chercher, est l'œuf ou la clé de la chose : {comm} le savait.","Un des survivants est déjà touché par la chose : il change, lentement, et ne le sait pas."],bete:1}],
 exploration:[
  {t:["Les secrets {dl1}","La route {dl1}","Ce que cache {l1}"],
   pitch:"{CommD} paie les coureurs pour retrouver {o}, dont on a perdu la trace à {l1} depuis des siècles. {A} est sur la même piste, avec plus d'hommes et moins de scrupules, et compte bien laisser les coureurs faire le travail dangereux.",
   a1:"À {l0}, {comm} montre aux coureurs un fragment de carte et un récit ancien. Le reste de la carte est ailleurs, et {a} vient de faire une offre pour l'acheter.\nPaie : {rec}.",
   a2:"Trois choses à réunir avant de partir pour {l1}, dans l'ordre voulu. {A} a toujours un pas d'avance si les coureurs traînent.",
   prep:[{t:"Le reste de la carte",v:"À {l2}, le morceau manquant est entre les mains d'un collectionneur, d'un temple ou d'un tombeau. On peut l'acheter, le voler ou le recopier.",at:"le chemin le plus sûr"},
    {t:"Le guide",v:"À {l3}, {allieD} est le seul à connaître la route. {Ial} ne partira qu'à ses conditions, et {ial} cache pourquoi {ial} connaît si bien les lieux.",at:"un guide qui évite les pièges"},
    {t:"Le rival",v:"À {l4}, les hommes {dea} préparent l'expédition. Les espionner, les retarder ou saboter leur matériel.",at:"de l'avance sur le rival",renc:"facile"}],
   a3:"À {lIII}, le voyage tourne mal : un passage s'effondre, les vivres manquent, un piège ancien se déclenche. Et {a} rattrape les coureurs, ou leur tend une embuscade.",
   a4:"À {lIV}, {od} est enfin là. {A} arrive au même moment et veut tout prendre. Le lieu se réveille : il ne laissera pas partir les voleurs.",
   opts:["S'emparer de l'objet et fuir pendant que le lieu s'effondre (arts du mouvement).","Laisser {a} déclencher le dernier piège à sa place.","Négocier : partager, ou tout laisser derrière pour sauver sa peau."],
   sec:["Le guide est le dernier descendant de ceux qui ont caché {od} : il veut que personne n'y touche jamais.","{Od} n'est pas un trésor, c'est un sceau : le retirer libère ce qu'il retenait."]},
  {t:["Le monde oublié","Au-delà {dl1}","L'expédition"],
   pitch:"Une expédition est partie vers {l1} et n'est jamais revenue. {CommD} engage les coureurs pour la retrouver, et ramener {o} qu'elle cherchait. {A}, qui finançait l'expédition, l'a abandonnée là-bas pour garder la découverte pour {lui}.",
   a1:"À {l0}, {comm} montre le dernier message de l'expédition : quelques lignes paniquées, et une carte. {A} offre aimablement son aide et son matériel.\nPaie : {rec}.",
   a2:"Trois choses à faire, dans l'ordre voulu, avant d'atteindre {l1}.",
   prep:[{t:"Le campement abandonné",v:"À {l2}, on retrouve le dernier camp de l'expédition : du matériel, un journal, et des traces de lutte.",at:"le journal de l'expédition"},
    {t:"Le peuple des lieux",v:"À {l3}, les gens qui vivent là observent les étrangers de loin. {AllieD} peut servir d'intermédiaire, si on gagne sa confiance.",at:"des alliés sur place"},
    {t:"Les bêtes",v:"À {l4}, des créatures gardent le passage. On peut les contourner, les apaiser ou les combattre.",at:"un passage sûr",renc:"facile"}],
   a3:"À {lIII}, les coureurs retrouvent les survivants de l'expédition, à bout de forces. Ils racontent la trahison {dea}. Au même moment, ses hommes arrivent pour faire taire tout le monde.",
   a4:"À {lIV}, {a} met la main sur {od} et veut détruire tout ce qui pourrait témoigner contre {lui}, survivants compris.",
   opts:["Protéger les survivants et les faire sortir (3 tours).","Arracher {od} à {a}.","Rallier le peuple des lieux contre les intrus."],
   sec:["L'un des survivants est complice {dea} et attend le bon moment pour trahir.","{Od} appartient au peuple des lieux : s'en emparer, c'est déclencher leur colère."]}],
 casse:[
  {t:["Le coup {dl1}","Le dernier coup","Un coup parfait"],
   pitch:"{CommD} veut reprendre son bien, {o}, qui dort désormais dans le coffre {dea}, à {l1}. Les coureurs ont quelques jours pour monter le coup. {A} garde son bien jalousement, et quelqu'un va vendre le plan.",
   a1:"À {l0}, {comm} expose l'affaire : {od} se trouve à {l1}, sous la garde {dea}. Il faut savoir quand frapper, comment entrer, et comment ouvrir.\nPaie : {rec}.",
   a2:"Trois préparatifs, dans l'ordre voulu. Ce qui manquera se paiera le jour du coup.",
   prep:[{t:"L'horaire",v:"À {l2}, quelqu'un connaît l'emploi du temps des gardes et le moment où la garde sera la plus faible. Il faut le faire parler sans qu'il prévienne {a}.",at:"le bon moment pour frapper"},
    {t:"L'homme de l'intérieur",v:"À {l3}, {allieD} travaille pour {a} et en a assez. {Ial} ouvrira une porte, contre une part du butin.",at:"une porte ouverte de l'intérieur"},
    {t:"La clé",v:"À {l4}, on peut obtenir la clé, la combinaison ou le plan du coffre. C'est gardé, et ça se remarque si ça disparaît.",at:"de quoi ouvrir le coffre sans bruit",renc:"facile"}],
   a3:"Le jour du coup, à {lIII}. Tout se passe comme prévu… jusqu'à ce que les coureurs comprennent que {a} les attendait : la garde est doublée, une issue est fermée. Quelqu'un a parlé.",
   a4:"À {lIV}, le coffre est ouvert, mais {a} est là, avec ses meilleurs hommes, et propose un marché : rendre le butin et repartir vivants, ou rester pour toujours.",
   opts:["Se battre pour sortir avec le butin.","Accepter le marché… et doubler tout le monde.","Utiliser un atout pour s'échapper sans combattre."],
   sec:["C'est {comm} qui a vendu le plan à {a} : {comm} veut {od}, mais aussi les coureurs morts, pour ne rien partager.","{Od} est un faux : le vrai est sur {a}, en permanence."]},
  {t:["La grande évasion","Le prisonnier {dl1}","Sortir {dl1}"],
   pitch:"{CommD} paie les coureurs pour faire sortir quelqu'un de {l1}, où {a} le retient. Ce prisonnier sait où se trouve {o}, et {a} compte bien le faire parler d'ici quelques jours.",
   a1:"À {l0}, {comm} montre aux coureurs un plan approximatif de {l1} et le nom du prisonnier. Il faut entrer, le trouver, et ressortir avec lui, avant que {a} ne le brise.\nPaie : {rec}.",
   a2:"Trois préparatifs, dans l'ordre voulu. Chaque jour qui passe, le prisonnier est plus faible.",
   prep:[{t:"Les plans",v:"À {l2}, celui qui a bâti ou réparé les lieux connaît un passage oublié. Il n'aime pas {a}, mais il a peur.",at:"une entrée secrète"},
    {t:"Le complice",v:"À {l3}, {allieD} peut faire entrer un objet ou un message. {Leal} convaincre, c'est prendre le risque qu'{ial} parle.",at:"un message au prisonnier, qui sera prêt"},
    {t:"La diversion",v:"À {l4}, on peut préparer une diversion : un incendie, une bagarre, une fausse alerte. Il faut du matériel, et des gens pas très recommandables.",at:"une diversion au bon moment",renc:"facile"}],
   a3:"À {lIII}, les coureurs entrent. Mais le prisonnier n'est plus là où il devait être : {a} l'a fait transférer pour l'interroger lui-même.",
   a4:"À {lIV}, {a} interroge le prisonnier. Les coureurs arrivent, l'alarme sonne, et il faut sortir avec un homme qui tient à peine debout.",
   opts:["Porter le prisonnier et fuir (arts du mouvement, jets groupés).","Tenir les gardes à distance pendant que la diversion fait effet (3 tours).","Prendre {a} en otage pour sortir."],
   sec:["Le prisonnier a déjà parlé : {a} sait où est {od} et y a envoyé ses hommes.","Le prisonnier ne veut pas être sauvé : il a passé un accord avec {a}, et il trahira les coureurs."]}],
 escorte:[
  {t:["La route {dl1}","Le convoi","Jusqu'à {l1}"],
   pitch:"{CommD} confie aux coureurs une mission : conduire {protD} jusqu'à {l1}, sain et sauf. {A} veut l'empêcher d'arriver, à n'importe quel prix, parce que ce voyageur sait quelque chose qui peut {lui} faire tout perdre.",
   a1:"À {l0}, {comm} présente {prot} aux coureurs. Le voyageur est nerveux, refuse de dire pourquoi on le poursuit, et regarde sans cesse derrière lui.\nPaie : {rec}.",
   a2:"Trois étapes sur la route, dans l'ordre que permet le chemin. Chaque étape bien négociée rend la suite plus sûre.",
   prep:[{t:"Le relais",v:"À {l2}, il faut changer de montures, de véhicule ou de provisions. Le relais est tenu par quelqu'un qui doit de l'argent à {a}.",at:"des montures fraîches et de l'avance"},
    {t:"Le compagnon de route",v:"À {l3}, {allieD} propose de faire route ensemble. {Ial} connaît un raccourci, et {ial} cache pourquoi {ial} voyage.",at:"un raccourci"},
    {t:"Les éclaireurs",v:"À {l4}, des éclaireurs {dea} guettent la route. Les éviter, les tromper ou les faire taire.",at:"la route dégagée",renc:"facile"}],
   a3:"À {lIII}, les poursuivants rattrapent le convoi. Pire : le voyageur disparaît pendant la nuit. Enlevé, ou parti de son plein gré ?",
   a4:"À {lIV}, aux portes de {l1}, {a} tend son dernier piège. Il faut passer, avec le voyageur, coûte que coûte.",
   opts:["Forcer le passage avec le voyageur (arts du mouvement).","Retenir {a} pendant que les autres passent (3 tours).","Révéler publiquement ce que sait le voyageur : {a} n'a plus de raison de le tuer."],
   sec:["Le voyageur n'est pas celui qu'il prétend : c'est lui que {a} veut protéger, et {comm} veut sa perte.","Ce que transporte le voyageur attire la menace : tant qu'il l'aura, on le retrouvera."]},
  {t:["La cargaison","Une livraison dangereuse","Le chargement"],
   pitch:"Les coureurs doivent livrer {o} à {l1} pour {commD}, avant une date fixée. La cargaison est fragile, convoitée, et {a} a juré de s'en emparer avant l'arrivée.",
   a1:"À {l0}, {comm} montre la cargaison aux coureurs, scellée et lourde. {Comm} prévient : si la cargaison n'arrive pas à temps, des gens mourront.\nPaie : {rec}.",
   a2:"Trois étapes, dans l'ordre que permet la route. Chaque retard rapproche les poursuivants.",
   prep:[{t:"Le passage",v:"À {l2}, la route est coupée : crue, éboulement, pont détruit. Il faut trouver un moyen de passer avec la cargaison.",at:"un passage que {a} ignore"},
    {t:"L'aide",v:"À {l3}, {allieD} peut réparer, cacher ou protéger le chargement, contre un service.",at:"une cargaison mieux protégée"},
    {t:"Les pillards",v:"À {l4}, une bande engagée par {a} tend une embuscade.",at:"des poursuivants affaiblis",renc:"facile"}],
   a3:"À {lIII}, la cargaison s'abîme, ou révèle sa vraie nature. Les coureurs doivent choisir : continuer avec ce danger, ou la sacrifier.",
   a4:"À {lIV}, juste avant l'arrivée, {a} attaque avec tout ce qu'{il} a.",
   opts:["Protéger la cargaison pendant l'assaut (3 tours).","Prendre une route impossible pour semer les poursuivants (arts du mouvement).","Livrer une fausse cargaison et sauver la vraie."],
   sec:["La cargaison n'est pas ce qu'on croit : c'est {comm} qui ment, et {a} veut empêcher une catastrophe.","{A} et {comm} sont associés : l'attaque doit justifier la disparition de la cargaison, déjà vendue ailleurs."]}],
 siege:[
  {t:["La dernière nuit {dl1}","Tenir {l1}","Avant l'aube"],
   pitch:"{A} marche sur {l1} avec sa bande et veut {o} qu'on y garde. {CommD} supplie les coureurs de défendre les lieux jusqu'à l'arrivée des secours, dans trois jours.",
   a1:"À {l1}, {comm} montre aux coureurs ce qu'il y a à défendre : des murs fragiles, des gens qui ne savent pas se battre, et {od}. Les éclaireurs {dea} sont déjà en vue.\nPaie : {rec}.",
   a2:"Trois préparatifs, dans l'ordre voulu, avant le premier assaut. Ce qui ne sera pas prêt cédera.",
   prep:[{t:"Les défenses",v:"Sur les murs, il faut renforcer le point faible : une brèche, une porte, un gué. Il faut des bras, et du matériel.",at:"un point faible renforcé"},
    {t:"Les défenseurs",v:"Parmi les habitants, {allieD} a déjà combattu. Avec {allie} à leur tête, les habitants tiendront.",at:"des défenseurs qui ne fuient pas"},
    {t:"Les éclaireurs",v:"Hors des murs, à {l2}, des éclaireurs {dea} rôdent. Les capturer, c'est connaître le plan d'attaque.",at:"le plan d'attaque ennemi",renc:"facile"}],
   a3:"Premier assaut, à {lIII}. Au pire moment, une brèche s'ouvre de l'intérieur : quelqu'un a trahi. Il faut tenir, et trouver le traître.",
   a4:"Dernier assaut, à {lIV}. {A} mène l'attaque en personne.",
   opts:["Tenir jusqu'à l'aube et l'arrivée des secours (4 tours).","Abattre {a} : sans chef, sa bande se débande.","Faire sortir les habitants par un passage pendant que d'autres tiennent."],
   sec:["{A} ne veut pas {od} : {il} fuit quelque chose de pire, qui arrive derrière {lui}.","{Comm} a provoqué l'attaque : {comm} a volé {od} {aa} il y a des années."]},
  {t:["Le siège","Tous les sacrifices","Les murs tiendront"],
   pitch:"{A} assiège {l1} et réclame qu'on lui livre {protD}. {CommD} refuse et engage les coureurs pour tenir. Mais à l'intérieur, la peur monte, et certains seraient prêts à livrer le prisonnier.",
   a1:"À {l1}, {comm} présente aux coureurs {prot}, que tout le monde regarde de travers. {A} a fait savoir que si on lui livre ce prisonnier, tout le monde vivra.\nPaie : {rec}.",
   a2:"Trois choses à faire avant l'assaut, dans l'ordre voulu.",
   prep:[{t:"Les vivres",v:"Dans les réserves, les vivres sont presque épuisés, ou empoisonnés. Il faut en trouver, à l'intérieur ou par une sortie risquée.",at:"de quoi tenir un siège long"},
    {t:"Les habitants",v:"Sur la place, {allieD} veut livrer le prisonnier et monte les habitants contre les coureurs. {Leal} convaincre, ou {leal} neutraliser.",at:"les habitants de votre côté"},
    {t:"La sortie",v:"Une sortie nocturne vers {l2} peut détruire les engins de siège ou les réserves de l'ennemi.",at:"un ennemi affaibli",renc:"facile"}],
   a3:"À {lIII}, quelqu'un ouvre une porte pour livrer le prisonnier. L'ennemi s'engouffre. Il faut repousser l'attaque et sauver {prot}.",
   a4:"À {lIV}, {a} lance son dernier assaut pour prendre le prisonnier, de force.",
   opts:["Repousser l'assaut (4 tours).","Défier {a} en combat singulier.","Faire fuir le prisonnier par un passage secret."],
   sec:["Le prisonnier est coupable de ce dont {a} l'accuse.","{A} est de la même famille que le prisonnier, et veut le sauver d'un sort pire encore."]}],
 intrigue:[
  {t:["Les masques {dl1}","Le grand bal","Les alliances"],
   pitch:"À {l1}, tout se joue lors d'une grande réunion : traité, mariage ou élection. {CommD} veut que les coureurs l'aident à l'emporter. {A} veut tout faire échouer, et prépare un coup d'éclat pour cette nuit-là.",
   a1:"À {l0}, {comm} explique les enjeux, qui pèse quoi, et pourquoi tout doit être réglé avant la réunion à {l1}. Ceux qu'il faut convaincre ont tous un prix.\nPaie : {rec}.",
   a2:"Trois personnes à rallier ou à neutraliser, dans l'ordre voulu.",
   prep:[{t:"Le notable",v:"À {l2}, un notable hésite entre les deux camps. Il a un secret, et une dette.",at:"une voix de plus"},
    {t:"Le confident",v:"À {l3}, {allieD} sait tout de tout le monde, et vend ce qu'{ial} sait.",at:"le plan {dea}"},
    {t:"Le document",v:"À {l4}, un document compromettant pour {a} est gardé sous clé.",at:"un moyen de pression sur {a}",renc:"facile"}],
   a3:"À {lIII}, {a} frappe en premier : un allié de {comm} est discrédité, arrêté ou tué. Les coureurs sont accusés d'avoir trempé dans l'affaire.",
   a4:"À {lIV}, la grande réunion. {A} déclenche son coup : un assassinat, une révélation, une trahison publique.",
   opts:["Déjouer l'assassinat dans la foule.","Révéler publiquement le secret {dea}.","Retourner un allié {dea} au dernier moment."],
   sec:["{Comm} prépare le même coup que {a} : celui qui frappe le premier gagnera.","Le confident travaille pour les deux camps, et livrera les coureurs au plus offrant."]},
  {t:["L'héritage","La succession","Le testament"],
   pitch:"Le maître de {l1} est mort, et sa succession déchire les siens. {CommD} paie les coureurs pour retrouver {o}, qui désigne l'héritier légitime. {A} a fait disparaître l'objet et compte s'emparer de tout.",
   a1:"À {l0}, {comm} raconte la mort du maître, trop soudaine, et la disparition de {od}. {A} gère déjà les affaires, en attendant.\nPaie : {rec}.",
   a2:"Trois pistes, dans l'ordre voulu, pour retrouver l'objet avant la proclamation.",
   prep:[{t:"Le médecin",v:"À {l2}, le médecin qui a vu le corps a des doutes sur la mort du maître.",at:"la preuve d'un meurtre"},
    {t:"Le serviteur",v:"À {l3}, {allieD} a vu qui est entré dans le bureau du maître, la dernière nuit.",at:"un témoin"},
    {t:"La cachette",v:"À {l4}, des hommes {dea} gardent quelque chose de précieux.",at:"l'objet perdu",renc:"facile"}],
   a3:"À {lIII}, {a} sait qu'on le cherche. {Il} fait accuser {comm} du meurtre du maître.",
   a4:"À {lIV}, la proclamation de l'héritier. {A} est sur le point de prendre le pouvoir.",
   opts:["Présenter les preuves devant tous.","Démasquer {a} en le poussant à se trahir.","Négocier un partage pour éviter la guerre."],
   sec:["Le maître n'est pas mort : il se cache pour voir qui le trahit.","{Comm} n'est pas l'héritier légitime : {od} désigne quelqu'un d'autre."]}],
 chasse:[
  {t:["La traque","La bête {dl1}","Le prédateur"],
   pitch:"Une bête terrorise les environs de {l1}. {CommD} paie les coureurs pour l'abattre. {A} refuse d'admettre le danger, parce que la bête protège ses intérêts, ou parce qu'{il} la contrôle.",
   a1:"À {l0}, {comm} montre aux coureurs les dégâts de la dernière attaque. {A} affirme qu'il ne s'agit que d'une bête ordinaire, et qu'on exagère.\nPaie : {rec}.",
   a2:"Trois choses à apprendre avant la chasse, dans l'ordre voulu. Chaque jour, la bête frappe plus près.",
   prep:[{t:"Le pisteur",v:"À {l2}, {allieD} connaît la région et les habitudes de la bête.",at:"un pisteur qui la trouvera"},
    {t:"Les traces",v:"À {l3}, les traces révèlent que la bête n'est pas un animal ordinaire.",at:"son point faible"},
    {t:"La tanière",v:"À {l4}, on trouve la tanière, et des preuves que quelqu'un la nourrit.",at:"la preuve que {a} la protège",renc:"facile"}],
   a3:"À {lIII}, la bête frappe en plein jour, devant témoins. {A} accuse les coureurs de l'avoir provoquée.",
   a4:"À {lIV}, la bête est acculée. {A} tente de la protéger, ou de la lâcher sur les coureurs.",
   opts:["Abattre la bête en utilisant son point faible.","Livrer {a} aux autorités avec les preuves.","Capturer la bête vivante."],
   sec:["{A} a créé la bête, ou l'a fait venir : elle lui obéit.","La bête défend ses petits : la tuer laissera une portée affamée."],bete:1},
  {t:["Les chasseurs chassés","Le gibier","La saison de chasse"],
   pitch:"{CommD} organise une grande chasse à {l1} et engage les coureurs pour l'accompagner. Dès le premier soir, quelque chose se met à chasser les chasseurs. {A} sait ce que c'est : {il} l'a lâché là pour se débarrasser de {comm} sans se salir les mains.",
   a1:"À {l0}, {comm} présente l'équipée : rabatteurs, porteurs, et {a}, invité de marque. Le premier soir, à {l1}, un rabatteur ne revient pas. On retrouve son arme, brisée net.\nPaie : {rec}.",
   a2:"Trois choses à faire avant que la chose ne frappe de nouveau, dans l'ordre voulu. Chaque nuit, elle emporte quelqu'un de plus.",

    {t:"Les pièges",v:"À {l4}, on peut tendre un piège à sa mesure. Mais des pillards rôdent, attirés par le matériel de chasse.",at:"un piège prêt à servir",renc:"facile"}],

   sec:["{A} n'a pas lâché la chose : elle l'a suivi depuis son pays, et elle veut sa peau à {lui} aussi.","{Comm} savait que la chose rôdait : la chasse était un prétexte pour la capturer vivante et la vendre."],bete:1}
 ]

 alien:{g:"horreur",t:["Ce qui est sorti de la caisse","Personne ne vous entendra crier","La dernière nuit"],
  pitch:"Les coureurs escortent {cargaison} jusqu'à {lieuIsole}, pour le compte de {patron}. La première nuit, quelque chose sort de {cargC}. Désormais, une créature chasse dans {conduits}, l'aide est à des jours, et {savantD} savait tout : {patron} veut la bête vivante, et les coureurs sont sacrifiables.",
  a1:"Les coureurs arrivent dans {lieuIsoleC} avec {cargaison}. {ChefD} les accueille sans chaleur : l'endroit sera coupé du monde pendant plusieurs jours, et {cargC} doit rester scellé. {SavantN} insiste pour l'examiner dès ce soir.\nLa première nuit, {cargC} est ouvert de l'intérieur. {TemoinD} a disparu ; on retrouve {lampe} dans {conduits}.\nPaie : {rec}.",
  a2:"La créature est encore petite, mais elle grandit à chaque proie. Chaque nuit qui passe, elle emporte quelqu'un et prend des forces.",

  a3:"La créature a fini de grandir. Elle frappe en pleine nuit, dans {lieuPublic} : {lumieres} s'éteignent, quelqu'un est emporté. Au même moment, {savantN} sabote {issue} : personne ne partira sans le spécimen.",r3:{k:"monstre",diff:"equilibre"},
  a4:"Il reste une issue : {issue}, qu'il faut réparer ou reprendre. La créature est entre les coureurs et la sortie. {SavantN} veut la capturer vivante, et compte sur les coureurs pour servir d'appât.",

  opts:["Attirer la créature dans un piège (un endroit qu'on peut fermer, une fosse) avec un appât.","La repousser avec ce qui la blesse jusqu'à pouvoir partir.","Tout faire brûler ou sauter derrière soi, et fuir avec les survivants (3 tours)."],

 jurassic:{g:"siege",t:["Les enclos sont ouverts","La nature trouve un chemin","La nuit de l'orage"],
  pitch:"{ProprioD} a réuni des bêtes qu'on croyait disparues dans {enclos}. Avant de montrer son œuvre au monde, {ilproprio} invite les coureurs à tout vérifier. Pendant la visite, {saboteurD} coupe {energie} pour voler {embryons} au profit {drival}. Les enclos s'ouvrent, et la nuit tombe.",
  a1:"{ProprioN} accueille les coureurs dans {enclosC}. La visite est stupéfiante : {geantU}, paisible au loin, une meute nerveuse derrière {cloture}. {PaleoD} s'inquiète à voix basse : les bêtes se reproduisent alors qu'elles ne devraient pas. Puis {orage} éclate, et tout s'éteint d'un coup.\nPaie : {rec}.",
  a2:"Plus rien ne retient les bêtes. Les coureurs doivent rejoindre {centre} pour tout remettre en marche.",
  prep:[

  a3:"En route vers {centreC}, {geantL} surgit dans la nuit. Ce n'est pas un combat qu'on gagne : il faut se cacher, la distraire, ou courir. La bête ne voit bien que ce qui bouge.",r3:{k:"geant",diff:"rude"},r3txt:"À éviter plutôt qu'à combattre.",
  a4:"Les coureurs atteignent {centreC}. Il faut relancer {energieC} pendant que la meute force les portes, et {proprioN} refuse d'abandonner son œuvre.",
  si:["Si {allieN} les a guidés : ils arrivent par l'arrière, avant la meute, et ont le temps de barricader une porte.","S'ils savent comment relancer {energieC} : il suffit de 2 tours, sans jet. Sinon, il faut 3 tours et un jet difficile à chaque tour.","S'ils savent comment chasse la meute : ils surveillent les deux portes, et la meute ne les surprend pas. Sinon, elle frappe la première, par derrière."],

 sherlock:{g:"enquete",t:["La lettre découpée","Le dernier problème","Une étude en noir"],

  a1:"{ClientN} vient trouver les coureurs en pleine nuit. On a retrouvé {victimeD} sans vie dans {lieuRiche}. {Loi} a déjà arrêté le coupable idéal, {suspectD}, qui jure son innocence. Sur le corps : {message}\nPaie : {rec}.",

  a3:"{GenieN} sait que les coureurs approchent. Le suspect est libéré contre son silence, des tueurs sont envoyés chez {clientN}, et une dénonciation anonyme accuse les coureurs du meurtre de l'indicateur.",r3:{k:"humains",diff:"equilibre"},

 huisclos:{g:"enquete",t:["Ils n'étaient plus que trois","La comptine","Le dernier invité"],
  pitch:"Des invités sont réunis dans {lieuIsole} par un hôte que personne ne connaît, et la tempête coupe tout contact avec l'extérieur. Au dîner, une voix accuse chacun d'un crime resté impuni ; puis les invités meurent, un par un. Le coupable est parmi eux : {medecinD}, qui a monté toute cette mise en scène pour juger ceux que la justice a épargnés.",
  a1:"Les coureurs sont invités, ou engagés pour veiller sur les invités, dans {lieuIsoleC}. Parmi les convives : {medecinD}, {marchandD}, {heritierD} et {ancienD}. L'hôte annoncé n'est jamais venu. Au dîner, une voix accuse chaque convive d'un crime ancien, coureurs compris. Le lendemain matin, on retrouve {marchandN} mort{marchandE}.\nPaie promise : {rec}.",

  a3:"Une nouvelle nuit, deux morts : {heritierN}, et {medecinN} en personne, qui avait constaté le premier décès. Il ne reste presque plus personne, chacun soupçonne l'autre, et les coureurs sont accusés.",r3:false,

 communaute:{g:"enquete",t:["Le poison des pages","La salle interdite","Le savoir qui tue"],

  a1:"Les coureurs arrivent dans {sanctuaire}. {PretreN} leur montre le dernier mort, retrouvé au pied d'un mur, les doigts noircis. Tout le monde parle de malédiction. {AncienN}, très âgé{ancienE} et presque aveugle, met en garde contre les curieux.\nPaie : {rec}.",

  a3:"{AncienN} comprend que les coureurs approchent. Le feu prend dans {savoir} : {ilancien} préfère tout détruire plutôt que de laisser l'objet être découvert.",r3:false,
