  a3:"Pendant {fete}, {capitaineN} referme son piège.",r3:{k:"humains",diff:"equilibre"},
  a4:"Au milieu de {fete}, {relique} disparaît… ou presque. {CapitaineN} bloque toutes les sorties.",
  si:["S'ils ont une invitation : ils sont dans la place, au-dessus de tout soupçon.","S'ils ont le faux : la garde surveille la copie.","S'ils connaissent le piège : ils le retournent contre {capitaineN}."],
  opts:["S'éclipser avec panache.","Ridiculiser {capitaineN}.","Rendre publiquement {relique} à {allieN}."],
  r4:{k:"perso",role:"capitaine",b:["veteran","lieutenant"],troupe:"humains",diff:"rude"},
  sec:["{NobleN} a lui-même volé {relique}.","{CapitaineN} admire secrètement les coureurs."],
  fiches:[["La victime","noble"],["L'enquêteur","capitaine"],["L'invité complice","heritier"],["Le faussaire","marchand"]]},

 inception:{g:"casse",t:["Le rêve dans le rêve","L'idée","Le dernier niveau"],
  rdef:{_:"une machine qui permet d'entrer dans les rêves"},
  persos:{cerveau:"un voleur de rêves hanté par son passé"},
  pitch:"{CerveauD} engage les coureurs pour un casse d'un genre unique : entrer dans les rêves {dheritierN} grâce à {ressort}, et y semer une idée, celle de renoncer à l'empire de {nobleD}. Plus on descend dans les rêves, plus le temps s'étire, et l'esprit de la cible se défend.",
  a1:"{CerveauN} explique le plan : trois niveaux de rêve, l'un dans l'autre. Au premier, une ville ; au deuxième, un lieu fermé ; au troisième, une forteresse où dort la pensée la plus secrète {dheritierN}. Si quelqu'un meurt dans le rêve, il se réveille… sauf au dernier niveau.\nPaie : {rec}.",
  a2:"Trois choses à réunir avant de s'endormir. Ce qui manquera rendra le rêve plus dangereux.",
  prep:[
   {t:"L'architecte",voir:"Il faut quelqu'un pour bâtir les rêves : des lieux crédibles, avec des passages secrets.",qui:"{SavantD} sait dessiner des labyrinthes impossibles, et accepte par curiosité.",gagne:"des rêves bâtis sur mesure : les coureurs connaissent les raccourcis de chaque niveau.",rate:"les rêves sont bâtis à la hâte : les lieux changent sous les pieds des coureurs."},
   {t:"Le sommeil",voir:"Pour descendre trois niveaux, il faut un sommeil très profond.",qui:"{MedecinD} prépare un sédatif, mais prévient : trop fort, on ne remonte plus.",gagne:"un sommeil stable : un « coup de pied » (une chute, un choc) suffira à remonter.",rate:"le sommeil est fragile : les coureurs risquent de se réveiller au mauvais moment."},
   {t:"Le fantôme",voir:"Dans chaque rêve {dcerveauN} apparaît une silhouette qui lui ressemble, venue de son passé.",qui:"{CerveauN} refuse d'en parler, puis avoue : c'est un souvenir qu'il n'arrive pas à laisser partir.",gagne:"savoir que le fantôme sabotera la mission, et comment l'apaiser.",rate:"le fantôme frappe par surprise au pire moment.",renc:{k:"humains",diff:"facile",siRate:1}}],
  a3:"Au deuxième niveau, l'esprit {dheritierN} se défend : des gardes surgissent de partout, armés, et le temps presse. Le fantôme {dcerveauN} apparaît et attaque un coureur.",r3:{k:"humains",diff:"equilibre"},
  a4:"Au troisième niveau, dans la forteresse mentale, la pensée secrète {dheritierN} attend dans une chambre forte. Il faut y déposer l'idée, puis remonter avant que tout ne s'effondre (4 tours).",
  si:["S'ils ont un architecte : ils connaissent le chemin le plus court jusqu'à la chambre forte.","S'ils ont un sommeil stable : un choc suffit pour remonter, tous ensemble.","S'ils savent pour le fantôme : ils peuvent l'apaiser au lieu de le combattre."],
  opts:["Déposer l'idée dans la chambre forte, et remonter.","Retenir les défenses de l'esprit pendant qu'un seul coureur avance.","Abandonner la mission et remonter vite, avant de rester piégé."],
  r4:{k:"humains",diff:"rude"},
  sec:["L'idée qu'on sème vient {dcerveauN} : il a déjà fait ça une fois, et ça a fini en drame.","Un coureur n'est pas sûr d'être remonté : le monde autour de lui est un peu trop parfait."],
  fiches:[["Le cerveau","cerveau"],["La cible","heritier"],["L'architecte","savant"],["Le chimiste","medecin"]]},

 cerclerouge:{g:"casse",t:["Le cercle rouge","Le casse silencieux","Tôt ou tard"],
  pitch:"Un casse silencieux, sans un mot de trop : vider {coffre}, la nuit. {ChefGangD}, à qui les coureurs doivent beaucoup, propose le coup et veut sa part. {CapitaineD}, patient et obstiné, a déjà ouvert un dossier à leur nom. Tôt ou tard, les chemins se croisent.",
  a1:"{ChefGangN} expose l'affaire aux coureurs : {coffre}, protégée par {garde}. Une seule nuit, aucun mot, aucune trace. Et la dette sera effacée.\nPaie : {rec}, et la dette effacée.",
  a2:"Trois préparatifs, dans le plus grand silence. Chaque erreur rapproche {capitaineN}.",
  prep:[
   {t:"Le tireur",voir:"Le système d'alarme a un point faible, qu'un seul tir précis peut neutraliser depuis l'extérieur.",qui:"{MercenaireD}, ancien tireur d'élite, a la main qui tremble depuis des années.",gagne:"un tir parfait : l'alarme ne sonnera pas.",rate:"il faudra couper l'alarme de l'intérieur, en courant le risque d'être vus."},
   {t:"Le receleur",voir:"Une prise pareille, il faut pouvoir la revendre.",qui:"{MarchandD} accepte, mais transpire beaucoup : {capitaineN} le tient par une vieille affaire.",gagne:"un receleur fiable, qu'on a arraché à l'emprise {dcapitaineN}.",rate:"le receleur reste à la botte {dcapitaineN}, et prépare un piège."},
   {t:"L'ombre",voir:"Depuis des jours, quelqu'un suit les coureurs.",qui:"{CapitaineN} ne se cache même plus : {ilcapitaine} attend une erreur.",gagne:"les coureurs sèment {capitaineN} : {ilcapitaine} perd leur trace pour la nuit du casse.",rate:"les hommes {dcapitaineN} interpellent un coureur, qui doit s'échapper.",renc:{k:"humains",diff:"facile",siRate:1}}],
  a3:"Le casse réussit, dans un silence parfait. Mais au partage, {chefGangN} veut tout, et ses hommes sortent les armes.",r3:{k:"humains",diff:"equilibre"},
  a4:"Au rendez-vous avec le receleur, dans une maison isolée, les coureurs comptent enfin le butin. Dehors, dans la nuit, {capitaineN} a refermé le cercle.",
  si:["S'ils ont eu le tireur : personne ne sait encore que le coffre a été vidé, et {capitaineN} n'a aucune preuve.","Si le receleur est fiable : il n'y a pas de piège, et il connaît une sortie par les caves.","S'ils ont semé {capitaineN} : {ilcapitaine} arrive seul{capitaineE}, sans renforts."],
  opts:["Fuir par la nuit, en laissant une partie du butin.","Négocier avec {capitaineN} : le butin contre leur liberté.","Forcer le passage."],
  r4:{k:"perso",role:"capitaine",b:["veteran","lieutenant"],troupe:"humains",diff:"rude"},
  sec:["{CapitaineN} ne veut pas les arrêter : {ilcapitaine} veut le butin pour {luicapitaine}.","C'est {chefGangN} qui a vendu les coureurs à {capitaineN}, pour garder tout le butin."],
  fiches:[["L'enquêteur","capitaine"],["Le commanditaire","chefGang"],["Le tireur","mercenaire"],["Le receleur","marchand"]]},

 gardiens:{g:"casse",t:["Une bande de bras cassés","L'objet de trop","Les gardiens"],
  persos:{fanatique:"un fanatique qui veut tout détruire"},
  pitch:"Les coureurs volent {relique} pour le compte {dmarchandN}, sans savoir ce que c'est. Elle est capable de raser une ville, et {fanatiqueD} la veut pour accomplir sa vengeance. Avec une bande de marginaux rencontrés en chemin, les coureurs vont devoir la garder hors de ses mains.",
  a1:"Un vol simple : {relique}, dans {ruines}, pour {marchandN}. À peine l'ont-ils en main que des hommes en armes les traquent : {fanatiqueN} veut l'objet, et il est prêt à tout.\nPaie : {rec}.",
  a2:"Seuls, les coureurs ne tiendront pas. Trois façons de s'en sortir.",
  prep:[
   {t:"Les compagnons",voir:"Arrêtés et jetés dans {prison}, les coureurs y croisent d'autres marginaux.",qui:"{MercenaireD} et {chasseurD}, que tout oppose, veulent eux aussi s'évader.",gagne:"deux compagnons improbables, qui se battront à leurs côtés au climax.",rate:"les coureurs s'évadent seuls, et se sont fait des ennemis."},
   {t:"Ce qu'est l'objet",voir:"{MarchandN} connaît la vraie nature de {relique}, et a peur.",qui:"{MarchandN}, qui comptait la revendre à {fanatiqueN} lui-même.",gagne:"savoir comment contenir le pouvoir de l'objet : il faut plusieurs mains pour le tenir sans mourir.",rate:"les coureurs ignorent ce que fait l'objet."},
   {t:"Le plan du fanatique",voir:"Les hommes {dfanatiqueN} quadrillent la région.",qui:"Un déserteur de son armée, qui veut sauver sa famille.",gagne:"le plan {dfanatiqueN} : où il frappera, et quand.",rate:"les hommes du fanatique surprennent les coureurs.",renc:{k:"humains",diff:"facile",siRate:1}}],
  a3:"{FanatiqueN} attaque en force et reprend {relique}. Il s'envole, ou s'en va, vers {ville}, pour la détruire.",r3:{k:"humains",diff:"equilibre"},
  a4:"Au-dessus de {ville}, {fanatiqueN} lève {relique}. Encore 4 tours, et la ville disparaît.",
  si:["S'ils ont des compagnons : chacun retient une partie de ses hommes.","S'ils savent contenir l'objet : en le tenant tous ensemble, ils peuvent le retourner contre {fanatiqueN}.","S'ils connaissent son plan : ils l'attendaient sur place."],
  opts:["Reprendre {relique}, ensemble.","Distraire {fanatiqueN} en le provoquant, pendant que les autres approchent.","Évacuer la ville."],
  r4:{k:"perso",role:"fanatique",b:["veteran","lieutenant","seigneur"],troupe:"humains",diff:"rude"},
  sec:["{FanatiqueN} a perdu sa famille à cause de ceux qui gouvernent {ville}.","{MarchandN} travaillait pour {fanatiqueN} depuis le début."],
  fiches:[["Le fanatique","fanatique"],["Le commanditaire","marchand"],["Le mercenaire","mercenaire"],["Le chasseur","chasseur"]]}
});

/* ============ Escorte et fuite ============ */
Object.assign(OEUVRES_H,{
 salaire:{g:"escorte",t:["Le salaire de la peur","La cargaison","Chaque cahot peut tuer"],
  persos:{patronL:"un contremaître sans scrupules"},
  pitch:"Un incendie dévore un puits, une mine ou une forteresse, et seule une explosion peut souffler les flammes. Il faut y apporter {explosif}. {PatronLD} paie une fortune pour la convoyer sur {route}, une piste défoncée où le moindre cahot peut tout faire sauter. Il n'a pas dit que deux équipes étaient déjà mortes.",
  a1:"{PatronLN} recrute les coureurs à {village} : conduire {convoi} chargé {dexplosif} jusqu'à l'incendie, à deux jours de route. Une autre équipe part en même temps : {mercenaireD} et son compagnon.\nPaie : {rec}, quatre fois plus si la cargaison arrive.",
  a2:"Chaque passage difficile est un jet de nerfs. Un échec grave, et tout saute.",
  prep:[
   {t:"Le véhicule",voir:"{Convoi} est vieux, mal suspendu, et ses freins sont douteux.",qui:"{MarchandD} peut le remettre en état, contre une part de la paie.",gagne:"un véhicule solide : le premier choc grave au climax est absorbé sans exploser.",rate:"le véhicule tombe en panne en chemin : il faut le réparer sous la menace."},
   {t:"La route",voir:"{Route} a ses pièges : un virage en épingle, un pont pourri, une flaque de boue où l'on s'enlise.",qui:"{AncienD} l'a parcourue cent fois et sait où sont les pièges.",gagne:"la carte des pièges : on sait où passer, et comment.",rate:"les coureurs découvrent les pièges en roulant dessus."},
   {t:"L'autre équipe",voir:"{MercenaireN} roule devant, et veut arriver le premier pour toucher la prime seul.",qui:"{MercenaireN}, dur et méfiant, peut devenir un allié ou un rival.",gagne:"une seule équipe : on avance ensemble, et l'on s'entraide dans les passages difficiles.",rate:"{mercenaireN} sabote la route derrière lui pour retarder les coureurs.",renc:{k:"humains",diff:"facile",siRate:1}}],
  a3:"Un rocher bloque la route. Il faut le faire sauter avec une partie de la cargaison, au risque de tout perdre. Pendant ce temps, des pillards attirés par la prime attaquent le convoi.",r3:{k:"humains",diff:"equilibre"},
  a4:"Dernier obstacle avant l'incendie : une mare de pétrole, ou de boue, au fond d'une cuvette. Il faut la traverser lentement, très lentement, pendant que la cargaison tremble.",
  si:["S'ils ont un véhicule solide : le premier choc grave ne fait pas exploser la cargaison.","S'ils ont la carte des pièges : ils connaissent le chemin pour contourner le pire de la cuvette.","Si les deux équipes sont unies : {mercenaireN} les tire hors de la boue."],
  opts:["Traverser la cuvette lentement (3 jets groupés : un échec grave et tout saute).","Alléger la cargaison et la faire sauter derrière eux.","Abandonner le véhicule et porter la cargaison à pied, à la main."],
  r4:{k:"humains",diff:"equilibre"},
  sec:["{PatronLN} ne compte pas payer : la prime n'existe pas, et il espère qu'aucune équipe n'arrivera.","L'incendie a été allumé exprès, par quelqu'un qui veut ruiner ceux qui exploitent le puits."],
  fiches:[["Le contremaître","patronL"],["L'autre conducteur","mercenaire"],["Le mécanicien","marchand"],["Celui qui connaît la route","ancien"]]},

 furyroad:{g:"escorte",t:["La route de la fureur","La fuite","Retour vers l'oasis"],
  persos:{tyran:"un seigneur de guerre qui contrôle l'eau",fugitive:"une captive qui ne veut plus l'être"},
  pitch:"{TyranD} règne sur {ville} grâce à l'eau qu'il est seul à posséder. {FugitiveD} s'est enfuie avec d'autres captives, cachées dans {convoi}. Les coureurs les escortent vers une terre promise, à travers {route}, pendant que toute l'armée {dtyranN} est lancée à leurs trousses.",
  a1:"Les coureurs sont recrutés pour conduire {convoi}, ou pris en otage par {fugitiveN}, qui détourne le convoi. Derrière, des tambours, des moteurs ou des cavaliers : {tyranN} a lancé ses hommes à leur poursuite.\nEnjeu : la liberté des fugitives.",
  a2:"La poursuite ne s'arrête jamais. Chaque arrêt rapproche les poursuivants.",
  prep:[
   {t:"Le passage",voir:"Un défilé tenu par une bande, qui fait payer le passage.",qui:"{ChefGangD} veut sa part, ou les fugitives.",gagne:"le passage, et une bande qui retient les poursuivants derrière les coureurs.",rate:"il faut forcer le passage, et perdre du temps.",renc:{k:"humains",diff:"facile",siRate:1}},
   {t:"La tempête",voir:"Une tempête barre la route : sable, neige ou pluie torrentielle.",qui:"{FugitiveN} connaît un chemin à travers, dangereux.",gagne:"la tempête traversée : les poursuivants perdent la trace pendant un jour.",rate:"le convoi est endommagé et ralenti."},
   {t:"La terre promise",voir:"Le lieu où {fugitiveN} veut aller n'existe plus : il n'en reste que des ruines.",qui:"{AncienD}, survivant de ce lieu, rejoint le convoi.",gagne:"une idée folle : faire demi-tour et prendre la citadelle de {tyranN}, vide de ses guerriers.",rate:"le convoi erre, sans but, et perd courage."}],
  a3:"L'armée {dtyranN} rattrape le convoi. Des guerriers sautent à l'abordage, et l'un des fugitifs est repris.",r3:{k:"humains",diff:"equilibre"},
  a4:"Sur {route}, à pleine vitesse, {tyranN} en personne lance l'assaut final sur le convoi.",
  si:["S'ils ont négocié le passage : la bande attaque l'arrière-garde {dtyranN}.","S'ils ont semé la poursuite dans la tempête : {tyranN} n'a qu'une partie de ses hommes.","S'ils font demi-tour : la citadelle est presque vide, et les coureurs peuvent s'en emparer."],
  opts:["Abattre {tyranN} : sans lui, l'armée se disperse.","Bloquer la route derrière le convoi.","Rejoindre la citadelle et libérer l'eau pour tous."],
  r4:{k:"perso",role:"tyran",b:["veteran","lieutenant","seigneur"],troupe:"humains",diff:"rude"},
  sec:["Un des guerriers {dtyranN} a changé de camp, et il aide les coureurs en secret.","{FugitiveN} est l'héritière {dtyranN} : elle seule peut réclamer la citadelle."],
  fiches:[["Le seigneur de guerre","tyran"],["La fugitive","fugitive"],["Le chef de la bande","chefGang"],["Le survivant","ancien"]]},

 anneau:{g:"escorte",t:["Le porteur","Le fardeau","Jusqu'à la montagne de feu"],
  persos:{porteur:"un porteur innocent",seigneur:"un seigneur ancien, tapi dans l'ombre"},
  pitch:"{Relique} donne un pouvoir immense, et corrompt quiconque la porte. Elle appartient à {seigneurD}, qui la cherche par tous les moyens. Les coureurs escortent {porteurD} jusqu'au seul endroit où l'on peut la détruire, à l'autre bout du monde, pendant que les serviteurs du seigneur les traquent.",
  a1:"{AncienD} réunit les coureurs : {porteurN} a hérité de {relique}, et des cavaliers sinistres le cherchent déjà. Il faut partir cette nuit, et ne jamais l'utiliser.\nEnjeu : tout.",
  a2:"Trois épreuves sur la route. Et chaque nuit, {relique} murmure à l'oreille de l'un des coureurs.",
  prep:[
   {t:"Le refuge",voir:"Un refuge ancien où vivent des sages.",qui:"Le maître des lieux offre conseil, vivres et armes.",gagne:"des armes qui blessent les serviteurs du seigneur, et des vivres pour la route.",rate:"les coureurs repartent les mains vides."},
   {t:"Le guide",voir:"Un être misérable suit la compagnie : il a porté {relique} autrefois, et la veut.",qui:"Ce guide connaît un chemin secret, mais ment comme il respire.",gagne:"le chemin secret, qui évite les armées du seigneur.",rate:"il faut passer par la route principale, sous les yeux de l'ennemi."},
   {t:"La tentation",voir:"Chaque nuit, {relique} promet à un coureur ce qu'il désire le plus.",qui:"{PorteurN} commence à changer.",gagne:"le groupe reste uni : aucun coureur n'a cédé à la tentation.",rate:"un coureur a cédé : il tente de voler {relique} au climax."}],
  a3:"Les serviteurs du seigneur rattrapent la compagnie. {PorteurN} est blessé par une lame maudite, et la corruption gagne.",r3:{k:"tueur",diff:"equilibre",nom:"Serviteur du seigneur"},
  a4:"Au bord du gouffre de feu, {porteurN} n'arrive plus à lâcher {relique}. Les serviteurs du seigneur arrivent.",
  si:["S'ils ont des armes du refuge : elles blessent les serviteurs, qui reculent.","S'ils ont pris le chemin secret : ils arrivent avant l'ennemi, et le guide les a suivis.","Si personne n'a cédé : le groupe peut aider {porteurN} à lâcher prise."],
  opts:["Aider {porteurN} à jeter {relique} dans le feu.","Retenir les serviteurs du seigneur pendant qu'il s'approche du bord.","Laisser le guide s'emparer de {relique}… et tomber avec elle."],
  r4:{k:"tueur",diff:"rude",nom:"Serviteur du seigneur"},
  sec:["{AncienN} veut {relique} pour lui, en secret.","Détruire {relique} affaiblit tout ce qui est magique ou extraordinaire dans le monde."],
  fiches:[["Les serviteurs","tueur","Serviteur du seigneur"],["Le porteur","porteur"],["Le sage","ancien"],["Le seigneur","seigneur"]]},

 terminator:{g:"escorte",t:["Le tueur","Il ne s'arrêtera pas","Sauver l'avenir"],
  rdef:{_:"un tueur venu d'ailleurs, qui ne s'arrête jamais"},
  pitch:"{ProtegeD} ne le sait pas encore, mais son enfant changera le monde. Quelqu'un a envoyé {ressort} pour la tuer avant. Les coureurs doivent la protéger d'un tueur qui ne dort pas, ne ressent rien, et ne s'arrête jamais.",
  persos:{protege:"une personne ordinaire, au destin extraordinaire"},
  a1:"Un inconnu, à bout de forces, prévient les coureurs : {protegeN} va être tuée cette nuit, et il faut l'emmener loin. Quelques minutes plus tard, une silhouette entre dans {lieuPublic} et tire sur tout ce qui bouge.\nEnjeu : l'avenir.",
  a2:"Le tueur ne s'arrête jamais. On ne peut que le ralentir, l'éviter, ou le piéger.",
  prep:[
   {t:"La fuite",voir:"Il faut quitter {ville}, vite.",qui:"{AllieD} peut fournir {monture}, et une cachette.",gagne:"une cachette sûre, et du temps pour respirer.",rate:"le tueur retrouve les coureurs dès la première nuit.",renc:{k:"tueur",diff:"equilibre",siRate:1}},
   {t:"La vérité",voir:"L'inconnu raconte d'où il vient.",qui:"Il sait ce qu'est le tueur, et comment il fonctionne.",gagne:"le point faible du tueur : il faut le détruire entièrement, par le feu, l'écrasement ou une chute.",rate:"les coureurs ignorent comment l'arrêter."},
   {t:"Les autorités",voir:"{Loi} recherche les coureurs, qu'on croit responsables des morts.",qui:"{CapitaineD} veut comprendre.",gagne:"{capitaineN} se range de leur côté.",rate:"les coureurs sont recherchés partout."}],
  a3:"Le tueur retrouve la cachette. L'inconnu se sacrifie pour gagner du temps.",r3:{k:"tueur",diff:"equilibre"},
  a4:"Dans {repaire}, une usine, une forge ou un gouffre, le tueur poursuit {protegeN}. Il est blessé, mais rien ne l'arrête.",
  si:["S'ils ont une cachette : {protegeN} est prête, et les coureurs ont un plan.","S'ils connaissent son point faible : ils l'ont attiré exprès dans un lieu où l'on peut le détruire.","Si {capitaineN} les aide : {ilcapitaine} retient le tueur 2 tours."],
  opts:["L'écraser, le brûler ou le précipiter dans le vide.","Protéger {protegeN} et fuir encore.","Se sacrifier pour gagner du temps."],
  r4:{k:"tueur",diff:"rude"},
  sec:["L'inconnu est le père de l'enfant à venir.","Un deuxième tueur est déjà en route."],
  fiches:[["Le tueur","tueur"],["La protégée","protege"],["L'allié","allie"],["L'officier","capitaine"]]},

 et:{g:"escorte",t:["Rentrer chez soi","La petite créature","Le dernier vol"],
  persos:{petit:"une petite créature tombée du ciel",chasseurG:"un agent obstiné, qui veut la capturer"},
  pitch:"{PetitD} s'est perdue à {village}. Elle est gentille, curieuse, et elle dépérit loin des siens. Les coureurs doivent l'aider à rentrer, et pour ça, retrouver le lieu où les siens viendront la chercher. {ChasseurGD} et {loi} la veulent pour l'étudier.",
  a1:"{AllieD} cache une petite créature dans sa maison, et appelle les coureurs. Elle parle peu, mais montre le ciel.\nEnjeu : sa survie.",
  a2:"Plus le temps passe, plus la créature faiblit.",
  prep:[
   {t:"Le signal",voir:"La créature veut assembler un signal pour appeler les siens.",qui:"{MarchandD} a les pièces, mais pose des questions.",gagne:"le signal envoyé : les siens viendront à un lieu et une heure précis.",rate:"le signal est faible : les siens arriveront en retard."},
   {t:"Les agents",voir:"Des agents fouillent {village}.",qui:"{ChasseurGN}, poli et implacable.",gagne:"les agents lancés sur une fausse piste.",rate:"les agents trouvent la maison {dallieN}.",renc:{k:"humains",diff:"facile",siRate:1}},
   {t:"La créature malade",voir:"La créature pâlit, et {allieN} aussi.",qui:"{MedecinD} peut aider sans poser de questions.",gagne:"la créature reprend des forces : elle pourra aider au climax.",rate:"la créature est très faible."}],
  a3:"Une nuit, {chasseurGN} et ses hommes envahissent la maison, mettent tout le monde en quarantaine et emportent la créature, mourante, dans leur camp, sous bonne garde.",r3:{k:"humains",diff:"equilibre"},

Object.assign(OEUVRES_H,{
 chevauchee:{g:"escorte",t:["La chevauchée","Le dernier relais","Territoire hostile"],

  fiches:[["Le prétendant","pretendant"],["Le voyageur","allie"],["Le géant","geant"]]},

 septsamourais:{g:"siege",t:["Les sept","Le village","Défendre ceux qui ne savent pas se battre"],
  persos:{brigand:"un chef de brigands impitoyable"},

  a1:"{AncienD} vient chercher les coureurs à {ville} : chez {luiancien}, à {village}, la bande attaquera dans quelques jours. Les habitants offrent tout ce qu'ils ont : le gîte, le couvert, et leur reconnaissance.\nPaie : de quoi manger, et l'honneur.",

  opts:["Abattre {brigandN}.","Tenir jusqu'à ce que la bande se disperse.","Attaquer le camp des brigands."],
  r4:{k:"perso",role:"brigand",b:["veteran","lieutenant","seigneur"],troupe:"humains",diff:"rude"},
  sec:["Un habitant a vendu les défenses aux brigands, contre la vie sauve.","{AncienN} sait que les défenseurs repartiront, même vainqueurs, sans jamais être acceptés."],

 assaut:{g:"siege",t:["Le prisonnier","Tenir la prison","Jusqu'à l'arrivée des juges"],
  persos:{prisonnier:"le frère d'un puissant propriétaire",baron:"un puissant propriétaire, prêt à tout pour libérer son frère"},
  pitch:"Les coureurs ont arrêté {prisonnierD} pour un meurtre commis devant témoins. Il faut le garder jusqu'à l'arrivée {dloi}, dans quatre jours. {BaronD} a juré de le libérer, et ses hommes encerclent la ville. Personne n'ose aider les coureurs.",
  a1:"Dans {prison}, les coureurs gardent {prisonnierN}, qui ricane derrière les barreaux. Seuls deux alliés restent : {allieD}, ancien adjoint tombé dans la boisson, et {ancienD}, boiteux et bavard, mais fidèle. Dans la rue, les hommes {dbaronN} jouent du couteau en souriant.\nPaie : {rec}.",

   {t:"Les vivres et les munitions",voir:"Les hommes {dbaronN} empêchent toute livraison à la prison.",qui:"{MarchandD}, terrorisé, peut faire passer des vivres et des munitions par l'arrière de sa boutique.",gagne:"de quoi tenir le siège : munitions en abondance au climax.",rate:"les munitions manquent : chaque coureur ne pourra tirer que 3 fois au climax."},
   {t:"Le plan du baron",voir:"Les hommes {dbaronN} provoquent les coureurs dans {basFonds}, ou sur la place.",qui:"Un homme de main ivre parle trop.",gagne:"le plan {dbaronN} : il prendra un otage pour forcer un échange.",rate:"la provocation tourne à la bagarre générale.",renc:{k:"humains",diff:"facile",siRate:1}}],
  a3:"{BaronN} frappe : {allieN} est capturé{allieE} dans une ruelle. Le baron fait savoir qu'il propose un échange, à l'aube, sur la grand-place.",r3:{k:"humains",diff:"equilibre"},
  a4:"À l'aube, sur la grand-place, {baronN} et ses hommes attendent avec {allieN}. Les coureurs arrivent avec le prisonnier. Tout le monde a le doigt sur la détente.",
  si:["Si {allieN} s'est racheté{allieE} avant d'être pris : {ilallie} profite de la première seconde de confusion pour se libérer et tirer.","S'ils ont des munitions : ils peuvent tenir un échange de tirs prolongé.","S'ils connaissaient le plan : {ancienN} est déjà posté{ancienE} avec {explosif} près des munitions du baron."],
  opts:["Faire l'échange, et reprendre l'otage dans la confusion.","Faire sauter les munitions du baron et charger.","Défier {baronN} en duel, devant ses hommes."],
  r4:{k:"perso",role:"baron",b:["veteran","lieutenant","seigneur"],troupe:"humains",diff:"rude"},
  sec:["Le prisonnier est coupable, et {baronN} le sait : sa famille veut seulement éviter le procès, où trop de choses seraient dites.","Un témoin du meurtre a été acheté : si les juges arrivent, il se rétractera."],
  fiches:[["Le baron","baron"],["Le prisonnier","prisonnier"],["L'adjoint","allie"],["Le vieux fidèle","ancien"]]},

 assaut2:{g:"siege",t:["La nuit la plus longue","Le poste isolé","Assaut"],
  persos:{condamne:"un condamné en transfert, dangereux mais lucide"},
  pitch:"{Forteresse} devait fermer à la fin de la semaine : il n'y reste qu'une poignée de gens. Ce soir, un homme s'y réfugie, poursuivi. Derrière lui, une bande sans visage encercle les lieux en silence. Elle ne négocie pas, ne crie pas, et veut la mort de tous ceux qui sont à l'intérieur.",
  a1:"Les coureurs passent la nuit dans {forteresse}, avec {capitaineD}, deux employés et {condamneD}, qu'on transfère vers une autre prison. Un homme hagard entre en courant et s'effondre. Dehors, des silhouettes se postent, et les lumières de la rue s'éteignent une à une.\nEnjeu : survivre jusqu'au matin.",

   {t:"L'appel",voir:"Personne ne sait qu'ils sont assiégés : {appel} ne répond plus.",qui:"{CapitaineN} connaît un vieux moyen de prévenir l'extérieur, oublié de tous.",gagne:"un appel passé : les secours arriveront à l'aube, au cinquième tour du climax.",rate:"personne ne sait qu'ils sont assiégés."},
   {t:"Les barricades",voir:"Les ouvertures sont nombreuses, les portes fragiles.",qui:"Les employés, terrifiés, obéissent à qui prend les choses en main.",gagne:"un seul point d'entrée : l'ennemi doit passer par la porte principale.",rate:"l'ennemi entre par plusieurs côtés à la fois."}],
  a3:"Premier assaut : des dizaines de silhouettes se jettent sur toutes les ouvertures. Un employé tombe ; un des défenseurs est blessé.",r3:{k:"humains",diff:"equilibre"},
  a4:"Juste avant l'aube, dernier assaut : la bande enfonce la porte. Il reste un dernier recoin à tenir, et presque plus de munitions.",
  si:["Si {condamneN} est armé : il tient une porte à lui seul pendant 2 tours.","S'ils ont pu appeler : les secours arrivent au cinquième tour.","S'ils ont barricadé : l'ennemi n'entre que par un seul passage, un adversaire à la fois."],
  opts:["Tenir jusqu'à l'aube (5 tours).","Faire exploser le couloir d'entrée avec {explosif}.","Fuir par les égouts ou les caves, avec les survivants."],
  r4:{k:"humains",diff:"rude"},
  sec:["L'homme réfugié a tué le fils du chef de la bande : livrer l'homme arrêterait tout.","{CondamneN} connaît le chef de la bande, et pourrait parlementer."],
  fiches:[["Le condamné","condamne"],["L'officier","capitaine"]]},
 zoulou:{g:"siege",t:["Une poignée contre une armée","Le poste de la rivière","Tenir ou mourir"],
  pitch:"Une poignée de défenseurs, des blessés et quelques civils gardent un petit poste au bord d'une rivière. Une armée entière marche sur eux : {armee}. Fuir à découvert, c'est mourir ; il faut transformer le poste en forteresse avant ce soir.",
  a1:"Un cavalier épuisé apporte la nouvelle : l'armée principale a été écrasée, et l'ennemi arrive. {CapitaineD} commande le poste ; {medecinD} soigne une vingtaine de blessés qui ne peuvent pas marcher. {PretreD} conseille de fuir.\nPaie : la survie.",

   {t:"Les blessés",voir:"Les blessés sont dans le bâtiment principal, en bois, facile à incendier.",qui:"{MedecinN} refuse de les abandonner.",gagne:"un passage creusé de pièce en pièce, pour évacuer les blessés si le feu prend.",rate:"si le bâtiment brûle, les blessés seront perdus."},
   {t:"Les éclaireurs",voir:"Des éclaireurs ennemis observent depuis les collines.",qui:"{ChasseurD} connaît les tactiques de l'ennemi : il attaque en croissant, cornes en avant.",gagne:"savoir d'où viendra l'attaque : le premier assaut est repoussé sans perte.",rate:"l'ennemi surprend les défenseurs par les côtés.",renc:{k:"humains",diff:"facile",siRate:1}}],
  a3:"Premier assaut, puis un deuxième, puis le feu : le bâtiment des blessés s'embrase.",r3:{k:"humains",diff:"equilibre"},
  a4:"La nuit tombe, le poste est réduit à un dernier carré de caisses. L'ennemi se regroupe pour l'ultime assaut, à l'aube.",
  si:["S'ils ont un rempart continu : l'ennemi doit l'escalader, et chaque défenseur frappe avec avantage.","S'ils ont creusé le passage : les blessés sont à l'abri dans le dernier carré.","S'ils connaissent les tactiques ennemies : ils savent où concentrer leurs forces."],
  opts:["Tenir jusqu'à ce que l'ennemi, impressionné, renonce (4 tours).","Abattre le chef ennemi, visible sur la colline.","Tenter une sortie de nuit pour s'emparer des réserves ennemies."],
  r4:{k:"humains",diff:"mortel"},
  sec:["L'ennemi salue le courage des défenseurs et repart au matin : il ne cherchait qu'à éprouver leur valeur.","{PretreN} a prévenu l'ennemi de la faiblesse du poste, pour sauver sa propre vie."],
  fiches:[["L'officier","capitaine"],["Le médecin","medecin"],["L'éclaireur","chasseur"],["Le prêtre","pretre"]]},

  a1:"À {cimetiere}, une silhouette titubante attaque un passant. En quelques heures, les morts sont partout. Les coureurs se réfugient dans une maison avec {heritierD}, blessé{heritierE}, {mercenaireD} et {marchandD}, qui veut tout décider.\nEnjeu : survivre jusqu'au matin.",

   {t:"Les nouvelles",voir:"Un voyageur de passage, un messager, un voisin : on apprend ce qui se passe.",qui:"Les nouvelles parlent d'un abri où l'on se regroupe, à quelques heures de là.",gagne:"savoir qu'il faut détruire la tête pour arrêter un mort, et où se trouve l'abri.",rate:"les coureurs ignorent comment arrêter un mort."},
   {t:"La blessure",voir:"{HeritierN} a été mordu{heritierE}, et la fièvre monte.",qui:"{MarchandN} veut le garder à la cave ; d'autres veulent s'en débarrasser.",gagne:"une décision prise à temps : {heritierN} ne se relèvera pas parmi les vivants.",rate:"{heritierN} se relève, mort, au milieu du groupe pendant le climax."}],
  a3:"Les morts forcent une fenêtre. Pendant la panique, {marchandN} s'enferme dans la cave avec les armes.",r3:{k:"mortVivant",diff:"equilibre"},
  a4:"Juste avant l'aube, la maison est submergée. Il faut tenir, ou fuir vers l'abri.",

const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const cap=s=>s?s.charAt(0).toUpperCase()+s.slice(1):s;
function R(n){if(n<=1)return 0;const a=new Uint32Array(1);crypto.getRandomValues(a);return a[0]%n}
const pick=a=>a[R(a.length)];
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=R(i+1);[a[i],a[j]]=[a[j],a[i]]}return a}
const de=n=>R(n)+1;
/* "2d6+1", "d8", "1d4+1d8" → {total, detail} */
function lancer(f){
  let tot=0;const det=[];
  String(f).replace(/\s/g,"").split(/(?=[+-])/).forEach(t=>{
    const sg=t[0]==="-"?-1:1;const u=t.replace(/^[+-]/,"");const m=u.match(/^(\d*)d(\d+)$/i);
    if(m){const n=+(m[1]||1),s=+m[2];for(let i=0;i<n;i++){const v=de(s);tot+=sg*v;det.push(v)}}
    else if(u){tot+=sg*(+u);det.push((sg<0?"−":"+")+u)}
  });
  return {total:tot,detail:det};
}
const fmtJet=(f,r)=>`${f} → <b>${r.total}</b>${r.detail.length>1?` <span class="muted">(${r.detail.join(", ")})</span>`:""}`;
function toast(m){const t=$("toast");t.textContent=m;t.classList.add("on");clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove("on"),2200)}
const uid=()=>Date.now().toString(36)+R(1e6).toString(36);
/* articles : de(x) / a(x) */
function deX(x){if(/^le /i.test(x))return "du "+x.slice(3);if(/^les /i.test(x))return "des "+x.slice(4);if(/^des /i.test(x))return "de "+x.slice(4);if(/^[aeiouyéèêâîôœ]/i.test(x))return "d'"+x;return "de "+x}
function aX(x){if(/^le /i.test(x))return "au "+x.slice(3);if(/^les /i.test(x))return "aux "+x.slice(4);return "à "+x}

/* Le groupe : chaque coureur a son niveau et peut être présent ou non. joueurs/niveau restent tenus à jour pour l'affichage. */
function syncGroupe(p){if(!p.groupe)p.groupe=groupeNeuf(p.joueurs||4,p.niveau||1);const a=p.groupe.filter(c=>c.actif);
  p.joueurs=a.length;p.niveau=a.length?Math.round(a.reduce((s,c)=>s+c.niv,0)/a.length):1}

if(!DB.parties[DB.cur])DB.cur=Object.keys(DB.parties)[0]||null;
const P=()=>DB.parties[DB.cur];
function puissance(){const a=P().groupe.filter(c=>c.actif);return Math.max(1,a.reduce((s,c)=>s+Math.pow(c.niv,.7),0))}
function texteGroupe(p){p=p||P();const a=p.groupe.filter(c=>c.actif);if(!a.length)return "aucun coureur présent";
  const nv=[...new Set(a.map(c=>c.niv))].sort((x,y)=>x-y);return `${a.length} coureur${a.length>1?"s":""}, niveau${nv.length>1?"x":""} ${nv.length>1?nv[0]+" à "+nv[nv.length-1]:nv[0]}`}
const T=()=>TBY[P().theme]||THEMES[0];

/* ============ Créatures ============ */
/* ref : {th,i} adversaire du thème · {b} base du livre / figurant · {p} créature perso · {nom,b,desc} adversaire nommé */
function resoudre(ref){
  if(!ref)return null;
  if(ref.p){const c=DB.perso.find(x=>x.id===ref.p);return c?Object.assign({},c,{ref,origine:"Créature maison"}):null}
  let nom,b,desc="",caps=null,surnat=false;
  if(ref.th){const t=TBY[ref.th];const a=t&&t.advP[ref.i];if(!a)return null;({nom,b,desc,caps,surnat}=a)}
  else{b=ref.b;nom=ref.nom||BASES[b].n;desc=ref.desc||BASES[b].desc||""}
  const base=BASES[b];if(!base)return null;
  const origine=(LIVRE[b]?"D'après le bestiaire : ":"Figurant, profil : ")+base.n.toLowerCase();
  return Object.assign({},base,{nom,desc,cap:caps||base.cap,ref,b,surnat,origine:base.cat?CAT_BESTIAIRE[base.cat]+" (méthode du livre)":nom===base.n?(LIVRE[b]?"Bestiaire du livre":"Figurant générique"):origine});
}
/* Menace d'une créature : moyenne géométrique de ce qu'elle inflige et de ce qu'elle encaisse face à un coureur de niveau 1
   (attaque d20 + 1, défense d20 + 2), corrigée par ses capacités ; 1 = un orque. Estimation maison. */
const CAPM={"Projection de flammes":2,"Frénésie":1.15,"Éventration":1.15,"Paralysie":1.15,"Drain de vie":1.1,"Malédiction":1.1,"Balayage":1.1,"Double illusoire":1.1,"Carapace":1.05,"Vengeance acide":1.05};
function moyDe(f){let t=0;String(f).replace(/(\d*)d(\d+)/g,(m,n,d)=>{t+=(+(n||1))*(+d+1)/2;return m});const k=String(f).match(/\+(\d+)$/);return t+(k?+k[1]:0)}
function menaceBrute(c){const na=typeof c.na==="string"?moyDe(c.na):(c.na||1);const cl=x=>Math.min(.95,Math.max(.05,x));
  const off=na*moyDe(c.dmg||"d6")*cl((c.att-3)/20),def=(c.pv||1)/cl((22-c.def)/20);let k=1;(c.cap||[]).forEach(x=>k*=CAPM[x]||1);return Math.sqrt(off*def)*k}
const MENACE_ORQUE=menaceBrute({na:1,dmg:"d8",att:13,def:14,pv:6,cap:["Horde","Frénésie"]})/1.15;
const menace=c=>1.2*menaceBrute(c)/MENACE_ORQUE;
const DIFFS={facile:["Facile",.6],equilibre:["Équilibré",1],rude:["Rude",1.5],mortel:["Mortel",2.2]};
function budget(diff){return puissance()*DIFFS[diff][1]}
function niveauDe(sum){const r=sum/puissance();return r<.8?"facile":r<1.25?"equilibre":r<1.8?"rude":"mortel"}
const badge=k=>`<span class="niv ${k}">${DIFFS[k][0]}</span>`;
function vileniePar(c){if(c.vil)return c.vil;return c.dv>=9?3:c.dv>=7?2:0}
function poolTheme(){const t=T(),p=P();let l=t.advP.filter(a=>p.surnat||!a.surnat);if(!l.length)l=t.advP;let r=l.map(a=>({th:t.id,i:a.i}));
  const ins=p.inspis||[];if(ins.includes("jurassic")||ins.includes("mondeperdu"))r=r.concat(Object.keys(BESTIAIRE_PLUS).filter(k=>BESTIAIRE_PLUS[k].cat==="dino").map(b=>({b})));
  return r}
/* Choisit une rencontre. Renvoie {lead,troupe,diff} ; les effectifs sont recalculés à l'affichage selon le groupe. */
function tirerRencontre(diff,opt={}){
  const B=budget(diff);const pool=(opt.pool||poolTheme()).map(r=>({r,c:resoudre(r)})).filter(x=>x.c);
  const m=x=>menace(x.c);
  if(opt.lead){return {lead:opt.lead,troupe:pickTroupe(pool,B,menace(resoudre(opt.lead))),diff}}
  const opts=[];
  const solos=pool.filter(x=>m(x)>=.7*B&&m(x)<=1.4*B);if(solos.length)opts.push(()=>({lead:pick(solos).r,troupe:null,diff}));
  const chefs=pool.filter(x=>m(x)>=.3*B&&m(x)<.75*B&&x.c.dv>=3);
  if(chefs.length)opts.push(()=>{const l=pick(chefs);return {lead:l.r,troupe:pickTroupe(pool.filter(x=>x!==l),B,m(l)),diff}});
  let troupes=pool.filter(x=>m(x)<=.5*B&&m(x)>=B/12);if(!troupes.length)troupes=pool.filter(x=>m(x)<=.5*B).sort((x,y)=>m(y)-m(x)).slice(0,2);if(troupes.length)opts.push(()=>({lead:null,troupe:pick(troupes).r,diff}));
  if(!opts.length){const plusFaible=pool.slice().sort((a,b)=>m(a)-m(b))[0];return {lead:plusFaible.r,troupe:null,diff}}
  return pick(opts)();
}
function pickTroupe(pool,B,ml){const reste=B-ml;if(reste<1)return null;const ok=x=>menace(x.c)<=Math.max(1,.35*B);let c=pool.filter(x=>ok(x)&&menace(x.c)>=reste/8);if(!c.length)c=pool.filter(ok).sort((x,y)=>menace(y.c)-menace(x.c)).slice(0,2);return c.length?pick(c).r:null}
function effectifs(sp){
  if(!sp)return [];const B=budget(sp.diff);const out=[];let ml=0;
  if(sp.lead){const c=resoudre(sp.lead);if(c){out.push({c,n:1});ml=menace(c)}}
  if(sp.troupe){const c=resoudre(sp.troupe);if(c){const n=Math.max(sp.lead?0:1,Math.min(sp.lead?8:12,Math.round((B-ml)/menace(c))));if(n>0)out.push({c,n})}}
  return out;
}
function texteRencontre(sp){const e=effectifs(sp);if(!e.length)return "—";const tot=e.reduce((s,x)=>s+menace(x.c)*x.n,0);
  return e.map(x=>`<b>${x.n>1?x.n+" × ":""}${esc(x.c.nom)}</b>`).join(" et ")+" "+badge(niveauDe(tot))}
function rencHTML(sp,where,atouts){const e=effectifs(sp);
  if(atouts){const tot=e.reduce((s,x)=>s+menace(x.c)*x.n,0);const nv=[0,1,2,3].map(k=>niveauDe(tot*(1-.2*k)));const av=P().av;const nA=Object.values(av&&av.atouts||{}).filter(Boolean).length;
   return `<div class="renc">${texteRencontre(sp)}<span style="flex:1"></span><button class="mini" data-act="vers-combat" data-where="${esc(where)}">→ Combat</button><span class="small" style="flex-basis:100%"><b>Atouts obtenus : ${nA}/3</b> · difficulté actuelle ${badge(nv[Math.min(3,nA)])}${nA<3?` · avec ${nA+1} : ${DIFFS[nv[Math.min(3,nA+1)]][0].toLowerCase()}`:""}. ${nv[Math.min(3,nA)]==="mortel"?"Mieux vaut ruser, saboter ou fuir.":""}</span></div>`;
   return `<div class="renc">${texteRencontre(sp)}<span style="flex:1"></span><button class="mini" data-act="vers-combat" data-where="${esc(where)}">→ Combat</button><span class="small" style="flex-basis:100%">Avec les atouts : ${[1,2,3].map(k=>`${k} atout${k>1?"s":""} ${badge(nv[k])}`).join(" · ")}. ${nv[0]==="mortel"?"Sans aucun atout : ruse, sabotage ou fuite.":""}</span></div>`}const mort=e.length&&niveauDe(e.reduce((s,x)=>s+menace(x.c)*x.n,0))==="mortel";
  return `<div class="renc">${texteRencontre(sp)}${mort?`<span class="small muted" style="flex-basis:100%">Trop fort pour un affrontement direct : mise sur les atouts, la ruse, le sabotage ou la fuite.</span>`:""}<span style="flex:1"></span><button class="mini" data-act="vers-combat" data-where="${esc(where)}">→ Combat</button></div>`}

function genNom(t,g){t=t||T();g=g||(R(2)?"m":"f");const pr=pick(t.noms[g]);const s=pick(t.noms.s);return pr+" "+(s.length>1?(g==="f"?s[1]:s[0]):s[0])}
function genPNJ(t,gg){t=t||T();const g=gg||(R(2)?"m":"f");return {id:uid(),nom:genNom(t,g),metier:pick(t.metiers),trait:pick(COMMUN.traits),voix:pick(COMMUN.voix),envie:pick(COMMUN.envies),secret:pick(COMMUN.secrets)}}

  const r=lancer("2d6");out.push(`${r.total*10*p.niveau} ${t.monnaie}`);
  out.push(cap(pick(t.butin)));

function antagonisteAdapte(t,sauf){const ok=lim=>t.antP.filter(a=>a.nom!==sauf&&menace(BASES[a.b])<=lim);let l=ok(budget("rude"));if(l.length<2)l=l.concat(ok(budget("mortel")).filter(a=>!l.includes(a)).slice(0,2-l.length));if(!l.length)l=t.antP.filter(a=>a.nom!==sauf).sort((x,y)=>BASES[x.b].dv-BASES[y.b].dv).slice(0,1);return pick(l)}
function ctxNeuf(t){const ant=antagonisteAdapte(t);const ls=shuffle(t.lieux);
  return {a:Object.assign({},ant),comm:pick(t.commanditaires),o:pick(t.objets),o2:pick(["l'objet convoité","la prise","le butin"]),p:pick(t.personnes),l0:ls[0],l1:ls[1],lp:[ls[2],ls[3],ls[4]],amb:pick(t.ambiances),f:shuffle(t.facP.map((_,i)=>i)).slice(0,3),lieux:ls.slice(0,7),oa:R(9),oq:R(9)}}

const EPITHETES={sorcier:["l'instigateur","l'instigatrice"],lieutenant:["le chef de bande","la cheffe de bande"],seigneur:["le maître des lieux","la maîtresse des lieux"],veteran:["le vieux loup","la vieille louve"],
  chevalier:["le champion adverse","la championne adverse"],garde:["le chef des gardes","la cheffe des gardes"],golem:["la machine","la machine"],engin:["la machine","la machine"]};

  const ep=EPITHETES[b]?EPITHETES[b][f?1:0]:(f?"l'ennemie":"l'ennemi");

function eltDef(e){if(!e)return null;const d=e.id==="libre"?ELT_LIBRE:ELEMENTS[e.id];if(!d)return null;return Object.assign({},d,{nom:e.id==="libre"?e.nom:d.nom})}

function eltsChoisis(o){return [];const l=(o.elts||[]).filter(k=>ELEMENTS[k]).map(k=>({id:k}));const lib="";

function varsCtx(c,extra){const t=TBY[(P().av&&P().av.theme)||P().theme];const l=c.l||c.l1,a=nomCourt(c.a);const F=(c.f||[]).map(i=>t.facP[i].nom);
  const sec=c.a.secret.charAt(0).toLowerCase()+c.a.secret.slice(1);
  return Object.assign(designations(c),varsElt(c),{lc:c.lc||c.l1,comm:c.comm,comm2:"le commanditaire",o2:c.o2||"l'objet convoité",a,dea:deX(a),aa:aX(a),sec,o:c.o,p:c.p,l0:c.l0||(c.lieux&&c.lieux[0]),l1:c.l1,l,dl:deX(l),jl:"jusqu'"+aX(l),F1:F[0]||"",F2:F[1]||"",F3:F[2]||"",F1c:cap(F[0]||""),F1t:accFac(F[0],"tente","tentent"),F2n:accFac(F[1],"négocie","négocient"),F3a:accFac(F[2],"attend son heure","attendent leur heure"),amb:c.amb,l6:c.lieux?c.lieux[6]:c.l1,proie:c.proie?`« ${c.proieNom} »`:"la bête"},extra||{})}
function remplir(s,c,extra,brut){if(c.l0orig&&c.l0===c.l1&&/\{l0\}|\{L0\}/.test(s)&&/\{l1\}|\{L1\}|\{lc\}/.test(s))c=Object.assign({},c,{l0:c.l0orig});if(c.elt){const k=c.l0===c.l1?"l0|l1|lieu|lc":"l1|lieu|lc";s=s.replace(new RegExp("(?<!jusqu')\\bà \\{("+k+")\\}","g"),"dans {$1}").replace(new RegExp("À \\{("+k+")\\}","g"),"Dans {$1}").replace(/sur la place de \{l0\}/g,c.l0===c.l1?"au pied de {l0}":"sur la place de {l0}")}const v=varsCtx(c,extra);if(c.F)v.F=c.F;let out=s;
  for(let k=0;k<3;k++){const av=out;out=out.replace(/\{(\w+)\}/g,(m,key)=>{if(v[key]!=null)return "\u0001"+v[key];const lo=key.charAt(0).toLowerCase()+key.slice(1);if(v[lo]!=null)return "\u0001"+cap(v[lo]);return m});if(av===out)break}
  out=contracter(out);return brut?out:out.replace(/(^|\n)(\d+\. |– )?([a-zàâçéèêëîïôûùüÿœ])/g,(m,a,b,c)=>a+(b||"")+c.toUpperCase())}
/* « à le » → « au », « de les » → « des »… seulement devant un texte inséré (marqué \u0001). */

  .replace(/(^|[\s'(])([àÀ]) \u0001le /gi,(m,a,b)=>a+(b==="À"?"Au":"au")+" ").replace(/(^|[\s'(])([àÀ]) \u0001les /gi,(m,a,b)=>a+(b==="À"?"Aux":"aux")+" ")

function pisteDef(src){const [k,g,i]=src.split(":");if(k==="i")return INSPI[g].piste;return GENRES[g].pistes[+i]}
function choisirPistes(c,excl){excl=excl||{src:[],at:[]};const out=[];const usedAt=new Set(excl.at);const usedSrc=new Set(excl.src);
  const cands=g=>shuffle(GENRES[g].pistes.map((p,i)=>"g:"+g+":"+i)).filter(s=>!usedSrc.has(s));
  const insL=[c.inspi,c.inspi2].filter(k=>k&&INSPI[k]&&INSPI[k].piste&&!usedSrc.has("i:"+k)).map(k=>"i:"+k);
  const take=s=>{const d=pisteDef(s);if(usedAt.has(d.at))return false;usedAt.add(d.at);usedSrc.add(s);out.push(s);return true};
  insL.forEach(take);
  if(mixe(c))for(const s of cands(c.genre2)){if(take(s))break}
  for(const s of cands(c.genre)){if(out.length>=3)break;take(s)}
  for(const g of shuffle(Object.keys(GENRES))){if(out.length>=3)break;for(const s of cands(g)){if(out.length>=3)break;take(s)}}
  return out}

  const l=GENRES[gid].climax;return l[(c.climaxI||0)%l.length]}
function sceneDe(c,j){if(!GENRES[c.genre]||!GENRES[c.genre].scenes)return {t:"Scène",v:["Cette scène vient d'une ancienne version de l'appli : tire une nouvelle aventure pour profiter de la nouvelle structure."]};const mix=c.genre2&&c.genre2!==c.genre&&GENRES[c.genre2];const gid=mix&&j>=3?c.genre2:c.genre;const sc=GENRES[gid].scenes[j];

function C(){return P().combat}
let PROP={diff:null,liste:[]};
function proposer(){const d=PROP.diff||P().diff;const vus=new Set();const out=[];
  for(let k=0;k<30&&out.length<3;k++){const sp=tirerRencontre(d);const cle=JSON.stringify([sp.lead,sp.troupe]);if(vus.has(cle))continue;vus.add(cle);out.push(sp)}PROP.liste=out}
function ajouterCombat(c,n){
  const cb=C();n=Math.max(1,n||1);
  const caps=c.cap.slice();
  const g={id:uid(),nom:c.nom,dv:c.dv,d:c.d,att:c.att,def:c.def,pvMax:c.pv,na:c.na,dmg:c.dmg,cap:caps,pv:Array(n).fill(c.pv),cible:0,etats:[],vil:vileniePar(c),flamme:-9,surplus:n>1};
  cb.grp.push(g);journal(`${n>1?n+" × ":""}${c.nom} entre${n>1?"nt":""} en scène.`);
  if(caps.includes("Malédiction"))journal(`Malédiction de ${c.nom} : le groupe doit dépenser 2 dés d'héroïsme sans effet.`);
  sauver();
}
function journal(m){const cb=C();cb.log.unshift((cb.tour?`T${cb.tour} · `:"")+m);cb.log=cb.log.slice(0,40)}
function vivants(g){return g.pv.filter(v=>v>0).length}
function frapper(g,dmg){
  if(!(dmg>0))return;let i=g.pv[g.cible]>0?g.cible:g.pv.findIndex(v=>v>0);if(i<0)return;const tues=[];
  while(dmg>0&&i>=0){const v=g.pv[i];const prend=Math.min(v,dmg);g.pv[i]=v-prend;dmg-=prend;if(g.pv[i]<=0)tues.push(i+1);
    if(!g.surplus)break;i=g.pv.findIndex(v=>v>0)}
  if(g.pv[g.cible]<=0){const n=g.pv.findIndex(v=>v>0);if(n>=0)g.cible=n}
  if(tues.length)journal(`${g.nom}${g.pv.length>1?" ("+tues.map(n=>"n° "+n).join(", ")+")":""} hors de combat.`);
  if(!vivants(g))journal(`Tous les ${g.nom} sont vaincus.`);
}

const PLI_KEY=LS+"-plies";let PLIES={};try{PLIES=JSON.parse(localStorage.getItem(PLI_KEY)||"{}")||{}}catch(e){}
const PLI_DEFAUT=["Rappels de combat","Aide-mémoire","Inventer une créature","Appareil et sauvegarde","Journal du combat","Figures"];
function titreBloc(b){const h=b.querySelector(":scope > .bloc-h > h2, :scope > h3, :scope > .bloc-h > h3");if(!h||h.isContentEditable)return null;return h}
function pliables(vue){const v=$("v-"+vue);if(!v)return;const blocs=[...v.querySelectorAll(".bloc")].filter(b=>titreBloc(b));
  blocs.forEach(b=>{const h=titreBloc(b);const k=vue+"|"+h.textContent.replace(/^\d+\s*/,"").trim();b.classList.add("pliable");b.dataset.pli=k;
   const plie=PLIES[k]!=null?PLIES[k]:PLI_DEFAUT.includes(h.textContent.trim());b.classList.toggle("replie",plie);
   const tete=h.closest(".bloc-h")||h;tete.classList.add("tete-pli");tete.setAttribute("role","button");tete.tabIndex=0;tete.setAttribute("aria-expanded",String(!plie))});
  let bar=v.querySelector(":scope > .barre-pli");if(blocs.length>=3){if(!bar){bar=document.createElement("div");bar.className="barre-pli no-print";bar.innerHTML=`<button class="mini ghost" data-pliall="1">Tout replier</button><button class="mini ghost" data-pliall="0">Tout déplier</button>`;v.prepend(bar)}}else if(bar)bar.remove()}
function basculerPli(b,etat){const plie=etat!=null?etat:!b.classList.contains("replie");b.classList.toggle("replie",plie);PLIES[b.dataset.pli]=plie;
  const t=b.querySelector(".tete-pli");if(t)t.setAttribute("aria-expanded",String(!plie));try{localStorage.setItem(PLI_KEY,JSON.stringify(PLIES))}catch(e){}}
document.addEventListener("click",e=>{const t=e.target.closest(".tete-pli");if(!t||e.target.closest("button,input,select,textarea,a,[contenteditable]"))return;const b=t.closest(".pliable");if(b)basculerPli(b)},true);
document.addEventListener("keydown",e=>{if((e.key==="Enter"||e.key===" ")&&e.target.classList&&e.target.classList.contains("tete-pli")){e.preventDefault();basculerPli(e.target.closest(".pliable"))}});
document.addEventListener("click",e=>{const b=e.target.closest("[data-pliall]");if(!b)return;const v=b.closest(".vue");v.querySelectorAll(".pliable").forEach(x=>basculerPli(x,b.dataset.pliall==="1"))});

/* Toute vue redessinée (même partiellement) retrouve ses sections repliables */
const OBS=new MutationObserver(ms=>{const vs=new Set(ms.map(m=>m.target.closest&&m.target.closest(".vue")).filter(Boolean));vs.forEach(v=>{if(!v.querySelector(".pliable")||[...v.querySelectorAll(".bloc")].some(b=>titreBloc(b)&&!b.classList.contains("pliable")))pliables(v.id.slice(2))})});
document.querySelectorAll(".vue").forEach(v=>OBS.observe(v,{childList:true}));

/* ============ Navigation et rendu ============ */
let ONGLET="accueil";
const RENDUS={accueil:rendreAccueil,partie:rendrePartie,aventure:rendreAventure,bestiaire:rendreBestiaire,combat:rendreCombat,outils:rendreOutils,notes:rendreNotes};
function rendre(){if(!P()&&ONGLET!=="accueil")ONGLET="accueil";document.body.classList.toggle("a-accueil",ONGLET==="accueil");rendreResume();RENDUS[ONGLET]();pliables(ONGLET);
  document.querySelectorAll(".vue").forEach(v=>v.classList.toggle("active",v.id==="v-"+ONGLET));
  document.querySelectorAll("[data-tab]").forEach(b=>b.setAttribute("aria-current",b.dataset.tab===ONGLET?"page":"false"))}
function aller(o){ONGLET=o;if(o!=="accueil"){P().vu=Date.now();sauver()}rendre();window.scrollTo({top:0})}
function ouvrir(id){DB.cur=id;BEST.renc=null;PROP.liste=[];P().vu=Date.now();sauver();aller(P().av?"aventure":"partie")}

/* ============ Événements ============ */
document.addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b)return;const d=b.dataset;const p=P();
  if(d.tab){aller(d.tab);return}
  if(d.go){aller(d.go);return}
  /* Partie */
  if(d.theme){p.theme=d.theme;if(d.theme==="medieval")p.surnat=false;BEST.renc=null;sauver();rendre();return}
  if(d.cniv!=null){const c=p.groupe[+d.cniv];c.niv=Math.max(1,Math.min(6,c.niv+(+d.d)));syncGroupe(p);sauver();rendre();return}
  if(d.cact!=null){const c=p.groupe[+d.cact];c.actif=!c.actif;syncGroupe(p);sauver();rendre();toast(`${c.nom} : ${c.actif?"présent":"absent"}.`);return}
  if(d.csup!=null){if(!confirmer(b,"Sûr ?"))return;p.groupe.splice(+d.csup,1);syncGroupe(p);sauver();rendre();return}
  if(d.act==="c-ajout"){const niv=p.niveau||1;p.groupe.push({id:uid(),nom:"Coureur "+(p.groupe.length+1),niv,actif:true});syncGroupe(p);sauver();rendre();return}
  if(d.act==="c-monte"){p.groupe.forEach(c=>{if(c.actif&&c.niv<6)c.niv++});syncGroupe(p);sauver();rendre();toast("Les coureurs présents montent d'un niveau.");return}
  /* Accueil */
  if(d.act==="nouv"){NOUV={theme:(p&&p.theme)||"fantasy",n:4,niv:1,type:"oneshot",surnat:true,surprise:"revisite",genres:[],inspis:[],elts:[]};rendreAccueil();window.scrollTo({top:0});return}
  if(d.act==="nouv-annuler"){NOUV=null;rendreAccueil();return}
  if(d.ntheme){NOUV.theme=d.ntheme;if(d.ntheme==="medieval")NOUV.surnat=false;NOUV.ouverte=1;rendreAccueil();return}
  if(d.npas!=null){NOUV.ouverte=+d.npas;rendreAccueil();const o=document.querySelector(".pas.ouvert");if(o)o.scrollIntoView({block:"start",behavior:"smooth"});else document.querySelector(".lancer")?.scrollIntoView({block:"center",behavior:"smooth"});return}
  if(d.nn){NOUV.n=Math.max(1,Math.min(8,NOUV.n+(+d.nn)));rendreAccueil();return}
  if(d.nniv){NOUV.niv=+d.nniv;rendreAccueil();return}
  if(d.ntype){NOUV.type=d.ntype;rendreAccueil();return}
  if(d.act==="nouv-go"){nouvellePartie(NOUV);NOUV=null;nouvelleAventure();BEST.renc=null;PROP.liste=[];aller("aventure");return}
  if(d.ouvrir){ouvrir(d.ouvrir);return}
  if(d.suppr){if(!confirmer(b,"Toucher encore pour supprimer"))return;delete DB.parties[d.suppr];if(DB.cur===d.suppr)DB.cur=Object.keys(DB.parties)[0]||null;sauver();rendreAccueil();toast("Partie supprimée.");return}
  /* Combat : propositions */
  if(d.pd){PROP.diff=d.pd;p.diff=d.pd;proposer();sauver();rendreCombat();return}
  if(d.act==="proposer"){proposer();rendreCombat();return}
  if(d.act==="prop-go"){effectifs(PROP.liste[+d.i]).forEach(x=>ajouterCombat(x.c,x.n));PROP.liste=[];rendreCombat();rendreResume();toast("Adversaires ajoutés au combat.");window.scrollTo({top:document.querySelector(".groupes")?.offsetTop-80||0,behavior:"smooth"});return}
  if(d.type){p.type=d.type;sauver();rendre();return}
  if(b.id==="btCode"){const code=btoa(unescape(encodeURIComponent(JSON.stringify(DB))));copier(code,"Code copié : colle-le sur l'autre appareil.");return}
  if(b.id==="btImport"){const z=$("zoneCode");if(z.hidden){z.hidden=false;z.focus();b.textContent="Importer";return}
    try{const x=JSON.parse(decodeURIComponent(escape(atob(z.value.trim()))));if(!x.parties)throw 0;Object.assign(DB.parties,x.parties);(x.perso||[]).forEach(c=>{if(!DB.perso.some(y=>y.id===c.id))DB.perso.push(c)});sauver();rendre();toast("Parties importées.")}catch(err){toast("Ce code n'est pas valide.")}return}
  /* Aventure */
  if(d.surp){const o=d.cible==="n"?NOUV:p;o.surprise=d.surp;if(d.cible==="n")rendreAccueil();else{sauver();rendreAventure()}return}
  if(d.tg!=null||d.ti!=null||d.te!=null){const o=d.cible==="n"?NOUV:p;const tog=(arr,k,max)=>{o[arr]=(o[arr]||[]).filter(Boolean);const i=o[arr].indexOf(k);if(i>=0)o[arr].splice(i,1);else if(o[arr].length<max)o[arr].push(k)};
    if(d.tg!=null){if(d.tg==="")o.genres=[];else{o.genres=(o.genres||[]).includes(d.tg)?[]:[d.tg]}if(o.genres.length)o.inspis=(o.inspis||[]).filter(k=>!INSPI[k]||o.genres.includes(INSPI[k].g)||true)}
    if(d.ti!=null){o.inspis=(o.inspis||[]).includes(d.ti)?[]:[d.ti];if(d.cible==="n"&&o.inspis.length)NOUV.ouverte=-1}
    if(d.te!=null)tog("elts",d.te,2);
    if(d.cible==="n")rendreAccueil();else{sauver();rendreAventure()}return}
  if(d.elt){p.elts=p.elts||[];const i=p.elts.indexOf(d.elt);if(i>=0)p.elts.splice(i,1);else if(eltsChoisis(p).length<2)p.elts.push(d.elt);sauver();rendreAventure();return}
  if(d.nelt){NOUV.elts=NOUV.elts||[];const i=NOUV.elts.indexOf(d.nelt);if(i>=0)NOUV.elts.splice(i,1);else if(eltsChoisis(NOUV).length<2)NOUV.elts.push(d.nelt);rendreAccueil();return}
  if(d.genre){p.genre=d.genre;if(p.inspi&&(!INSPI[p.inspi]||INSPI[p.inspi].g!==d.genre))p.inspi="";if(p.genre2===d.genre)p.genre2="";sauver();rendreAventure();return}
  if(d.inspi!=null&&d.act==null&&b.classList.contains("chip")&&b.closest("#v-aventure")){p.inspi=d.inspi;sauver();rendreAventure();return}
  if(d.act==="choix-ouvrir"){CHOIX_OUVERT=true;rendreAventure();return}
  if(d.act==="choix-fermer"){CHOIX_OUVERT=false;rendreAventure();return}
  if(d.ngenre){NOUV.genre=d.ngenre;if(NOUV.inspi&&INSPI[NOUV.inspi].g!==d.ngenre)NOUV.inspi="";if(NOUV.genre2===d.ngenre)NOUV.genre2="";rendreAccueil();return}
  if(d.ninspi!=null){NOUV.inspi=d.ninspi;rendreAccueil();return}
  if(d.act==="av-neuve"){if(p.av&&!confirmer(b,"Toucher encore : l'aventure actuelle sera remplacée"))return;nouvelleAventure();CHOIX_OUVERT=false;aller("aventure");return}
  if(d.act==="relancer"){const bl=p.av.blocs[+d.ix];
    if(bl.k==="piste"){const autres=p.av.blocs.filter(x=>x.k==="piste"&&x!==bl);bl.r=BLOCS.piste.tirer(bl.j,p.av.c,{src:[bl.r.src,...autres.map(x=>x.r.src)],at:autres.map(x=>pisteDef(x.r.src).at)})}
    else if(bl.k==="h_pitch"){const c=p.av.c;c.hv=(c.hv||0)+1;p.av.atouts={};p.av.blocs.forEach(x=>{if(x.k.startsWith("h_")){delete x.t;x.r=BLOCS[x.k].tirer(x.j,c)}});
      if(histoire(c).bete&&!c.proie){const pr=choisirProie();if(pr){c.proie=pr;c.proieNom=resoudre(pr).nom}}sauver();rendreAventure();toast("Une autre histoire, avec les mêmes personnages.");return}
    else if(bl.k==="h_sec"){p.av.c.sec=(p.av.c.sec||0)+1}
    else if(bl.k==="twist"){const autres=p.av.blocs.filter(x=>x.k==="twist"&&x!==bl).map(x=>twistDef(x.r.tw));bl.r=BLOCS.twist.tirer(bl.j,p.av.c,{ids:[bl.r.tw,...autres.map(x=>x.id)],e:autres.map(x=>x.e)});p.twistsVus=[...(p.twistsVus||[]),bl.r.tw].slice(-10)}
    else if(bl.k==="climax"){p.av.c.climaxI=(p.av.c.climaxI||0)+1;p.av.c.climaxGenre=1;bl.r=BLOCS.climax.tirer(0,p.av.c)}
    else bl.r=BLOCS[bl.k].tirer(bl.j,p.av.c);delete bl.t;
    if(bl.k==="lieu"){bl.r.amb=1+R(4);bl.r.q=1+R(4)}
    if(bl.k==="final")bl.r.troupe=tirerRencontre(bl.r.diff,{lead:{b:p.av.c.a.b}}).troupe;
    if(bl.k==="chapitre"){bl.r.renc=tirerRencontre(bl.r.diff);if(bl.j===bl.n-1)bl.r.troupe=tirerRencontre("rude",{lead:{b:p.av.c.a.b}}).troupe}
    sauver();rendreAventure();return}
  if(d.act==="ctx"){const t=TBY[p.av.theme],c=p.av.c;
    if(d.k==="a"){c.a=Object.assign({},antagonisteAdapte(t,c.a.nom));p.av.blocs.forEach(bl=>{if(bl.k==="climax"||bl.k==="final"||(bl.k==="gscene"&&sceneDe(c,bl.j).renc==="final"))bl.r.troupe=tirerRencontre(bl.r.diff||"rude",{lead:{b:c.a.b}}).troupe})}
    if(d.k==="comm"){c.comm=pick(t.commanditaires.filter(x=>x!==c.comm));if(c.v3){const g=genreDe(c.comm);c.commN=genNom(t,g);c.commG=g}}
    if(d.k==="noms"&&c.ho)nomsH(c,t);
    if(d.k==="al"){const g=R(2)?"m":"f";c.allie=Object.assign(genPNJ(t,g),{g})}
    if(d.k==="prot"){const pe=pick(t.personnes);const g=genreDe(pe);c.prot={nom:genNom(t,g),d:pe,g}}
    if(d.k==="bete"){const pr=choisirProie();if(pr){c.proie=pr;c.proieNom=resoudre(pr).nom}}
    if(d.k==="o"){c.o=pick(t.objets.filter(x=>x!==c.o));c.p=pick(t.personnes.filter(x=>x!==c.p))}
    if(d.k==="l"){const ls=shuffle(t.lieux);c.l0=ls[0];if(!c.elt){c.l1=ls[1];c.lp=[ls[2],ls[3],ls[4]]}if(c.v3)lieuxH(c,t)}
    sauver();rendreAventure();toast("Les scènes non retouchées suivent le changement.");return}
  if(d.cran){const n=+d.cran;p.av.cran=(p.av.cran||0)===n?n-1:n;sauver();rendreAventure();return}
  if(d.atout!=null){p.av.atouts=p.av.atouts||{};p.av.atouts[d.atout]=!p.av.atouts[d.atout];sauver();rendreAventure();return}
  if(d.act==="lancer-table"){const r=lancer("1d4+1d8");$("resTable").innerHTML=fmtJet("1d4+1d8",r);document.querySelectorAll(".table-renc tr").forEach(tr=>tr.classList.toggle("tire",+tr.dataset.n===r.total));
    const tr=document.querySelector(`.table-renc tr[data-n="${r.total}"]`);if(tr)tr.scrollIntoView({block:"nearest",behavior:"smooth"});return}
  if(d.act==="faction-cachee"||d.act==="faction-cachee2"){const t=TBY[p.av.theme],c=p.av.c;const v=de(12);const m=v<=3?`<b>${v}</b> : ce figurant appartient en secret ${esc(aX(t.facP[c.f[v-1]].nom))}.`:`<b>${v}</b> : rien à cacher, il est ce qu'il paraît.`;
    const el=$(d.act==="faction-cachee"?"resCachee":"sPnj");if(d.act==="faction-cachee2")el.insertAdjacentHTML("beforeend",`<p>${m}</p>`);else el.innerHTML=m;return}
  if(d.act==="imprimer"){window.print();return}
  if(d.act==="vers-combat"){const sp=specDepuis(d.where);const e=effectifs(sp);if(!e.length)return;e.forEach(x=>ajouterCombat(x.c,x.n));aller("combat");toast("Adversaires ajoutés au combat.");return}
  /* Bestiaire */
  if(d.bf){BEST.filtre=d.bf;rendreBestiaire();return}
  if(d.rd){BEST.diff=d.rd;p.diff=d.rd;sauver();rendreBestiaire();return}
  if(d.act==="tirer-renc"){BEST.renc=tirerRencontre(BEST.diff||p.diff);rendreBestiaire();return}
  if(d.act==="nb"){BEST.nb[d.k]=Math.max(1,Math.min(20,(BEST.nb[d.k]||1)+(+d.d)));rendreBestiaire();return}
  if(d.act==="ajout-combat"){const c=resoudre(JSON.parse(d.k));ajouterCombat(c,BEST.nb[d.k]||1);rendreResume();toast(`${(BEST.nb[d.k]||1)>1?(BEST.nb[d.k])+" × ":""}${c.nom} : ajouté au combat.`);return}
  if(d.act==="suppr-perso"){DB.perso=DB.perso.filter(c=>c.id!==d.id);sauver();rendreBestiaire();return}
  if(d.cr){CREA.dv=Math.max(1,Math.min(10,CREA.dv+(+d.d)));rendreBestiaire();return}
  if(d.crd){CREA.d=+d.crd;rendreBestiaire();return}
  if(d.cra){CREA.arm=+d.cra;rendreBestiaire();return}
  if(d.crg){CREA.dmg=d.crg;rendreBestiaire();return}
  if(d.crc){const i=CREA.cap.indexOf(d.crc);if(i>=0)CREA.cap.splice(i,1);else if(CREA.cap.length<3)CREA.cap.push(d.crc);else toast("Trois capacités au plus.");rendreBestiaire();return}
  if(d.act==="creer"){const x=calcCrea();const nom=(CREA.nom||"").trim()||"Créature sans nom";if(!CREA.cap.length){toast("Choisis au moins une capacité.");return}
    DB.perso.push({id:uid(),n:nom,nom,dv:CREA.dv,d:CREA.d,att:x.att,def:x.def,pv:x.pv,na:x.na,dmg:CREA.dmg,cap:CREA.cap.slice(),desc:""});sauver();BEST.filtre="perso";CREA={nom:"",dv:3,d:8,arm:2,dmg:"d8",cap:[]};rendreBestiaire();toast(`${nom} rejoint « Mes créatures ».`);return}
  /* Combat */
  if(d.act==="tour"){const cb=C();cb.tour++;const v=de(6);const multi=cb.grp.filter(g=>vivants(g)&&typeof g.na==="string").map(g=>{const r=lancer(g.na).total;g.naTour=r;return `${g.nom} : ${r} attaques ce tour`});
    cb.init={v,na:multi.join(" · ")};journal(`Initiative : ${v}, ${v>=4?"les coureurs d'abord":"les adversaires d'abord"}.`);sauver();rendreCombat();return}
  if(d.act==="ajout-rapide"){const f=$("formRapide");f.hidden=!f.hidden;if(!f.hidden)f.nom.focus();return}
  if(d.act==="fin-combat"){if(!confirmer(b,"Toucher encore pour vider le combat"))return;const cb=C();cb.grp=[];cb.tour=0;cb.init=null;cb.log=[];sauver();rendreCombat();rendreResume();return}
  const g=d.g!=null?C().grp[+d.g]:null;
  if(d.act==="retirer"){C().grp.splice(+d.g,1);sauver();rendreCombat();rendreResume();return}
  if(d.act==="cible"){g.cible=+d.i;sauver();rendreCombat();return}
  if(d.act==="pv"){frapper(g,+d.d);sauver();rendreCombat();rendreResume();return}
  if(d.act==="pv-in"){const inp=document.querySelector(`[data-in="${d.g}"]`);const v=parseInt(inp.value,10);if(v>0){frapper(g,v);journal(`${g.nom} encaisse ${v} dégâts.`);sauver();rendreCombat();rendreResume()}else inp.focus();return}
  if(d.act==="soin"){const i=g.pv[g.cible]>0?g.cible:g.pv.findIndex(v=>v>0);if(i>=0){g.pv[i]=Math.min(g.pvMax*2,g.pv[i]+1)}sauver();rendreCombat();return}
  if(d.act==="degats"){const r=lancer(g.dmg);resGrp(d.g,`Dégâts : ${fmtJet(g.dmg,r)}`);return}
  if(d.act==="nbatt"){const r=lancer(g.na);g.naTour=r.total;sauver();resGrp(d.g,`Attaques ce tour : <b>${r.total}</b>`);return}
  if(d.act==="flamme"){const r=lancer("4d8");g.flamme=C().tour;journal(`${g.nom} projette des flammes : ${r.total} dégâts de zone.`);sauver();rendreCombat();resGrp(d.g,`Flammes : ${fmtJet("4d8",r)} · moitié sur un jet standard réussi. Pas de nouvelles flammes au prochain tour.`);return}
  if(d.act==="vilenie"){if(g.vil<=0)return;g.vil--;const r=de(6);journal(`${g.nom} dépense un dé de vilenie : ${r}.`);sauver();rendreCombat();resGrp(d.g,`Dé de vilenie : <b>${r}</b> à retirer d'un jet de joueur ou à ajouter aux dégâts. Reste ${g.vil}.`);return}
  if(d.act==="vil-plus"){g.vil++;sauver();rendreCombat();return}
  if(d.act==="etat"){const i=g.etats.indexOf(d.e);if(i>=0)g.etats.splice(i,1);else g.etats.push(d.e);sauver();rendreCombat();return}
  if(d.act==="capinfo"){const el=document.querySelector(`[data-capres="${d.g}"]`);const t=`${d.c} : ${CAPACITES[d.c]}`;if(!el.hidden&&el.textContent===t)el.hidden=true;else{el.textContent=t;el.hidden=false}return}
  /* En jeu */
  if(d.act==="g-pnj"){const n=genPNJ();const t=textePNJ(n);$("sPnj").innerHTML=`<p>${esc(t)}</p><div class="rangee fin"><button class="mini" data-act="garder-pnj">Garder dans les notes</button></div>`;$("sPnj").dataset.t=t;return}
  if(d.act==="g-nom"){$("sPnj").innerHTML=`<p class="gros" style="font-size:24px">${esc(genNom())}</p>`;return}
  if(d.act==="garder-pnj"){p.pnjs.unshift({t:$("sPnj").dataset.t});sauver();b.disabled=true;b.textContent="Gardé";return}
  if(d.act==="g-butin"){$("sButin").innerHTML=genButin().map(x=>`<p>${esc(x)}</p>`).join("");return}
  if(d.act==="g-parch"){$("sButin").innerHTML=`<p>${esc(texteParchemin(genParchemin()))}</p>`;return}
  if(d.act==="g-danger"){$("sDanger").innerHTML=`<p>${esc(genDanger())}</p>`;return}
  if(d.de){const r=lancer(d.de);$("sDes").innerHTML=`<p class="gros">${r.total}</p><p class="small muted">${d.de}${r.detail.length>1?" : "+r.detail.join(" + "):""}</p>`;return}
  if(d.rep){document.querySelectorAll("[data-rep]").forEach(x=>x.setAttribute("aria-pressed",x===b));return}
  if(d.act==="g-rep"){const dd=(document.querySelector('[data-rep][aria-pressed="true"]')||{}).dataset?.rep||"d8";const nv=+(($("repC")||{}).value||p.niveau);const r=de(+dd.slice(1));const tot=r+nv;$("sRep").innerHTML=`<p>${dd} = ${r}, + niveau ${nv} = <b>${tot}</b> : ${tot>=9?"reconnu.":"personne ne le remet."}</p>`;return}
  /* Notes */
  if(d.act==="ajout-journal"){const v=$("nvEntree").value.trim();if(!v)return;p.journal.unshift({d:Date.now(),t:v});sauver();rendreNotes();return}
  if(d.act==="suppr-journal"){if(!confirmer(b,"Encore ?"))return;p.journal.splice(+d.i,1);sauver();rendreNotes();return}
  if(d.act==="suppr-pnj"){p.pnjs.splice(+d.i,1);sauver();rendreNotes();return}
});
function resGrp(gi,html){const el=document.querySelector(`[data-res="${gi}"]`);if(el)el.innerHTML=html}
function specDepuis(w){const p=P();if(w==="best")return BEST.renc;const [k,a,n]=w.split(":");
  if(k==="bloc")return specBloc(p.av.blocs[+a]);
  if(k==="table"){const e=p.av.blocs[+a].r.e[+n];const c=p.av.c;return e.ant?{lead:{nom:cap(nomCourt(c.a)),b:c.a.b,desc:c.a.secret},troupe:e.sp.troupe,diff:"mortel"}:e.sp}}
function confirmer(b,msg){if(b.dataset.arme==="1")return true;const ancien=b.textContent;b.dataset.arme="1";b.textContent=msg;setTimeout(()=>{if(b.isConnected){b.dataset.arme="";b.textContent=ancien}},6000);return false}
function copier(txt,msg){(navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).then(()=>toast(msg)).catch(()=>{const z=$("zoneCode");z.hidden=false;z.value=txt;z.select();toast("Copie le texte affiché.")})}

document.addEventListener("input",e=>{const el=e.target;const p=P();
  if(el.dataset.cnom!=null){p.groupe[+el.dataset.cnom].nom=el.value;sauver();return}
  if(el.id==="qBest"){BEST.q=el.value;const pos=el.selectionStart;rendreBestiaire();const q=$("qBest");q.focus();q.setSelectionRange(pos,pos);return}
  if(el.id==="cNom"){CREA.nom=el.value;return}
  if(el.id==="notes"){p.notes=el.value;sauver();return}
});
document.addEventListener("change",e=>{const el=e.target;const p=P();
  if(el.id==="nSurnat"){NOUV.surnat=el.checked;return}
  if(el.dataset.toutes){const o=el.dataset.toutes==="n"?NOUV:p;o.toutes=el.checked;if(el.dataset.toutes==="n")rendreAccueil();else{sauver();rendreAventure()}return}
  if(el.id==="eltLibre"){p.eltLibre=el.value;sauver();rendreAventure();return}
  if(el.id==="nEltLibre"){NOUV.eltLibre=el.value;rendreAccueil();return}
  if(el.id==="genre2"){p.genre2=el.value;sauver();rendreAventure();return}
  if(el.id==="nGenre2"){NOUV.genre2=el.value;rendreAccueil();return}
  if(el.id==="surnat"){p.surnat=el.checked;BEST.renc=null;sauver();rendre();return}
  if(el.dataset.surplus!=null){C().grp[+el.dataset.surplus].surplus=el.checked;sauver();return}
  if(el.id==="veille"){veille(el.checked);return}
});
/* Textes retouchés à la main : enregistrés en quittant le champ */
document.addEventListener("focusout",e=>{const el=e.target;if(!el.isContentEditable)return;const p=P();const v=el.innerText.trim();
  if(el.dataset.edit==="titre"){p.av.titre=v||p.av.titre;sauver();rendreResume();return}
  if(el.dataset.bloc!=null){const bl=p.av.blocs[+el.dataset.bloc];if(v!==texteBloc(Object.assign({},bl,{t:null}))){bl.t=v;el.classList.add("edite")}else{delete bl.t;el.classList.remove("edite")}sauver();return}
  if(el.dataset.journal!=null){p.journal[+el.dataset.journal].t=v;sauver();return}
  if(el.dataset.pnj!=null){p.pnjs[+el.dataset.pnj].t=v;sauver();return}
});
document.addEventListener("keydown",e=>{const el=e.target;
  if(e.key==="Enter"&&el.dataset&&el.dataset.in!=null){e.preventDefault();document.querySelector(`[data-act="pv-in"][data-g="${el.dataset.in}"]`).click()}
  if(e.key==="Enter"&&el.dataset&&el.dataset.edit==="titre"){e.preventDefault();el.blur()}
});
document.addEventListener("submit",e=>{if(e.target.id!=="formRapide")return;e.preventDefault();const f=e.target;const n=Math.max(1,Math.min(20,+f.n.value||1));const pv=Math.max(1,+f.pv.value||1);
  ajouterCombat({nom:f.nom.value.trim()||"Adversaire",dv:1,d:8,att:+f.att.value||13,def:+f.def.value||12,pv,na:1,dmg:"d6",cap:[]},n);rendreCombat();rendreResume()});

/* Garder l'écran allumé pendant le combat */
let VEILLE=null;
async function veille(on){try{if(on&&"wakeLock"in navigator){VEILLE=await navigator.wakeLock.request("screen");toast("L'écran reste allumé.")}else if(VEILLE){await VEILLE.release();VEILLE=null}}catch(err){toast("Ce navigateur ne peut pas garder l'écran allumé.")}}
document.addEventListener("visibilitychange",()=>{if(VEILLE&&document.visibilityState==="visible")veille(true)});

rendre();

</script>
