 piste:{t:"La seconde affaire",v:"Loin de l'enquête principale, à {lieu}, une affaire mineure (une profanation, un vol d'archives) cache la clé de tout : {indice}.",at:"preuve",obst:"epreuve"}},
retour:{g:"enquete",nom:"Réparer le passé avant de disparaître",ref:"Retour vers le futur",
 adn:"Course contre la montre, ton léger, paradoxes : un événement du passé a été modifié, et les coureurs doivent tout remettre en ordre avant que leur propre existence ne s'efface.",
 accroche:["Les coureurs se réveillent à {l0}, mais tout a changé : {comm} ne les reconnaît pas, et un portrait de famille pâlit à vue d'œil. Quelqu'un a modifié le passé.\nPaie : leur propre existence."],
 synopsis:["Une machine, un sort ou un objet ancien a renvoyé quelqu'un en arrière, et le présent se défait. {A} a changé un seul événement pour s'emparer de {o}. Il faut retrouver ce moment exact, le rétablir sans tout aggraver, et revenir avant la fin du compte à rebours."],
 climax:{mode:"rituel",v:"Le moment clé arrive, à {l1}. {A} est là pour l'empêcher. L'éclair, la marée ou l'alignement ne dure que 4 tours : passé ce délai, le changement devient définitif.",opts:["Remettre l'événement sur ses rails, même si cela coûte (jet standard).","Retenir l'adversaire loin du moment clé (3 tours).","Utiliser ce qu'on sait du futur pour le piéger."]}},
/* ---------- Horreur ---------- */
it:{g:"horreur",nom:"La chose qui revient, et les peurs d'enfance",ref:"Ça, de Stephen King",
 adn:"Une ville qui oublie, une chose qui revient tous les vingt-sept ans et prend la forme de ce qu'on craint le plus. La force du groupe, c'est l'amitié et les souvenirs partagés.",
 accroche:["À {l0}, les enfants disparaissent à nouveau, comme jadis. Les coureurs ont grandi ici, ou y ont un lien. {Comm} leur envoie une lettre : « Il est revenu. »\nPaie : {rec}."],
 synopsis:["Tous les vingt-sept ans, quelque chose se réveille sous {l0} et se nourrit des peurs. Les adultes oublient, les enfants voient. La chose prend le visage de ce que chaque coureur redoute le plus, et {a} la nourrit en secret."],
 piste:{t:"La peur de chacun",v:"À {lieu}, la chose apparaît à un coureur sous la forme de sa pire peur (demande au joueur de la décrire). La surmonter, c'est découvrir sa faiblesse.",at:"faiblesse",obst:"epreuve"}},
gremlins:{g:"horreur",nom:"De petites créatures qui se multiplient",ref:"Gremlins, de Joe Dante",
 adn:"Horreur comique : des créatures adorables, trois règles à ne pas enfreindre, et une nuit où tout dégénère. Elles sabotent, rient et se multiplient.",
 accroche:["{Comm} confie aux coureurs une petite créature adorable, achetée à {l0}, avec trois règles strictes. Évidemment, l'une est enfreinte dès le premier soir.\nPaie : {rec}."],
 synopsis:["Une créature mignonne, trois interdits, et une ville en fête. Une règle enfreinte, et la créature se multiplie en dizaines de petits monstres farceurs et cruels. {A} compte bien les utiliser à ses fins."],
 climax:{mode:"rituel",v:"La horde s'est rassemblée à {l1}, et elle se multiplie encore : à chaque tour, le nombre double. 4 tours avant qu'elle ne déferle sur toute la ville.",opts:["Les attirer vers ce qui les détruit (la lumière, l'eau, le feu selon la règle).","Couper la source : atteindre la créature d'origine.","Les enfermer en masse et sacrifier le lieu."]}},
shining:{g:"horreur",nom:"Le lieu isolé qui rend fou",ref:"Shining, de Stephen King",
 adn:"Isolement hivernal, lieu immense et vide qui parle à l'oreille du plus fragile. La menace vient d'un allié qui bascule lentement.",
 accroche:["{Comm} engage les coureurs pour garder {l1} tout l'hiver, coupés du monde par la neige. Le précédent gardien a disparu, en laissant des pages et des pages de la même phrase.\nPaie : {rec}."],
 synopsis:["Un hiver entier, coupés de tout, à {l1}. Le lieu se souvient de chaque crime commis entre ses murs, et cherche un nouvel hôte. Peu à peu, l'un des proches des coureurs entend des voix. {A} n'est peut-être qu'un pantin du lieu lui-même."],
 piste:{t:"La chambre interdite",v:"À {lieu}, une porte qu'on ne devrait pas ouvrir. Derrière : {signe2}. Ce qu'on y voit éclaire ce que le lieu veut, et comment le briser.",at:"contre",obst:"epreuve"}},
dracula:{g:"horreur",nom:"Le seigneur ancien qui vient en ville",ref:"Dracula, de Bram Stoker",
 adn:"Gothique : un aristocrate séduisant et millénaire, des proies qui dépérissent, une chasse menée avec du savoir ancien, de l'ail et du courage.",
 accroche:["À {l0}, une jeune femme s'affaiblit chaque nuit, et deux marques rouges ornent son cou. {Comm} supplie les coureurs. Le nouveau voisin, arrivé avec ses caisses de terre, ne sort jamais le jour.\nPaie : {rec}."],
 synopsis:["Un seigneur ancien s'est installé à {l0}. Il séduit, il boit, il transforme. Pour l'arrêter, il faudra trouver ses refuges, détruire sa terre natale et le surprendre au jour. {A} le sert, ou le croit."],
 piste:{t:"Les caisses de terre",v:"À {lieu} sont cachées les caisses de terre où dort le maître. Chaque caisse détruite le prive d'un refuge.",at:"contre",renc:"facile"}},
mouche:{g:"horreur",nom:"L'expérience qui transforme son créateur",ref:"La Mouche, de David Cronenberg",
 adn:"Horreur du corps : un génie, une expérience réussie… presque. La transformation est lente, tragique, et l'antagoniste reste un peu humain jusqu'au bout.",
 accroche:["{Comm} s'inquiète pour un savant de {l0} : brillant, euphorique depuis sa dernière expérience, il ne dort plus, mange du sucre à la poignée, et sa peau change.\nPaie : {rec}."],
 synopsis:["Une expérience a réussi au-delà de toute espérance, puis quelque chose s'est mêlé au processus. {A} change, jour après jour : plus de force, plus de vitesse, et de moins en moins d'humanité. Faut-il sauver ce qui en reste, ou arrêter la créature avant qu'elle ne recommence sur d'autres ?"],
 climax:{mode:"otage",v:"À {l1}, au terme de sa transformation, {a} veut fusionner avec quelqu'un pour redevenir « entier ». {Il} tient sa victime près de la machine : 3 tours.",opts:["Détruire la machine plutôt que de combattre la créature.","Parler à ce qui reste d'humain en {lui} (jet standard avec un moyen de pression).","Arracher la victime à temps (arts du mouvement)."]}},
/* ---------- Exploration ---------- */
mondeperdu:{g:"exploration",nom:"Le plateau où survivent des bêtes disparues",ref:"Le Monde perdu, d'Arthur Conan Doyle",
 adn:"Expédition scientifique, plateau isolé, créatures d'un autre âge. L'émerveillement compte autant que le danger, et le retour est le vrai défi.",
 accroche:["Un savant ridiculisé, {comm}, affirme qu'au-delà de {l0} survivent des bêtes disparues depuis des millénaires. Il recrute les coureurs pour en ramener la preuve.\nPaie : {rec}."],
 synopsis:["Au sommet d'un plateau inaccessible, le temps s'est arrêté : bêtes géantes, peuples oubliés, végétation démesurée. L'expédition y monte… et le seul chemin du retour s'effondre derrière elle. {A} veut ramener une créature vivante, à n'importe quel prix."],
 piste:{t:"Le plateau",v:"Sur {lieu}, une créature d'un autre âge broute, chasse ou garde son nid. Un peuple oublié observe les intrus de loin.",at:"allie",renc:"equilibre"}},
tombraider:{g:"exploration",nom:"Pillage acrobatique de tombeaux",ref:"Tomb Raider",
 adn:"Acrobaties, énigmes mécaniques, pièges en série : chaque salle est un parcours d'obstacles. Le pilleur rival est armé, et le tombeau ne se laisse pas faire.",
 accroche:["{Comm} fournit les coureurs en cordes, grappins et torches : {o} repose au fond de {l1}, et une organisation rivale y descend déjà.\nPaie : {rec}."],
 synopsis:["{O} repose au fond d'un tombeau conçu pour tuer les voleurs. Sauts dans le vide, plafonds qui descendent, mécanismes millénaires : chaque salle est une épreuve. {A} et ses mercenaires sont sur la même piste."],
 piste:{t:"La salle des mécanismes",v:"{Lieu} : un parcours d'obstacles (passerelles, leviers, lames). Trois jets d'arts du mouvement ; chaque échec coûte 1d8 et un objet perdu.",at:"passage",obst:"danger"}},
licorne:{g:"exploration",nom:"Trois parchemins et le trésor d'un ancêtre",ref:"Le Secret de la Licorne, d'Hergé",
 adn:"Chasse au trésor en trois morceaux, rivaux louches, maquettes et documents anciens. L'aventure mène d'une ville à la mer, ton enjoué.",
 accroche:["Les coureurs achètent par hasard un vieil objet à {l0}. Dedans, un parchemin : le premier de trois. Le soir même, des inconnus tentent de s'en emparer. {Comm} sait où chercher les deux autres.\nPaie : {rec}."],
 synopsis:["Un ancêtre a caché son trésor et dispersé trois parchemins qui, réunis, en donnent l'emplacement. {A} possède déjà l'un des trois, et ne reculera devant rien pour les autres. Le trésor se trouve à {l1}, ou plutôt pas exactement là où tout le monde croit."],
 piste:{t:"Le deuxième parchemin",v:"À {lieu}, le deuxième parchemin dort dans un objet ancien. Des voleurs le cherchent aussi.",at:"levier",renc:"facile"}},
planete:{g:"exploration",nom:"Le monde où l'humain est la bête",ref:"La Planète des singes, de Pierre Boulle",
 adn:"Monde inversé : une société évoluée tient les humains (ou les coureurs) pour des bêtes. Choc culturel, procès, évasion, et une révélation finale qui retourne tout.",
 accroche:["Après une tempête, un naufrage ou un portail, les coureurs échouent près de {l0}. Ici, une autre espèce règne, et les humains sont chassés comme du gibier.\nPaie : survivre, et comprendre."],
 synopsis:["Dans ce pays, l'espèce dominante n'est pas la leur. Les coureurs sont capturés, étudiés, jugés. Pour s'enfuir, il faudra des alliés dans l'autre camp, et une vérité interdite que {a} protège : ce monde est peut-être le leur."],
 climax:{mode:"fuite",v:"Le procès tourne mal à {l1} : les coureurs doivent fuir avec la preuve de la vérité. {A} lance la chasse. 3 tours avant que les portes se ferment.",opts:["Fuir avec l'aide d'un allié de l'autre espèce.","Révéler la preuve en public : le doute paralyse les gardes.","Tout abandonner et disparaître dans la zone interdite."]}},
/* ---------- Casse ---------- */
lupin:{g:"casse",nom:"Gentleman cambrioleur et panache",ref:"Arsène Lupin, de Maurice Leblanc",
 adn:"Élégance, déguisements, cartes de visite laissées sur les lieux : le vol est un art, l'humiliation du riche une victoire. On prévient la victime, et on réussit quand même.",
 accroche:["{Comm} propose un défi aux coureurs : voler {o} à {a}, après l'avoir prévenu par lettre de la date et de l'heure.\nPaie : {rec}, et la gloire."],
 synopsis:["Voler {o}, c'est facile. Le voler après avoir annoncé le jour et l'heure, sous le nez de la police, c'est un art. {A} a mobilisé toutes ses gardes à {l1}. Les coureurs ont des masques, des complices… et une idée de génie."],
 piste:{t:"Le déguisement",v:"À {lieu}, se faire passer pour quelqu'un d'autre : un domestique, un policier, un invité. Il faut un costume, un accent, une histoire.",at:"passage",obst:"social"}},
inception:{g:"casse",nom:"Voler une idée dans un rêve",ref:"Inception, de Christopher Nolan",
 adn:"Rêves imbriqués : chaque niveau a ses règles, le temps s'y étire, et la cible a des défenses mentales armées. Ne pas oublier ce qui est réel.",
 accroche:["{Comm} propose aux coureurs un travail impossible : entrer dans les rêves {dea} et y voler, ou y planter, une idée. Un sorcier ou une machine les y conduira.\nPaie : {rec}."],
 synopsis:["Le butin n'est pas un objet : c'est un secret, enfoui dans l'esprit {dea}. Il faut descendre de rêve en rêve, chaque niveau plus instable, pendant que les défenses de la cible traquent les intrus. Et un membre de l'équipe porte ses propres fantômes."],
 climax:{mode:"rituel",v:"Au plus profond du rêve, à {l1}, le coffre mental de {a} s'ouvre, mais ses défenses déferlent et le rêve s'effondre : 4 tours avant le réveil forcé.",opts:["Ouvrir le coffre pendant que les autres tiennent (jet standard).","Provoquer le réveil synchronisé de toute l'équipe.","Planter l'idée au lieu de la voler : plus rapide, plus risqué."]}},
cerclerouge:{g:"casse",nom:"Le casse silencieux et la fatalité",ref:"Le Cercle rouge, de Jean-Pierre Melville",
 adn:"Silence, gestes précis, loyauté entre truands, et un flic obstiné. Peu de dialogues, beaucoup de tension. Tout le monde finit par payer.",
 accroche:["Un évadé, un ancien tireur d'élite et les coureurs se retrouvent liés par le hasard à {l0}. Un coup les attend : {o}, gardé à {l1}. Un policier tenace est déjà sur la piste.\nPaie : {rec}."],
 synopsis:["Un casse minutieux, presque sans un mot : {o} dort à {l1}. Les coureurs ont un plan parfait. Mais un policier obstiné les traque, et {a} vend tout le monde à tout le monde. Dans ce milieu, la loyauté se paie cher."],
 piste:{t:"Le tireur",v:"À {lieu} vit un ancien tireur hors pair, rongé par ses démons. Sans lui, le coup est impossible ; avec lui, il faut le tenir sobre.",at:"allie",obst:"social"}},
gardiens:{g:"casse",nom:"Une bande de marginaux et un objet trop puissant",ref:"Les Gardiens de la Galaxie, de James Gunn",
 adn:"Bande de ratés attachants, répliques qui fusent, musique entraînante. Un vol qui tourne mal, un objet trop puissant, et une famille de fortune qui se forme.",
 accroche:["Les coureurs ont volé {o} pour {comm}, à {l0}. Le problème : tout le monde le veut, y compris {a}, qui a mis leur tête à prix.\nPaie : {rec}, s'ils survivent."],
 synopsis:["Un petit vol de rien du tout… sauf que {o} pourrait raser un monde. Les coureurs se retrouvent pourchassés, emprisonnés, obligés de faire équipe avec pire qu'eux. {A} veut l'objet, et ne négocie jamais."],
 climax:{mode:"rituel",v:"À {l1}, {a} brandit {o2} et s'apprête à libérer sa puissance : 4 tours. Seul, aucun coureur ne pourrait le tenir.",opts:["Toucher l'objet tous ensemble : chacun encaisse 1d8, mais le pouvoir est partagé et contenu.","Distraire l'adversaire par n'importe quel moyen, même ridicule (une danse, un défi, une insulte).","Lui arracher l'objet au vol."]}},
/* ---------- Escorte ---------- */
terminator:{g:"escorte",nom:"Protéger quelqu'un d'un tueur qu'on n'arrête pas",ref:"Terminator, de James Cameron",
 adn:"Poursuite implacable : le tueur ne dort pas, ne ressent rien, ne s'arrête jamais. On ne le bat pas : on le ralentit, on l'évite, on le piège.",
 accroche:["{Comm} surgit devant les coureurs à {l0}, haletant : {p} va être tué cette nuit par quelque chose qui ne s'arrêtera jamais. Il faut fuir, maintenant.\nPaie : {rec}."],
 synopsis:["Un tueur venu d'ailleurs traque {p}, pour une raison qui ne s'éclairera que plus tard. Il encaisse les balles, les chutes, le feu, et revient toujours. Les coureurs doivent protéger leur protégé jusqu'à {l1}, où un moyen d'en venir à bout existe peut-être. {A} a envoyé la machine."],
 climax:{mode:"fuite",v:"La machine, mutilée mais debout, rattrape le groupe à {l1}. Elle ne ralentit pas, ne recule pas. Il faut l'écraser, la fondre ou la broyer.",opts:["L'attirer dans une presse, une fonderie, un gouffre (arts du mouvement).","Tenir 3 tours pour que la personne escortée atteigne la sortie.","Retourner ses armes contre elle (avec un point faible)."]}},
et:{g:"escorte",nom:"Ramener chez elle une créature venue d'ailleurs",ref:"E.T. l'extra-terrestre, de Steven Spielberg",
 adn:"Tendresse et émerveillement : une créature étrange, perdue et douce, que les adultes veulent capturer. La protéger, la cacher, l'aider à rentrer chez elle.",
 accroche:["Dans une remise de {l0}, les coureurs découvrent une créature étrange, perdue, terrifiée. Elle montre le ciel du doigt. Dès le lendemain, des hommes en uniforme fouillent le quartier.\nPaie : aucune, sinon la bonne action."],
 synopsis:["Une créature venue d'ailleurs s'est égarée. Elle doit atteindre {l1} avant que son peuple ne reparte, et elle s'affaiblit chaque jour. {A} et ses hommes veulent la capturer pour l'étudier. Les coureurs n'ont que leur ruse, et quelques gamins du quartier."],
 piste:{t:"Le signal",v:"À {lieu}, on peut bricoler de quoi appeler les siens. Il faut des pièces, du temps, et ne pas se faire repérer.",at:"contre",obst:"epreuve"}},
starwars:{g:"escorte",nom:"Livrer des plans volés à travers l'Empire",ref:"Star Wars, de George Lucas",
 adn:"Space opera : une princesse ou un message, un vieux sage, une évasion audacieuse, une course-poursuite, et un seigneur noir qui étrangle les incompétents.",
 accroche:["Un droïde, un messager ou un parchemin arrive jusqu'aux coureurs à {l0}, avec un message : des plans volés doivent atteindre {l1}. Derrière, les troupes {dea} débarquent déjà.\nPaie : {rec}, et l'espoir."],
 synopsis:["Des plans volés révèlent la faille d'une arme terrible. Ils doivent rejoindre {l1}, où la rébellion attend. {A} a lancé toutes ses troupes à la poursuite des coureurs. Il faudra une cantina louche, un pilote douteux et une évasion spectaculaire."],
 piste:{t:"Le pilote douteux",v:"À {lieu}, un contrebandier vantard possède le transport le plus rapide du coin. Il a des dettes, un associé bourru et pas de principes. Enfin, presque.",at:"passage",obst:"social"}},
chevauchee:{g:"escorte",nom:"La diligence et ses passagers disparates",ref:"La Chevauchée fantastique, de John Ford",
 adn:"Huis clos roulant : des passagers que tout oppose (le notable, la paria, le joueur, le hors-la-loi) traversent un territoire hostile. Les préjugés tombent sous les flèches.",
 accroche:["{Comm} cherche des escortes pour une diligence qui part de {l0} vers {l1}. Les passagers se détestent déjà. Le territoire est en guerre.\nPaie : {rec}."],
 synopsis:["Une voiture, six passagers et un territoire en feu. Chacun cache un secret, un crime ou une honte. {A} attend le convoi quelque part sur la route. Arriver à destination demandera de faire confiance à ceux qu'on méprisait au départ."],
 piste:{t:"Le relais pillé",v:"À {lieu}, le relais de poste a été attaqué. Plus de chevaux frais, et un survivant qui sait où l'ennemi attend.",at:"preuve",renc:"facile"}},
odyssee:{g:"escorte",nom:"Le long retour, île après île",ref:"L'Odyssée, d'Homère",
 adn:"Épopée de retour : chaque étape est un monde, une tentation, un monstre ou un dieu capricieux. La ruse vaut mieux que la force, et la patience mieux que la ruse.",
 accroche:["Les coureurs veulent rentrer chez eux, à {l1}. {Comm} leur offre un passage, mais les dieux, les vents ou le hasard ont d'autres projets.\nPaie : rentrer."],
 synopsis:["Le chemin du retour est long et semé d'épreuves : îles enchantées, monstres, tentations qui font oublier pourquoi l'on voyage. Chaque escale coûte quelque chose. Et chez eux, {a} s'est installé en maître."],
 piste:{t:"L'île des tentations",v:"À {lieu}, tout est doux : festins, chants, oubli. Chaque coureur doit réussir un jet standard ou vouloir rester. Un sage du lieu sait comment repartir.",at:"contre",obst:"epreuve"}},
/* ---------- Siège / survie ---------- */
assaut2:{g:"siege",nom:"Un poste isolé encerclé par une bande",ref:"Assaut, de John Carpenter",
 adn:"Nuit sans fin, poste de garde presque vide, ennemi sans visage qui attaque en silence. Flics, prisonniers et passants doivent s'allier pour voir l'aube.",
 accroche:["Les coureurs font halte dans un poste presque vide, à {l0}. Un fugitif s'y réfugie, poursuivi. Puis le courant tombe, et les premiers projectiles silencieux brisent les vitres.\nPaie : survivre."],
 synopsis:["Un poste isolé, une poignée d'occupants, et dehors une bande qui ne parle pas, ne recule pas, et veut l'homme réfugié à l'intérieur. Prisonniers et gardiens devront se battre côte à côte. {A} dirige l'assaut depuis l'ombre."]},
zoulou:{g:"siege",nom:"Une poignée contre une armée",ref:"Zoulou, de Cy Endfield",
 adn:"Disproportion écrasante : une centaine de défenseurs contre des milliers. Discipline, sacrifices et respect mutuel entre adversaires.",
 accroche:["Un messager arrive à {l0} : une armée immense marche sur le poste, et la retraite est impossible. {Comm} décide de tenir.\nPaie : {rec}, et l'honneur."],
 synopsis:["Une poignée de défenseurs, des murs de sacs et de caisses, et face à eux une armée entière qui arrive par vagues. Il faudra tenir une nuit et un jour. {A} commande l'assaut, et respecte ceux qui résistent."]},
mortsvivants:{g:"siege",nom:"La maison barricadée contre les morts",ref:"La Nuit des morts-vivants, de George A. Romero",
 adn:"Huis clos de survie : une maison, des planches, des inconnus qui se disputent, et dehors des morts toujours plus nombreux. Le danger vient aussi de l'intérieur.",
 accroche:["Poursuivis par des silhouettes titubantes, les coureurs se réfugient dans une ferme de {l0}. D'autres survivants sont déjà là, et ils ne sont pas d'accord sur la marche à suivre.\nPaie : survivre jusqu'au matin."],
 synopsis:["Les morts se relèvent et marchent. Une poignée de survivants barricade une maison isolée. Dehors, leur nombre grossit d'heure en heure ; dedans, la peur divise le groupe. {A} n'est peut-être pas celui qu'on croit."],
 climax:{mode:"fuite",v:"Les barricades cèdent à {l1}. Les morts envahissent tout. 3 tours pour atteindre le véhicule, la cave ou le toit.",opts:["Courir vers le véhicule (arts du mouvement groupé).","S'enfermer à la cave et attendre l'aube.","Créer un feu pour repousser la masse, au risque de tout brûler."]}},
jurassic:{g:"siege",nom:"Le parc dont les bêtes se libèrent",ref:"Jurassic Park, de Steven Spielberg",
 adn:"Émerveillement puis panique : un parc magnifique, des bêtes ressuscitées, une panne, et soudain les clôtures ne tiennent plus. La nature trouve toujours un chemin.",
 accroche:["{Comm} invite les coureurs à visiter son parc extraordinaire, à {l0}, avant l'ouverture. Les créatures sont stupéfiantes. Puis l'orage éclate et le courant tombe.\nPaie : {rec}."],
 synopsis:["Un parc rempli de créatures que personne n'aurait dû ramener à la vie. Une trahison coupe le courant, les enclos s'ouvrent. Les coureurs doivent survivre jusqu'au poste central et rétablir le contrôle, pendant que {a} s'enfuit avec ce qu'{il} a volé."],
 piste:{t:"L'enclos ouvert",v:"À {lieu}, une clôture est tombée. Quelque chose de très grand a laissé des traces, et quelque chose de petit chasse en meute.",at:"faiblesse",renc:"equilibre"}},
troopers:{g:"siege",nom:"Des vagues d'insectes géants",ref:"Starship Troopers, de Paul Verhoeven",
 adn:"Guerre totale et propagande : des soldats jeunes et naïfs, des insectes par milliers, des ordres absurdes. Action excessive, satire en filigrane.",
 accroche:["{Comm} envoie les coureurs tenir un avant-poste à {l0}, au milieu d'un territoire infesté. Les communiqués promettent une victoire facile. Les premiers cris arrivent avant le crépuscule.\nPaie : {rec}."],
 synopsis:["Une colonie d'insectes géants ravage la région. Les coureurs défendent un avant-poste que la propagande dit imprenable. Les vagues arrivent par milliers, de plus en plus intelligentes. Quelque part, un esprit dirige la ruche, et {a} en sait plus qu'{il} ne l'avoue."],
 climax:{mode:"rituel",v:"La ruche lance son assaut total sur {l1}. Au cœur de la marée d'insectes, l'esprit de la ruche commande : 4 tours.",opts:["Atteindre et abattre l'esprit de la ruche : la marée se désorganise.","Faire sauter le passage par où ils arrivent.","Tenir jusqu'à l'arrivée du transport (chaque tour compte)."]}},
titanic:{g:"siege",nom:"Le naufrage du navire insubmersible",ref:"Titanic, de James Cameron",
 adn:"Luxe et naufrage : un navire réputé indestructible, des classes sociales cloisonnées, et quelques heures pour survivre quand il s'enfonce. Il n'y a pas assez de canots.",
 accroche:["Les coureurs embarquent sur le plus grand navire jamais construit, au départ de {l0}. {Comm} leur a confié une mission discrète à bord. La troisième nuit, un choc sourd secoue la coque.\nPaie : {rec}."],
 synopsis:["Un navire insubmersible, des passagers de toutes conditions, et une nuit glacée. Le choc a ouvert la coque, et il n'y a pas de canots pour tout le monde. {A} veut sauver {o}, et sa propre peau, quitte à sacrifier les autres."],
 climax:{mode:"fuite",v:"Le navire se dresse vers le ciel. {A} a pris le dernier canot et tient une arme. 3 tours avant que le pont ne disparaisse sous l'eau glacée.",opts:["Atteindre le canot et faire monter les plus faibles.","Se servir d'une épave flottante pour tenir jusqu'aux secours (1d8 par tour de froid).","Ouvrir les grilles de la troisième classe avant qu'il soit trop tard."]}},
/* ---------- Intrigue ---------- */
dune:{g:"intrigue",nom:"La planète-épice et la trahison d'une maison",ref:"Dune, de Frank Herbert",
 adn:"Grande politique et désert mortel : une ressource dont dépend tout un empire, une maison trahie, un peuple du désert qui attend un prophète.",
 accroche:["{Comm} vient de recevoir le gouvernement de {l0}, la terre qui produit la seule ressource que tout l'empire convoite. Il engage les coureurs : il sent le piège.\nPaie : {rec}."],
 synopsis:["{F1} reçoit la garde d'une terre aride mais vitale, à la place de {F2}, son ennemi juré. C'est un cadeau empoisonné : un traître est déjà dans la maison, et {a} prépare l'assaut. Le seul espoir vient du peuple du désert, qu'il faudra gagner."],
 piste:{t:"Le peuple du désert",v:"À {lieu}, le peuple du désert observe les étrangers. Gagner son respect demande une épreuve, un duel ou une parole tenue.",at:"allie",obst:"epreuve"}},
mousquetaires:{g:"intrigue",nom:"Les ferrets de la reine",ref:"Les Trois Mousquetaires, d'Alexandre Dumas",
 adn:"Cape et épée : amitié, panache, duels, chevauchées. Un cardinal manipulateur, une espionne fatale, et l'honneur d'une reine à sauver.",
 accroche:["Une dame de compagnie aborde les coureurs à {l0}, le visage voilé : la reine a offert un bijou à un amant étranger, et le roi exige de la voir le porter au bal, dans quatre jours.\nPaie : {rec}, et la gratitude royale."],
 synopsis:["Pour perdre la reine, {a} a tout prévu : le bijou est loin, le bal est dans quatre jours, et ses espions guettent chaque route. Les coureurs devront chevaucher, se battre et déjouer une espionne aussi belle que mortelle."],
 piste:{t:"L'espionne",v:"À {lieu}, une femme fatale au service de l'adversaire attend les coureurs avec un sourire et un poignard. Elle peut trahir son maître… ou eux.",at:"levier",obst:"social"}},
housecards:{g:"intrigue",nom:"L'ascension politique sans scrupules",ref:"House of Cards",
 adn:"Politique froide : chaque PNJ est un pion, chaque faveur une dette. L'antagoniste parle au public, sourit, et écrase quiconque se met sur son chemin.",
 accroche:["{Comm} engage les coureurs pour une tâche discrète : récupérer un document compromettant à {l0}. Le document vise {a}, la personne la plus aimable et la plus dangereuse de la ville.\nPaie : {rec}."],
 synopsis:["{A} gravit les échelons du pouvoir avec un sourire et un carnet de dettes. Ceux qui le gênent tombent : scandales, accidents, trahisons. Les coureurs se retrouvent entre ses mains, utiles… jusqu'au jour où ils ne le seront plus."],
 climax:{mode:"marche",v:"À {l1}, au sommet de sa gloire, {a} offre aux coureurs un poste, une fortune et l'oubli de leurs crimes, en échange du dernier document qui pourrait le perdre.",opts:["Accepter, et devenir ses complices.","Révéler le document au moment où il triomphe.","Le faire tomber par ses propres méthodes : chantage, rumeur, alliances."]}},
spacejam:{g:"intrigue",nom:"Un match pour sa liberté",ref:"Space Jam",
 adn:"Comédie déjantée : un défi sportif absurde contre des adversaires d'un autre monde, avec la liberté pour enjeu. Les règles se tordent, le public hurle, tout est permis.",
 accroche:["Des visiteurs venus d'ailleurs débarquent à {l0} et veulent emmener les habitants comme attraction. {Comm} obtient un marché : un match. Si la ville gagne, ils repartent.\nPaie : la liberté de la ville."],
 synopsis:["Pour sauver {l0}, il faut remporter un match contre des adversaires qui trichent, grandissent et ont volé le talent des meilleurs joueurs du pays. {A} arbitre, et ne cache pas qui il soutient. Il reste quelques jours pour former une équipe improbable."],
 climax:{mode:"marche",v:"Le match final se joue à {l1}, devant toute la ville. {A} propose un marché à la mi-temps : un coureur passe dans son camp, et la ville est épargnée. Il reste 4 actions de jeu.",opts:["Chaque action est un jet standard ; trois réussites renversent le score.","Tricher plus fort qu'eux : une ruse folle vaut l'avantage.","Démasquer la triche de l'arbitre devant le public."]}},
/* ---------- Chasse ---------- */
predator:{g:"chasse",nom:"Chassés par un chasseur invisible",ref:"Predator, de John McTiernan",
 adn:"Renversement : les chasseurs deviennent le gibier. Jungle étouffante, chasseur invisible qui collectionne les trophées. On ne le bat qu'en devenant aussi sauvage que lui.",
 accroche:["{Comm} envoie les coureurs récupérer une équipe disparue près de {l0}. Ils la retrouvent : écorchée, suspendue aux arbres. Quelque chose les observe depuis la canopée.\nPaie : {rec}."],
 synopsis:["Un chasseur venu d'ailleurs a fait de la région son terrain de jeu. Il est invisible, il voit la chaleur, il collectionne les crânes des proies dignes de lui. Les coureurs n'ont qu'une chance : tendre un piège, devenir invisibles à leur tour, et frapper."],
 climax:{mode:"fuite",v:"Le chasseur se dévoile à {l1}, seul, et défie le dernier coureur debout. Blessé, il active une arme qui rasera tout : 3 tours.",opts:["Le combattre à sa manière : couvert de boue, invisible à ses yeux.","Le prendre dans le piège préparé.","Fuir le plus loin possible avant l'explosion."]}},
mobydick:{g:"chasse",nom:"L'obsession d'un capitaine pour une bête",ref:"Moby Dick, d'Herman Melville",
 adn:"Obsession et grandeur : une bête légendaire, un chef rongé par la vengeance qui mène son équipe à la ruine. La vraie menace est peut-être à bord.",
 accroche:["Un capitaine charismatique, à {l0}, recrute les coureurs pour une chasse fabuleusement payée. Il ne dit pas tout de suite qu'il ne cherche qu'une seule bête : {proie}, celle qui l'a mutilé.\nPaie : {rec}."],
 synopsis:["Le chef de l'expédition n'a qu'un but : abattre {proie}, la bête qui l'a défiguré. Il sacrifiera tout pour cela : la cargaison, l'équipage, les coureurs. Faut-il le suivre jusqu'au bout, ou le renverser ?"],
 piste:{t:"La mutinerie qui couve",v:"À {lieu}, l'équipage murmure. Certains veulent rentrer, d'autres jeter le chef par-dessus bord. Le soutien des hommes peut tout changer.",at:"allie",obst:"social"}},
fugitif:{g:"chasse",nom:"Traquer un homme accusé à tort",ref:"Le Fugitif, d'Andrew Davis",
 adn:"Double traque : les coureurs poursuivent un évadé, mais plus ils avancent, plus il paraît innocent. Le vrai coupable est peut-être celui qui paie la prime.",
 accroche:["{Comm} offre {rec} pour la capture d'un évadé, condamné pour le meurtre de sa femme. Il a été vu près de {l0}. Il ne fuit pas : il enquête."],
 synopsis:["Un condamné s'est évadé et refuse de quitter la région : il cherche le vrai meurtrier. Les coureurs le traquent pour une prime, mais les indices qu'il laisse derrière lui désignent quelqu'un d'autre : {a}."],
 piste:{t:"Les traces de l'évadé",v:"À {lieu}, l'évadé est passé juste avant. Ce qu'il cherchait se trouve là : {indice}.",at:"preuve",obst:"epreuve"}},
bladerunner:{g:"chasse",nom:"Traquer des fugitifs artificiels qui veulent vivre",ref:"Blade Runner, de Ridley Scott",
 adn:"Mélancolie sous la pluie : traquer des êtres artificiels presque humains, qui veulent seulement vivre un peu plus. Qui est le plus humain des deux ?",
 accroche:["{Comm} confie aux coureurs une liste de quatre fugitifs artificiels, réfugiés à {l0}. Ils ont une durée de vie limitée, et elle s'achève bientôt. Il faut les « retirer » avant.\nPaie : {rec} par tête."],
 synopsis:["Des êtres fabriqués, plus forts et plus beaux que nature, se sont enfuis pour trouver leur créateur et prolonger leur vie. Les coureurs les traquent sous la pluie. Plus la chasse avance, plus la frontière entre chasseur et proie se brouille. {A} les a créés."],
 climax:{mode:"marche",v:"À {l1}, le dernier fugitif tient la vie d'un coureur entre ses mains. Il pourrait le tuer. Il demande seulement à être écouté, et quelques heures de plus.",opts:["L'écouter : il révèle les crimes de son créateur.","Le combattre : il est plus fort, plus rapide, désespéré.","Le laisser partir, et mentir à ceux qui ont payé."]}}
});
/* Pistes et climax pour les premières œuvres qui n'en avaient pas */
Object.assign(INSPI.oceans,{piste:{t:"Le spécialiste",v:"À {lieu} attend le dernier membre de l'équipe : {pnj}, le meilleur dans sa partie. Il {pnjsec}.",at:"allie",obst:"social"}});
Object.assign(INSPI.septsamourais,{piste:{t:"Les villageois",v:"À {lieu}, les villageois cachent des armes et des provisions prises jadis à des soldats morts. Les découvrir crée la méfiance, ou la confiance.",at:"allie",obst:"social"}});
Object.assign(INSPI.assaut,{climax:{mode:"marche",v:"À l'aube, à {l1}, {a} propose l'échange : le prisonnier contre un otage pris parmi les alliés des coureurs.",opts:["Faire l'échange, et reprendre l'otage dans la confusion.","Tenir jusqu'à l'arrivée des renforts (3 tours).","Faire sauter le chariot de poudre de l'ennemi."]}});
Object.assign(INSPI.liaisons,{piste:{t:"Les lettres",v:"À {lieu}, des lettres compromettantes passent de main en main. Les lire, c'est tenir quelqu'un ; les perdre, c'est être perdu.",at:"levier",obst:"social"}});
Object.assign(INSPI.trone,{climax:{mode:"otage",v:"Au banquet de noces, à {l1}, les musiciens sortent des lames : {a} retient les chefs des deux familles, portes fermées.",opts:["Libérer les otages un à un (arts du mouvement).","Négocier au nom des familles, avec un moyen de pression.","Frapper l'instigateur dans la confusion (frappe vicieuse)."]}});
Object.assign(INSPI.pacte,{piste:{t:"L'antre du dresseur",v:"À {lieu} : des chaînes, une armure taillée pour la bête, des restes de repas servis par des mains humaines.",at:"preuve",renc:"facile"}});
Object.assign(INSPI.assaut2,{climax:{mode:"fuite",v:"À {l1}, les assaillants entrent par toutes les issues. {A} veut le réfugié, et rien d'autre. 3 tours avant d'être submergés.",opts:["Fuir par les égouts ou les toits avec le réfugié.","Faire exploser le stock de munitions pour couvrir la fuite.","Livrer le réfugié… si l'on a appris qu'il le mérite."]}});
Object.assign(INSPI.zoulou,{piste:{t:"La seconde ligne",v:"À {lieu}, on peut bâtir une seconde ligne de défense avec des sacs, des caisses, des chariots. Chaque coureur qui aide fait gagner du temps au climax.",at:"contre",obst:"epreuve"}});
/* Fallout */
INSPI.fallout={g:"exploration",nom:"Ruines atomiques, abris et rétro-futur",ref:"Fallout",
 adn:"Post-apo rétro-futuriste : publicités souriantes des années 50 sur des ruines radioactives, abris aux expériences douteuses, factions de survivants. On paie en capsules, on compte les radiations, on croise mutants, goules et robots d'avant-guerre. Humour noir de rigueur.",
 accroche:["Un abri vient de rouvrir ses portes près de {l0}, pour la première fois depuis deux cents ans. {Comm} veut savoir ce qu'il contient avant les autres factions : nourriture, armes, ou une expérience qui a mal tourné.\nPaie : {rec}, en capsules sonnantes."],
 synopsis:["Sous les ruines souriantes de l'ancien monde, un abri scellé depuis la Grande Guerre vient de rouvrir à {l1}. Les factions du désert accourent : marchands, fanatiques, pillards en armure assistée. {A} sait ce que les concepteurs de l'abri y ont vraiment testé, et compte bien en tirer profit. Dehors, les radiations ; dedans, pire."],
 piste:{t:"Le terminal de l'abri",v:"À {lieu}, un vieux terminal grésille encore. Les journaux des résidents racontent l'expérience, jour après jour, jusqu'au dernier message. La zone autour est radioactive (1d4 PV par scène sans protection, non récupérables au repos).",at:"preuve",obst:"danger"},
 climax:{mode:"rituel",v:"Au fond de {l1}, {a} relance le programme de l'abri : portes scellées, gaz, robots de sécurité réactivés. 4 tours avant que l'abri ne se referme pour deux cents ans de plus.",opts:["Pirater le terminal du superviseur (jet standard).","Forcer la grande porte avant qu'elle ne roule (arts du mouvement).","Libérer les résidents survivants pour qu'ils se retournent contre leur geôlier."]}};

/* Jumanji */
Object.assign(INSPI,{jumanji:{g:"exploration",nom:"Le jeu maudit qu'il faut finir",ref:"Jumanji, de Chris Van Allsburg",
 adn:"Un jeu ancien qui obéit à ses propres règles : chaque coup de dé déchaîne une épreuve (une bête, une plante, une crue), et seule la fin de la partie efface tout. Humour, panique, entraide : on ne gagne qu'ensemble.",
 accroche:["À {l0}, {comm} a retrouvé un vieux jeu dans une cache oubliée. Quelqu'un a lancé les dés « pour voir ». Depuis, des bêtes sauvages rôdent dans les rues et le joueur a disparu.\nPaie : {rec}.","Les coureurs ouvrent un coffret abandonné à {l0} : un plateau, des pions, des dés. Un coup de vent, les dés roulent tout seuls, et la jungle commence à pousser.\nPaie : {rec}, si l'on survit."],
 synopsis:["Un jeu ancien s'est réveillé, à {l0}. Chaque lancer fait surgir une épreuve du monde sauvage, de plus en plus dangereuse, et l'on ne peut pas arrêter la partie. {A} a compris le pouvoir du jeu et veut s'en emparer : chaque épreuve qui frappe les coureurs le rapproche de son but. Il faut aller au bout, case après case."],
 piste:{t:"Le coup de dé",v:"À {lieu}, c'est le tour d'un coureur : il doit lancer. Le jeu annonce une énigme en vers, et le danger surgit aussitôt (bêtes en troupeau, nuée, plante carnivore, sable mouvant). Le surmonter fait avancer son pion.",at:"passage",renc:"equilibre"},
 climax:{mode:"rituel",v:"Dernière case, à {l1}. Tout ce que le jeu a libéré converge vers les joueurs, et {a} veut les empêcher de finir. Il faut lancer les dés et prononcer le mot du jeu : 4 tours.",opts:["Protéger le lanceur pendant qu'il joue ses derniers coups (3 tours).","Retourner une épreuve du jeu contre l'adversaire.","Tricher avec le jeu (jet risqué) : il punit la triche d'une épreuve de plus."]}}});

/* Bestiaire enrichi : dinosaures et créatures mythiques, construits avec la méthode du livre (p. 28-29) :
   attaque = 12 + DV (−1 dès 5 DV, −2 dès 9 DV), défense = 10 + armure, PV = moyenne des DV,
   2 attaques dès 5 DV, 3 dès 9 DV ; dés de vilenie pour les plus redoutables. */
function creer(n,dv,d,arm,dmg,cap,desc,cat,vil){const att=12+dv-(dv>=9?2:dv>=5?1:0);return {n,dv,d,att,def:10+arm,pv:Math.ceil(dv*(d+1)/2),na:dv>=9?3:dv>=5?2:1,dmg,cap,desc,cat,vil:vil||0}}

   - regle : une contrainte de jeu concrète, valable toute la partie ;
   - zones : quatre lieux tirés de l'élément ; les trois premiers servent aux pistes, le dernier au climax ;
   - climax : ce que fait l'élément pendant l'affrontement final ;
   - fin : le dernier cran du compte à rebours, si personne n'agit.

/* Exploration / pillage pur : la dette */
GENRES.exploration.accroche.push("Les coureurs doivent une somme folle à {comm}, et le terme tombe dans sept jours. Une seule issue : piller {l1} avant tout le monde.\nDette : {rec}, à rembourser en entier, ou c'est la prison (ou pire).");
GENRES.exploration.synopsis.push("Les coureurs sont criblés de dettes, et {comm} ne fait plus crédit. Il leur offre une chance : piller {l1}, que personne n'a fouillé depuis des siècles, et partager la prise. {A} a eu la même idée, et compte bien rembourser ses propres créanciers avec la part des autres.");
/* Siège / survie face à une force naturelle */
GENRES.siege.synopsis.push("Ce n'est pas une armée qui menace {l0}, mais le monde lui-même : une marée qui monte, une crue, une tempête de sable, et ce qu'elle charrie. Il faudra tenir jusqu'au matin, vague après vague. {A} a ses raisons de souhaiter que la ville ne voie pas l'aube : {sec}");
GENRES.siege.horloge=["La première vague emporte les défenses extérieures.","Les vivres et l'eau potable sont souillés.","Les habitants se battent entre eux pour les places au sec.","L'assaut final : la vague la plus haute, ou l'ennemi en personne."];
/* Escorte / fuite en avant : quelque chose qui avance tout seul */
GENRES.escorte.synopsis.push("Il faut accompagner une chose qui avance toute seule et ne s'arrêtera pas : un convoi sans conducteur, une machine, un pèlerinage en transe. Les coureurs ne la dirigent pas : ils la protègent, la suivent, et découvrent en route vers quoi elle va. {A} veut qu'elle n'arrive jamais.");

  zones:["l'allée des baraques","le train fantôme","la grande roue","le chapiteau du maître forain"],climax:"le grand manège s'emballe, plein de spectateurs : 4 tours pour l'arrêter",fin:"La fête repart à l'aube, avec ceux qu'elle a pris."},
 auberge:{nom:"l'auberge isolée",cat:"Lieux",f:["la tempête y a bloqué une douzaine de voyageurs, et l'un d'eux n'est pas ce qu'il prétend","l'aubergiste y fait disparaître les clients trop riches","c'est un relais où l'on vient vendre des secrets, la nuit, dans la cave"],
  regle:"Personne n'entre et personne ne sort : chaque scène se joue entre ces murs, et les autres clients voient tout.",
  zones:["la salle commune, autour du feu","les chambres de l'étage","l'écurie et la grange","la cave, sous la trappe"],climax:"le feu prend dans l'auberge : 4 tours avant que le toit s'effondre",fin:"Au matin, il manque un voyageur de plus."},
 navire:{nom:"le navire",cat:"Machines",f:["il dérive sans équipage, toutes voiles dehors","il transporte une cargaison qui ne figure sur aucun registre","une mutinerie couve, et les coureurs sont pris entre deux camps"],
  regle:"En mer, nul ne s'enfuit : le pont tangue (désavantage aux actions acrobatiques par gros temps) et tomber par-dessus bord se paie cher.",

 cimetiere:{nom:"le cimetière",cat:"Lieux",f:["les tombes se vident une à une, de l'intérieur","un trésor y a été enterré avec un mort qui le garde encore","c'est le seul terrain neutre de la ville, et toutes les bandes s'y rencontrent"],
  regle:"La nuit, le lieu impose sa loi : les torches s'éteignent au moindre souffle, et chaque bruit se répercute sur les pierres.",
  zones:["l'entrée et la loge du fossoyeur","l'allée des caveaux de famille","la fosse commune","le mausolée central"],climax:"la terre se soulève tout autour : 4 tours avant que le mausolée soit encerclé",fin:"Les morts sortent pour de bon."},
 carnaval:{nom:"le carnaval",cat:"Événements",f:["tout le monde est masqué, et un assassin profite de la fête","pendant trois jours, les lois sont suspendues, et quelqu'un compte en profiter","le défilé doit passer devant un lieu précis à minuit, et ce n'est pas un hasard"],
  regle:"Sous le masque, personne n'est sûr de personne : reconnaître quelqu'un demande un jet standard, et l'on peut se faire passer pour n'importe qui.",
  zones:["le défilé, dans la rue principale","le bal masqué","les ruelles derrière les chars","le balcon d'honneur"],climax:"le défilé atteint le lieu prévu : 4 tours avant minuit",fin:"La fête finit, et le masque tombe sur un cadavre."},
 eclipse:{nom:"l'éclipse",cat:"Événements",f:["pendant les minutes d'obscurité, une porte s'ouvre","une prophétie annonce qu'un roi tombera pendant l'éclipse","tous les animaux de la région ont fui la veille"],
  regle:"Le temps est compté : l'éclipse dure un nombre fixe de tours ; ce qui doit être fait doit l'être dans le noir.",
  zones:["la place où la foule attend","le temple des astrologues","la colline d'où l'on voit tout","le lieu exact sous l'ombre"],climax:"l'obscurité tombe : 4 tours de nuit en plein jour",fin:"Le soleil revient, et quelque chose est passé."},
 tempete:{nom:"la tempête",cat:"Événements",f:["elle bloque tout le monde au même endroit pour la nuit","elle n'est pas naturelle : quelqu'un l'a appelée","elle va frapper la côte, et le seul abri est tenu par l'ennemi"],
  regle:"Dehors, la tempête frappe : chaque scène à découvert coûte 1d4 PV ou un jet d'arts du mouvement ; la visibilité est nulle.",
  zones:["l'abri de fortune","la route coupée","le promontoire battu par le vent","l'œil de la tempête"],climax:"la tempête redouble : 4 tours avant le pire",fin:"La tempête emporte tout ce qui n'était pas à l'abri."},
 mariage:{nom:"le mariage",cat:"Événements",f:["il scelle une alliance que quelqu'un veut empêcher à tout prix","l'un des futurs mariés est forcé, et appelle à l'aide en secret","la dot est un objet que tous les invités convoitent"],
  regle:"Tout se passe devant témoins : les invités voient, jugent et répètent ; un scandale vaut parfois mieux qu'un combat.",
  zones:["la chapelle ou le temple","le banquet","les cuisines et les coulisses","la chambre nuptiale"],climax:"le moment des vœux arrive : 4 tours avant le oui définitif",fin:"Le mariage est célébré, et l'alliance avec lui."},
 execution:{nom:"l'exécution publique",cat:"Événements",f:["le condamné est innocent, et il le sait","l'exécution doit servir d'exemple, et toute la ville est forcée d'y assister","le condamné détient un secret que tout le monde veut entendre avant la fin"],
  regle:"Le compte est fixé : l'exécution a lieu à l'aube, et chaque scène rapproche du moment ; la foule réagit à tout.",
  zones:["la prison où attend le condamné","la place, où l'échafaud se dresse","la foule des badauds","l'estrade des juges"],climax:"le bourreau monte sur l'estrade : 4 tours",fin:"La sentence est exécutée."}
});

/* ---------- Éléments propres à chaque univers ---------- */
const ELT_UNIV={
 fantasy:{
  tour:{nom:"la tour du sorcier",f:["son maître a disparu, et la tour défend seule ses secrets","chaque étage est un monde différent, scellé par un sort","elle se déplace d'une colline à l'autre chaque nuit"],regle:"La tour réagit aux intrus : chaque étage a sa propre règle magique (gravité inversée, silence absolu, temps ralenti), à annoncer en entrant.",zones:["le hall des statues","la bibliothèque qui chuchote","le laboratoire","le sommet, sous le dôme"],climax:"les sortilèges de la tour se libèrent : 4 tours avant qu'elle ne s'effondre sur elle-même",fin:"La tour disparaît, avec ce qu'elle contient."},
  portail:{nom:"le portail féerique",f:["il s'ouvre au solstice, et la cour féerique réclame un tribut","quelqu'un l'a forcé, et les fées chassent maintenant dans les bois","de l'autre côté, le temps passe cent fois plus vite"],regle:"Les fées tiennent parole à la lettre : toute promesse faite près du portail engage vraiment, et mentir y est impossible.",zones:["le cercle de champignons","le bois où le temps se trouble","le pont de brume","la cour de l'autre côté"],climax:"le portail s'élargit : 4 tours avant que la cour ne passe en entier",fin:"Le portail se referme, avec des otages de l'autre côté."},
  necropole:{nom:"la nécropole naine",f:["les rois nains y dorment avec leur or, et ils ne dorment plus","une forge y brûle encore, alimentée par des morts","on y a scellé une erreur que les nains ont toujours niée"],regle:"Les nains ont tout piégé : chaque porte, chaque marche a son mécanisme ; un échec de détection coûte 1d8.",zones:["la grande porte runique","la salle des ancêtres","la forge des morts","le tombeau du premier roi"],climax:"les gardiens de pierre s'éveillent un à un : 4 tours",fin:"Les rois nains se relèvent."},
  chimeres:{nom:"le marché aux chimères",f:["on y vend des créatures hybrides, et l'une s'est échappée","son maître greffe des êtres vivants, parfois des clients","une chimère y parle et supplie qu'on la rachète"],regle:"Les bêtes sont partout : une cage qui s'ouvre change chaque scène en chaos (un jet standard pour garder le contrôle).",zones:["les allées de cages","la ménagerie des invendables","l'atelier de greffe","la tente du maître chimériste"],climax:"toutes les cages s'ouvrent : 4 tours de chaos",fin:"La chimère s'échappe dans la ville."}},
 medieval:{
  chantier:{nom:"la cathédrale en chantier",f:["les ouvriers meurent un à un, et l'on parle d'une malédiction","le maître d'œuvre cache dans les fondations quelque chose qui ne doit pas être trouvé","l'évêque et le seigneur se disputent qui paiera, et qui possédera"],regle:"Tout est échafaudage : se battre en hauteur impose un jet d'arts du mouvement à chaque tour, sous peine de chute (2d8).",zones:["la loge des tailleurs de pierre","les échafaudages","la crypte inachevée","la voûte en construction"],climax:"la voûte cède : 4 tours avant l'effondrement",fin:"La cathédrale s'effondre, ou se consacre sur un crime."},
  tournoi:{nom:"le tournoi",f:["un champion y tue ses adversaires, et ce n'est pas un accident","le vainqueur épousera l'héritière, et tous les coups sont permis","il sert de couverture à une conjuration de seigneurs"],regle:"Le tournoi a ses lois : déroger à l'honneur devant tous coûte plus cher qu'une défaite.",zones:["le campement des chevaliers","les tribunes","les écuries","la lice"],climax:"la joute finale commence : 4 passes",fin:"Le tournoi couronne le mauvais vainqueur."},
  chateau:{nom:"le château assiégé",f:["il tient depuis des mois, et la faim fait des traîtres","son seigneur est mort, et on cache la nouvelle aux assiégeants","un souterrain mène dehors, et quelqu'un le vend"],regle:"Les vivres sont comptés : chaque jour de jeu coûte une ration ; sans ration, pas de récupération au repos long.",zones:["la basse-cour bondée","les courtines","le souterrain","le donjon"],climax:"les assiégeants donnent l'assaut : 4 tours",fin:"Le château tombe."},
  leproserie:{nom:"la léproserie",f:["on y cache un malade qui n'est pas lépreux","les religieuses qui la tiennent font payer cher leur silence","une épidémie part de là, et ce n'est pas la lèpre"],regle:"Personne ne veut y entrer : quiconque en ressort est chassé des villes (désavantage social jusqu'à la fin de l'aventure).",zones:["la porte et la cloche des aumônes","le dortoir des malades","la chapelle","le jardin des simples"],climax:"les villageois viennent y mettre le feu : 4 tours",fin:"La léproserie brûle avec ses secrets."}},
 pirates:{
  galion:{nom:"le galion fantôme",f:["il apparaît dans la brume chaque nuit de pleine lune, chargé d'or","son équipage maudit cherche un vivant pour prendre la barre","il traîne dans son sillage une tempête éternelle"],regle:"À bord, les morts ne meurent pas : un marin fantôme abattu se relève au tour suivant, sauf avec du sel, du feu ou une lame bénie.",zones:["le pont couvert de brume","la batterie des canons","la cale au trésor","la dunette du capitaine mort"],climax:"le galion plonge vers les abysses : 4 tours pour quitter le bord",fin:"Le galion repart avec un nouvel équipage."},
  fort:{nom:"le fort du gouverneur",f:["ses canons tiennent la baie, et la flotte pirate veut les faire taire","le gouverneur y cache une prisonnière que tout le monde croit morte","son trésor de guerre part demain pour l'Espagne"],regle:"La garnison est nombreuse : toute alerte fait venir 1d6 soldats par tour.",zones:["le quai et les entrepôts","les remparts et les canons","les cachots","les appartements du gouverneur"],climax:"la poudrière va sauter : 4 tours",fin:"Le fort tient, et les pendaisons commencent."},
  crique:{nom:"la crique des contrebandiers",f:["le seul passage pour entrer à marée haute appartient à une bande","les douaniers y ont tendu un piège","une cargaison y attend, et ce n'est pas du rhum"],regle:"La marée commande : certains lieux ne sont accessibles qu'à marée basse, et elle remonte en quelques heures.",zones:["la plage de galets","les grottes-entrepôts","le chemin des falaises","la goélette à l'ancre"],climax:"la marée remonte : 4 tours avant que les grottes soient noyées",fin:"La cargaison quitte la crique."},
  maelstrom:{nom:"le maelström",f:["il garde une île que personne n'a jamais atteinte","il s'est formé la nuit où un trésor maudit a coulé","il grossit, et avale maintenant les navires de pêche"],regle:"Plus on approche, plus le courant tire : chaque tour, un jet standard pour garder le cap ; trois échecs, et le navire est aspiré.",zones:["le cercle des épaves","le courant extérieur","l'œil du tourbillon","le récif au fond"],climax:"le tourbillon accélère : 4 tours avant d'être aspiré",fin:"Le maelström avale le navire."}},
 western:{
  boomtown:{nom:"la ville-champignon",f:["elle a poussé en une semaine autour d'un filon, et la loi n'y existe pas","le filon est épuisé, et quelqu'un l'a caché à tous","une compagnie veut raser la ville pour le chemin de fer"],regle:"Tout s'achète : l'argent ouvre toutes les portes, et chaque service a son prix (à négocier).",zones:["la rue principale","le bureau du shérif","l'hôtel-bordel","le bureau de la compagnie"],climax:"un incendie prend dans la rue de planches : 4 tours",fin:"La ville est rasée, ou vendue."},
  saloon:{nom:"le saloon",f:["une partie de poker y décide de la propriété de la ville","le pianiste a vu le meurtre, et ne joue plus","son patron cache un fugitif à l'étage"],regle:"Au saloon, la violence a un public : la moindre bagarre devient générale (tous les PNJ prennent parti).",zones:["le comptoir","la table de poker","l'étage et ses chambres","la cave à whisky"],climax:"la fusillade éclate : 4 tours avant que le saloon brûle",fin:"Le saloon change de propriétaire."},
  mineor:{nom:"la mine d'or",f:["les mineurs disparaissent dans la galerie du fond","le filon est sur une terre sacrée, et ses gardiens reviennent","un éboulement y a enfermé des hommes vivants"],regle:"La mine est instable : chaque coup de feu fait trembler les galeries (jet standard, ou éboulement 2d8).",zones:["le carreau et le chevalement","la galerie principale","le puits abandonné","le filon, au fond"],climax:"la dynamite est allumée : 4 tours",fin:"La mine s'effondre."},
  fortcav:{nom:"le fort de cavalerie",f:["il est isolé, et ses renforts ne viendront pas","son commandant mène une guerre personnelle","un traité doit y être signé, et quelqu'un veut le saboter"],regle:"La discipline règne : tout désordre se paie au cachot, et les soldats obéissent à leur officier avant tout.",zones:["la place d'armes","les écuries","le magasin à poudre","le bureau du commandant"],climax:"l'attaque frappe la palissade : 4 tours",fin:"Le fort tombe, ou le traité est déchiré."}},
 contemporain:{
  centre:{nom:"le centre commercial",f:["après la fermeture, quelqu'un y vit, et chasse","une panne a enfermé des centaines de personnes à l'intérieur","son sous-sol abrite un trafic que la sécurité couvre"],regle:"Les caméras voient tout : agir sans couvrir son visage, c'est être identifié ; le PC sécurité est la clé.",zones:["la galerie marchande","le parking souterrain","les réserves","le PC sécurité"],climax:"les rideaux de fer tombent : 4 tours avant d'être enfermés",fin:"Le centre rouvre, comme si de rien n'était."},
  hopital:{nom:"l'hôpital",f:["des patients guérissent miraculeusement au troisième sous-sol","un témoin protégé y est soigné, et des tueurs viennent","une épidémie inconnue y est apparue, et on cache tout"],regle:"On y croise des innocents partout : toute violence a des témoins et des victimes collatérales.",zones:["les urgences","le service de nuit","la morgue","le laboratoire du sous-sol"],climax:"les portes se verrouillent en quarantaine : 4 tours",fin:"L'hôpital est mis en quarantaine, avec les coureurs dedans."},
  metro:{nom:"la station de métro",f:["une rame fantôme y passe chaque nuit à 3 h 12","un réseau oublié s'ouvre derrière une porte condamnée","la dernière rame est prise en otage"],regle:"Sous terre, plus de réseau : téléphones muets, et chaque tunnel peut cacher une rame qui arrive (jet d'arts du mouvement).",zones:["le quai désert","les tunnels de service","la station abandonnée","la salle des commandes"],climax:"une rame arrive à pleine vitesse : 4 tours",fin:"La rame fantôme emporte ses passagers."},
  parc:{nom:"le parc d'attractions",f:["il a fermé il y a des années, mais ses manèges tournent la nuit","son propriétaire y blanchit l'argent de toute la ville","une attraction a fait des victimes qu'on a fait disparaître"],regle:"Les attractions sont des armes : chaque manège peut servir de piège ou de fuite, à condition de le faire démarrer.",zones:["l'allée principale","la maison hantée","les montagnes russes","le local technique"],climax:"le grand huit s'emballe : 4 tours",fin:"Le parc garde ses visiteurs."}},
 postapo:{

  supermarche:{nom:"le supermarché fortifié",f:["une famille y règne sur les dernières conserves","il recèle une pharmacie intacte que tout le monde veut","sa réserve frigorifique contient quelque chose qui n'est pas de la viande"],regle:"Tout se troque : chaque service a un prix en eau, balles ou médicaments.",zones:["le parking piégé","les rayons vides","la réserve","le bureau du gérant"],climax:"les pillards enfoncent les portes : 4 tours",fin:"Le supermarché tombe aux mains des pillards."},
  bunker:{nom:"la cité-bunker",f:["elle vient de rouvrir ses portes après cinquante ans","ses habitants ignorent que la guerre est finie","son ordinateur central décide qui a le droit de vivre"],regle:"Le bunker a ses règles : badges, couvre-feu, rations ; être pris sans badge mène au recyclage.",zones:["le sas d'entrée","les quartiers d'habitation","la serre hydroponique","le cœur informatique"],climax:"le sas se referme pour cinquante ans : 4 tours",fin:"Le bunker se scelle."},
  autoroute:{nom:"l'autoroute effondrée",f:["c'est la seule route vers l'eau, tenue par une bande","un convoi y est bloqué, plein de survivants","sous les ponts écroulés vit une communauté oubliée"],regle:"Tout se joue en véhicule ou à pied entre les carcasses : chaque poursuite a son terrain, et l'essence est comptée.",zones:["le péage barricadé","le pont écroulé","le cimetière de voitures","le campement sous l'échangeur"],climax:"le pont cède sous le convoi : 4 tours",fin:"La route est coupée pour de bon."}},
 cyberpunk:{

  vr:{nom:"le club de réalité virtuelle",f:["des clients n'en sortent plus, et leurs corps dépérissent","on y achète des souvenirs volés","un monde virtuel y tient prisonnier quelqu'un de réel"],regle:"Deux mondes à la fois : ce qui arrive dans le virtuel blesse le corps (dégâts réels, moitié moins).",zones:["le bar à néons","les capsules de connexion","le monde virtuel","la salle serveur"],climax:"le monde virtuel s'effondre avec les joueurs dedans : 4 tours",fin:"Les joueurs ne se réveillent pas."},
  clinique:{nom:"la clinique clandestine",f:["son charcudoc pose des implants volés","on y a opéré l'un des coureurs, sans son accord","elle prélève des organes sur ses patients endettés"],regle:"Chaque implant se paie : soins et améliorations y sont possibles, mais chaque intervention crée une dette.",zones:["la salle d'attente","le bloc opératoire","la chambre froide","le bureau du charcudoc"],climax:"le charcudoc active les implants qu'il a posés : 4 tours",fin:"La clinique déménage, et efface ses patients."}},
 scifi:{
  station:{nom:"la station orbitale",f:["son support vital tombe en panne, secteur par secteur","elle tourne autour d'une planète qui ne figure sur aucune carte","sa population se divise entre deux factions armées"],regle:"L'air est compté : chaque secteur dépressurisé est mortel sans combinaison ; une brèche se colmate ou se fuit.",zones:["le module d'amarrage","les coursives circulaires","le jardin hydroponique","le pont de commandement"],climax:"l'orbite se dégrade : 4 tours avant l'entrée dans l'atmosphère",fin:"La station s'écrase."},
  colonie:{nom:"le vaisseau-colonie",f:["ses dormeurs se réveillent un par un, changés","il arrive à destination, et il n'y a rien","l'équipage a oublié qu'il était dans un vaisseau"],regle:"Les dormeurs sont sacrés : chaque capsule endommagée tue quelqu'un, et le vaisseau le signale à tous.",zones:["la salle des caissons","les ponts abandonnés","la serre","la passerelle"],climax:"l'IA du vaisseau lance une purge : 4 tours",fin:"Le vaisseau arrive, et les dormeurs ne se réveillent pas."},
  dome:{nom:"le dôme terraformé",f:["il protège la seule colonie de la planète, et il se fissure","la terraformation a réveillé quelque chose sous la roche","la compagnie qui le possède veut l'évacuer pour l'exploiter"],regle:"Dehors, l'air tue : toute sortie demande une combinaison, et chaque déchirure coûte 1d6 PV par tour.",zones:["le quartier des colons","les serres","le générateur atmosphérique","la fissure"],climax:"le dôme se brise : 4 tours",fin:"Le dôme cède."},
  epavexeno:{nom:"l'épave extraterrestre",f:["elle s'est écrasée il y a des millénaires et émet encore","ses couloirs sont faits pour des créatures qui n'ont pas notre forme","elle répare ses circuits avec ce qu'elle trouve, y compris des corps"],regle:"Rien n'est fait pour des humains : portes, escaliers et symboles demandent une épreuve (jet standard) pour être compris.",zones:["la brèche d'entrée","les couloirs organiques","la salle des cocons","le cœur qui bat"],climax:"l'épave redémarre : 4 tours avant le décollage",fin:"L'épave repart, avec ses passagers."}},
 spaceop:{

    {t:"Les traces",v:"Dans les profondeurs des lieux, on découvre d'où vient la chose, et pourquoi elle épargne {a}.",at:"la preuve que {a} la protège",renc:"facile"}],
