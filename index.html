  prep:[
   {t:"Le message",voir:"Dans la maison de l'enfant, {lumieres} clignotent : il répond, de l'autre côté, si l'on trouve comment lui parler.",qui:"{AllieN}, à bout de nerfs, refuse de quitter la maison.",gagne:"l'enfant indique où le passage s'ouvre, et où il se cache.",rate:"le message reste incompréhensible ; il faudra chercher le passage, et perdre une nuit."},
   {t:"Le laboratoire",voir:"Dans les bois, un lieu interdit tenu par {patron} est gardé jour et nuit.",qui:"{SavantN} nie tout, mais un employé terrifié est prêt à parler.",gagne:"le passage ne se refermera qu'en détruisant ce qui l'a ouvert, au cœur du lieu interdit.",rate:"les gardes repoussent les coureurs, et {savantN} sait désormais qui ils sont.",renc:{k:"humains",diff:"facile"}},
   {t:"La fugitive",voir:"Dans {lieuSauvage}, une enfant étrange, échappée du lieu interdit, se cache et vole de quoi manger.",qui:"Elle parle peu, a peur des adultes, mais ce qu'elle sait faire repousse la créature.",gagne:"une alliée capable de retenir la créature quelques instants.",rate:"les hommes {dpatron} la reprennent."}],
  a3:"La créature emporte quelqu'un d'autre, et les hommes {dsavantN} arrivent pour faire taire les témoins.",r3:{k:"humains",diff:"equilibre"},
  a4:"Les coureurs passent de l'autre côté : le même lieu, en ruines, froid et silencieux. L'enfant est là, prisonnier de lianes. La créature revient vers son repaire.",
  si:["Si l'enfant a pu les guider : ils savent exactement où le chercher, et ne perdent pas de temps.","S'ils savent comment fermer le passage : l'un d'eux peut détruire ce qui l'a ouvert pendant que les autres ramènent l'enfant.","Si la fugitive est avec eux : elle retient la créature 2 tours, puis s'effondre, épuisée."],
  opts:["Libérer l'enfant et repasser avant que la créature ne revienne (3 tours).","Affronter la créature avec {armeC}.","Détruire ce qui a ouvert le passage, au risque de rester bloqué de l'autre côté."],
  r4:{k:"monstre",diff:"rude",nom:"La chose de l'autre côté"},
  sec:["{SavantN} a ouvert le passage exprès, et compte recommencer ailleurs.","L'enfant ramené n'est pas tout à fait le même : quelque chose de l'autre côté est revenu avec lui."],
  fiches:[["La créature","monstre","La chose de l'autre côté"],["Le savant","savant"],["L'allié","allie"],["L'enfant disparu","enfant"]]},

 tintin:{g:"enquete",t:["Le secret de l'objet","Les trois messages","Le trésor oublié"],
  pitch:"{MarchandD} vend aux coureurs un vieil objet pour une bouchée de pain. Le soir même, quelqu'un tente de le voler, et le vendeur disparaît. Dans l'objet est caché un message qui mène à {tresor}, et {chefGangD} est prêt à tout pour mettre la main dessus.",
  a1:"À {marche}, les coureurs achètent un vieil objet chez {marchandN}. La nuit suivante, on fouille leur logement. Le lendemain, l'endroit est vide et {marchandN} a disparu. Dans un double fond de l'objet : un fragment de message.\nRécompense : une part du trésor.",
  a2:"Le message est incomplet, et {chefGangN} a une longueur d'avance.",
  prep:[
   {t:"Les autres fragments",voir:"Deux autres objets identiques existent. L'un appartient à un collectionneur, dans {lieuRiche}.",qui:"Le collectionneur, flatté qu'on s'intéresse à lui, refuse de vendre mais accepte de montrer.",gagne:"le message complet : l'endroit exact du trésor.",rate:"{chefGangN} l'a volé avant eux ; les coureurs n'ont qu'une partie du chemin."},
   {t:"Le vendeur disparu",voir:"Dans {basFonds}, on a vu {marchandN} emmené de force vers {port}.",qui:"{TemoinD} a tout vu, mais ne parlera qu'à l'abri des oreilles indiscrètes.",gagne:"l'endroit où est retenu le vendeur, et le nom de ceux qui l'ont enlevé : les hommes {dchefGangN}.",rate:"le témoin est menacé et se tait.",renc:{k:"humains",diff:"facile"}},
   {t:"L'enquêteur obstiné",voir:"{CapitaineD} suit les coureurs à la trace, persuadé que ce sont eux les voleurs.",qui:"{CapitaineN}, maladroit{capitaineE} mais honnête.",gagne:"{capitaineN} change d'avis et se range du côté des coureurs.",rate:"{capitaineN} les fait enfermer une nuit, et ils perdent du temps."}],
  a3:"En route vers {ruines}, les coureurs tombent dans un piège : {chefGangN} les attendait, et le vendeur est son otage.",r3:{k:"humains",diff:"equilibre"},
  a4:"Dans {ruines}, {chefGangN} et ses hommes fouillent déjà. Le vendeur est ligoté près d'eux.",
  si:["S'ils ont le message complet : ils savent où est vraiment le trésor, et {chefGangN} cherche au mauvais endroit.","S'ils savent où était le vendeur : ils l'ont déjà libéré, et il connaît un passage dans les ruines.","Si {capitaineN} est de leur côté : {ilcapitaine} arrive avec du renfort au troisième tour."],
  opts:["Libérer l'otage et filer avec le trésor.","Laisser les hommes {dchefGangN} déclencher un piège ancien.","Affronter {chefGangN}."],
  r4:{k:"perso",role:"chefGang",b:["veteran","lieutenant","seigneur"],troupe:"humains",diff:"rude"},
  sec:["Le trésor n'est pas de l'or : c'est un objet sans valeur marchande, mais précieux pour l'histoire d'une famille.","{MarchandN} savait tout : l'objet a été vendu aux coureurs exprès, pour qu'ils trouvent le trésor à sa place."],
  fiches:[["Le chef de bande","chefGang"],["Le vendeur","marchand"],["L'enquêteur","capitaine"],["Le témoin","temoin"]]},

 poirot:{g:"enquete",t:["Mort pendant la fête","L'horloge arrêtée","Les petites cellules grises"],
  pitch:"Pendant {fete}, dans {lieuRiche}, on retrouve {nobleD} mort dans son bureau fermé à clé. Tous les invités avaient une raison de lui en vouloir. Le coupable, c'est {heritierD}, qui a avancé l'horloge pour se donner un alibi.",
  a1:"Les coureurs sont invités à {fete}, ou engagés pour y veiller. Au milieu de la soirée, un cri : {nobleN} est mort dans son bureau, fermé de l'intérieur. {CapitaineD} demande aux coureurs de l'aider discrètement : il y a trop de gens importants.\nPaie : {rec}.",
  a2:"Personne ne quitte les lieux avant demain matin.",
  prep:[
   {t:"Le bureau",voir:"Une horloge arrêtée à minuit, une coupe renversée, une ouverture mal fermée.",qui:"{CapitaineN} croit que l'horloge donne l'heure du crime.",gagne:"la preuve que l'horloge a été avancée : le crime a eu lieu bien plus tôt.",rate:"les coureurs croient l'horloge, et l'alibi du coupable tient."},
   {t:"Les invités",voir:"Dans le grand salon, chacun a son secret : une dette, une liaison, une vengeance.",qui:"{EspionD} a tout observé, et vend volontiers ce qu'{ilespion} sait.",gagne:"qui était où, et quand : seul {heritierN} n'a aucun témoin pour l'heure réelle du crime.",rate:"les coureurs se perdent dans les fausses pistes."},
   {t:"Le testament",voir:"Chez l'homme de loi de la famille, un testament daté de la veille déshérite {heritierN}.",qui:"{MedecinD}, médecin de la famille, confirme que la victime voulait le signer le soir même.",gagne:"le mobile.",rate:"le testament a disparu."}],
  a3:"Pendant la nuit, on retrouve {medecinN} empoisonné{medecinE} : {ilmedecin} en savait trop. Les invités paniquent et accusent les coureurs.",r3:false,
  a4:"Au matin, les coureurs réunissent tous les invités dans le grand salon. C'est l'heure de dévoiler le coupable. Démasqué, {heritierN} tentera de fuir, ou de faire taire le dernier témoin.",
  si:["S'ils ont compris l'horloge : l'alibi {dheritierN} s'effondre devant tout le monde.","S'ils savent qui était où : les invités confirment, un par un, et {heritierN} est cerné{heritierE}.","S'ils ont le mobile : {heritierN} perd son sang-froid et se trahit."],
  opts:["Exposer les preuves dans l'ordre, sous les yeux de tous.","Pousser {heritierN} à se trahir avec une fausse preuve.","L'empêcher de fuir, ou de frapper le dernier témoin."],
  r4:{seul:true,k:"perso",role:"heritier",b:["sbire","veteran"],diff:"equilibre"},
  sec:["{CapitaineN} savait : quelqu'un l'a payé{capitaineE} pour orienter l'enquête vers un domestique.","La victime était déjà empoisonnée par quelqu'un d'autre : {heritierN} n'a fait qu'achever le travail."],
  fiches:[["Le coupable","heritier"],["La victime","noble"],["L'officier","capitaine"],["L'observateur","espion"]]},

 columbo:{g:"enquete",t:["Une dernière petite question","L'alibi parfait","Le crime parfait"],
  pitch:"{NobleD} a tué {victimeD} et maquillé le crime en accident. Tout le monde le sait ; personne ne peut le prouver. {ClientD} engage les coureurs pour trouver la faille.",
  a1:"{ClientN} raconte : {victimeN} menaçait de révéler les affaires {dnobleN}. Deux jours plus tard, l'accident. {NobleN} reçoit les condoléances avec un sourire, et un alibi parfait : présent à {fete}, devant cent témoins.\nPaie : {rec}.",
  a2:"Le coupable est connu. Tout l'intérêt est de le coincer, avec patience et fausse naïveté.",
  prep:[
   {t:"L'alibi",voir:"À {fete}, cent témoins ont vu {nobleN}. Mais pendant un quart d'heure, personne ne se souvient de l'avoir vu.",qui:"{TemoinN}, un domestique, a remarqué un détail : ses chaussures étaient mouillées à son retour.",gagne:"le trou dans l'alibi.",rate:"les témoins se contredisent, et l'alibi tient."},
   {t:"La petite question",voir:"Revenir voir {nobleN}, encore et encore, avec une question anodine.",qui:"{NobleN} s'agace, mais répond, et finit par mentir sur un détail.",gagne:"un mensonge vérifiable : {nobleN} connaît un détail qu'on ne pouvait savoir qu'en étant sur les lieux du crime.",rate:"{nobleN} se plaint aux autorités : les coureurs doivent se faire discrets."},
   {t:"L'objet",voir:"Le crime a demandé un objet précis, qui a disparu des affaires de la victime.",qui:"{IndicD} sait où on s'en est débarrassé.",gagne:"l'objet lui-même, avec une trace du coupable.",rate:"l'objet est détruit avant qu'ils ne le trouvent.",renc:{k:"humains",diff:"facile",siRate:1}}],
  a3:"{NobleN} sent le danger et fait pression : menaces, appuis haut placés, puis un accident arrangé pour l'un des coureurs.",r3:{k:"humains",diff:"equilibre"},
  a4:"La dernière visite. Les coureurs reviennent voir {nobleN}, « juste une toute dernière question ». C'est le moment de refermer le piège.",
  si:["S'ils ont trouvé le trou dans l'alibi : {nobleN} ne peut plus dire où il était.","S'ils tiennent son mensonge : il suffit de le lui répéter devant témoin.","S'ils ont l'objet : avec les trois, {nobleN} avoue ; avec moins, il nie et appelle ses hommes."],
  opts:["Poser la dernière question, celle qui fait tomber l'alibi.","Laisser croire que l'objet a été retrouvé, et le regarder se trahir.","S'il perd son calme, l'empêcher de fuir."],
  r4:{k:"perso",role:"noble",b:["veteran","lieutenant"],troupe:"humains",diff:"rude"},
  sec:["{ClientN} n'est pas si innocent{ClientE} : la victime l'avait trahi{ClientE} aussi.","{NobleN} n'a pas agi seul : quelqu'un de bien plus puissant a fourni l'alibi."],
  fiches:[["Le coupable","noble"],["La victime","victime"],["Le domestique","temoin"],["L'indicateur","indic"]]},

 rivieres:{g:"enquete",t:["Les rivières pourpres","Les deux affaires","Le secret de l'élite"],
  persos:{tueuse:"une femme au visage dur, venue de loin"},
  pitch:"Un corps est retrouvé mutilé, suspendu au-dessus du vide près de {village}. Au même moment, loin de là, on a profané la tombe d'un enfant. Les deux affaires sont liées : les victimes appartiennent à une élite fermée, protégée par {nobleD}. Le meurtrier, c'est {tueuseD}, qui venge un crime commis par cette élite il y a vingt ans.",
  a1:"{CapitaineD} confie aux coureurs le corps retrouvé près de {village} ; un autre enquêteur suit l'affaire de la tombe profanée. Personne ne voit de lien. Les coureurs, si.\nPaie : {rec}.",
  a2:"Deux affaires en parallèle. Le meurtrier frappera encore.",
  prep:[
   {t:"Le corps",voir:"Sur {lieuChute}, le corps a été mis en scène : yeux arrachés, mains coupées, un message gravé dans la pierre.",qui:"{MedecinD} a examiné le corps : le meurtrier connaît l'anatomie, et il est fort.",gagne:"le meurtrier n'en est pas à son premier corps, et il en veut à ceux qui « voient » : c'est une vengeance.",rate:"la pluie efface les traces."},
   {t:"La tombe profanée",voir:"À {cimetiere}, la tombe d'un enfant mort il y a vingt ans a été ouverte. Le cercueil est vide de toute photographie, de tout souvenir.",qui:"Le gardien du cimetière a vu une femme venir chaque année fleurir cette tombe.",gagne:"le nom de l'enfant, et l'existence de sa mère, que tout le monde croyait partie.",rate:"des inconnus ont fait disparaître toute trace de cette famille."},
   {t:"L'élite",voir:"Dans {palais}, l'élite de la région se protège : on ne parle pas aux étrangers.",qui:"{NobleN} reçoit les coureurs poliment, et les menace tout aussi poliment.",gagne:"la liste des membres de l'élite : on sait qui sera la prochaine victime.",rate:"les coureurs sont discrédités, et on leur retire l'enquête.",renc:{k:"humains",diff:"facile",siRate:1}}],
  a3:"Un deuxième corps est retrouvé. L'élite fait pression pour étouffer l'affaire, et des hommes de main {dnobleN} effacent les preuves.",r3:{k:"humains",diff:"equilibre"},
  a4:"Au-dessus du vide, sur {lieuChute}, {tueuseN} tient la prochaine victime. {NobleN} a envoyé ses hommes pour tout faire disparaître : la victime, la meurtrière, et les coureurs.",
  si:["S'ils ont compris que c'est une vengeance : ils peuvent parler à {tueuseN} de son enfant, et la faire hésiter.","S'ils connaissent l'histoire de l'enfant : ils peuvent prouver le crime de l'élite, et rallier {capitaineN}.","S'ils ont la liste : ils sont arrivés avant la meurtrière, et la victime est déjà à l'abri."],
  opts:["Convaincre {tueuseN} de laisser la justice faire son œuvre.","Sauver la victime au bord du vide (arts du mouvement).","Tenir tête aux hommes {dnobleN}."],
  r4:{k:"humains",diff:"rude"},
  sec:["{NobleN} est le père de l'enfant mort.","{TueuseN} n'agit pas seule : un membre de l'élite, rongé par les remords, l'aide en secret."],
  fiches:[["La meurtrière","tueuse"],["Le protecteur de l'élite","noble"],["L'officier","capitaine"],["Le légiste","medecin"]]},

 retour:{g:"enquete",t:["Le passé à réparer","Avant que tout ne s'efface","Le jour qui a tout changé"],
  rdef:{_:"une machine à voyager dans le temps",uchronie:"une machine secrète de l'Institut",contemporain:"une voiture transformée en machine à voyager dans le temps",steampunk:"la machine à explorer le temps d'un inventeur"},
  pitch:"Les coureurs se réveillent dans {ville}, mais tout a changé : leurs proches ne les reconnaissent plus, et leurs souvenirs s'effacent. {ChefGangD} a remonté le temps grâce à {ressort} et changé un seul événement pour devenir le maître de la ville. Il faut retrouver ce moment, et le réparer.",
  a1:"Les coureurs ne reconnaissent plus {ville} : {chefGangN} y règne, et eux n'ont jamais existé. Seul {savantD} se souvient d'eux : c'est à {savantN} qu'on a volé {ressort}.\nEnjeu : leur propre existence.",
  a2:"Chaque jour, un souvenir s'efface. Au quatrième, les coureurs disparaissent.",
  prep:[
   {t:"La machine",voir:"Dans l'atelier {dsavantN}, il reste des plans et un prototype qui ne marche qu'une fois.",qui:"{SavantN}, génial et paniqué, a besoin d'une pièce rare pour le réparer.",gagne:"un aller pour le passé, et un retour.",rate:"le prototype ne fera qu'un seul trajet : il faudra trouver un autre moyen de revenir."},
   {t:"Le moment",voir:"Dans {savoir}, de vieux récits racontent comment {chefGangN} a fait fortune : un pari gagné, un accident évité, un héritage inattendu.",qui:"{AncienD} se souvient de ce jour, et de qui y était.",gagne:"le jour, l'heure et le lieu exacts où le passé a été changé.",rate:"les coureurs arrivent dans le passé sans savoir précisément quand frapper."},
   {t:"Les sbires",voir:"Les hommes {dchefGangN} cherchent {savantN} pour le faire taire.",qui:"{CapitaineD}, au service {dchefGangN}, commence à douter.",gagne:"{capitaineN} retient ses hommes et laisse le champ libre aux coureurs.",rate:"les hommes {dchefGangN} détruisent l'atelier : il faudra réparer sous la menace.",renc:{k:"humains",diff:"facile"}}],
  a3:"Dans le passé, les coureurs croisent leurs propres parents, ou leur propre jeunesse. Chaque erreur aggrave les choses, et {chefGangN} est là, lui aussi, pour veiller sur son passé.",r3:{k:"humains",diff:"equilibre"},
  a4:"Le moment clé arrive. {ChefGangN} est sur place pour s'assurer que tout se passe comme il l'a prévu. Les coureurs ont 4 tours avant que le changement ne devienne définitif.",
  si:["S'ils ont un retour : ils peuvent agir sans craindre de rester bloqués dans le passé.","S'ils connaissent l'heure exacte : ils sont en place avant {chefGangN}.","Si {capitaineN} les aide : ses hommes ne protègent pas {chefGangN} au moment décisif."],
  opts:["Remettre l'événement dans son cours, discrètement.","Empêcher {chefGangN} d'agir, sans se faire remarquer par le passé.","Lui voler {ressort} pour qu'il ne puisse jamais revenir."],
  r4:{k:"perso",role:"chefGang",b:["veteran","lieutenant"],troupe:"humains",diff:"rude"},
  sec:["{SavantN} a lui-même changé le passé une fois, et a peur qu'on le découvre.","Réparer le passé efface aussi quelque chose de bon que les coureurs ont connu."],
  fiches:[["Le maître de la ville","chefGang"],["L'inventeur","savant"],["Celui qui se souvient","ancien"],["L'homme de main","capitaine"]]}
});

/* ============ Horreur ============ */
Object.assign(OEUVRES_H,{
 thing:{g:"horreur",t:["L'un de nous","Le test du sang","La chose qui imite"],
  pitch:"Dans {lieuIsole}, on a recueilli une bête blessée venue de nulle part. Mais ce n'était pas une bête : c'est une chose qui absorbe ce qu'elle touche et en prend la forme. Désormais, n'importe qui peut être elle. Personne ne peut partir, et la chose veut atteindre le monde extérieur.",
  a1:"Les coureurs se trouvent dans {lieuIsole} quand on recueille la bête blessée. La nuit suivante, des hurlements là où on l'avait enfermée, et un corps difforme, à moitié humain. {ChefD} ordonne le calme ; {medecinD} examine les restes et blêmit.\nPaie : {rec}.",
  a2:"Chacun soupçonne l'autre. La chose frappe quand quelqu'un est seul.",
  prep:[
   {t:"Le test",voir:"Dans l'infirmerie, les restes réagissent à la chaleur : chaque morceau de la chose fuit le feu.",qui:"{MedecinN} propose un test : un peu du sang de chacun, approché d'une flamme.",gagne:"un test pour démasquer la chose : son sang fuit la flamme.",rate:"{medecinN} disparaît avant d'avoir fini ; il faudra deviner."},
   {t:"L'origine",voir:"À l'extérieur, là où la bête a été trouvée, on découvre que quelque chose d'énorme y dort depuis des siècles.",qui:"{SavantD} en a déjà prélevé un morceau, et le garde.",gagne:"savoir ce que veut la chose : atteindre le monde extérieur, par {issue}.",rate:"{savantN} refuse de parler et garde son échantillon."},
   {t:"Les armes",voir:"Il faut de quoi brûler : la réserve est sous clé, et quelqu'un en a volé une partie.",qui:"{ChefN} refuse d'armer qui que ce soit avant de savoir qui est humain.",gagne:"assez de feu pour détruire la chose, sous sa vraie forme.",rate:"il ne reste que des armes ordinaires, qui ne la tuent pas."}],
  a3:"La chose se révèle : l'un des survivants, {chefN} en personne, se déchire et attaque. Le chaos est total, et une partie des survivants a déjà été remplacée.",r3:{k:"monstre",diff:"equilibre",nom:"La chose (forme partielle)"},
  a4:"La chose se dirige vers {issue}. Si elle l'atteint, elle quitte {lieuIsoleC}, et rien ne l'arrêtera plus. Sous sa vraie forme, c'est une masse de chairs et de membres.",
  si:["S'ils ont le test : ils savent qui est encore humain parmi les survivants, et peuvent compter sur eux.","S'ils savent ce qu'elle veut : ils ont déjà saboté {issue}, et elle est piégée.","S'ils ont du feu : chaque coup de feu la fait reculer, et la tuer devient possible."],
  opts:["Détruire {issue} pour qu'elle ne puisse jamais partir, quitte à rester bloqué.","La brûler sous sa vraie forme.","Faire s'effondrer {lieuIsoleC} sur elle."],
  r4:{k:"monstre",diff:"rude",nom:"La chose (vraie forme)"},
  sec:["Un des survivants qui a réussi le test n'est plus humain : il a trompé le test.","{SavantN} veut emporter un échantillon, et il est prêt à tout pour ça."],
  fiches:[["La chose","monstre","La chose (vraie forme)"],["Le chef des lieux","chef"],["Le médecin","medecin"],["Le savant","savant"]]},

 lovecraft:{g:"horreur",t:["L'appel des profondeurs","Ce qui dort sous {village}","Le culte"],
  pitch:"À {village}, des gens disparaissent les nuits sans lune, et les survivants font tous le même rêve. {PretreD} dirige en secret un culte qui veut réveiller une chose endormie depuis des âges, grâce à {relique}. On ne la vaincra pas : on peut seulement la renvoyer dormir.",
  a1:"{AllieD} écrit aux coureurs : un proche a disparu à {village}, après avoir parlé de chants dans la nuit. Sur place, les habitants se taisent, et {pretreN} accueille les étrangers avec une gentillesse inquiétante.\nPaie : {rec}.",
  a2:"La nuit sans lune arrive dans trois jours. Ce qu'on apprend coûte cher à l'esprit.",
  prep:[
   {t:"Le savoir interdit",voir:"Dans {savoir}, un savoir oublié décrit la chose, et la seule façon de la renvoyer : un chant à l'envers.",qui:"{AncienD} a appris ce savoir autrefois, et ne dort plus depuis.",gagne:"le chant qui renvoie la chose dormir.",rate:"les coureurs en apprennent trop : chacun perd quelques points d'esprit (voir le livre, p. 30)."},
   {t:"Les disparus",voir:"Dans {repaire}, des cellules vides, des cordes, et des signes peints avec du sang.",qui:"{TemoinD}, échappé de justesse, tremble et parle de « ceux d'en bas ».",gagne:"le lieu et l'heure du rituel : {sanctuaire}, à minuit.",rate:"les cultistes surprennent les coureurs.",renc:{k:"humains",diff:"facile"}},
   {t:"L'objet",voir:"{Relique} est gardée chez {pretreN}, dans une pièce fermée.",qui:"{EspionD}, membre du culte malgré {luiespion}, veut s'en sortir.",gagne:"l'objet volé ou remplacé par un faux : le rituel sera affaibli.",rate:"le culte sait que les coureurs savent."}],
  a3:"Le culte frappe : {allieN} est enlevé{allieE}, et les habitants de {village} entourent les coureurs, le regard vide.",r3:{k:"humains",diff:"equilibre"},
  a4:"Minuit, dans {sanctuaire}. Les cultistes chantent, {pretreN} brandit {relique}, et quelque chose commence à remonter. Le rituel s'achève en 4 tours.",
  si:["S'ils connaissent le chant à l'envers : le chanter pendant 3 tours renvoie la chose dormir.","S'ils connaissaient le lieu : ils sont arrivés avant le début, et l'otage est encore libre.","S'ils ont l'objet, ou l'ont remplacé : le rituel prend 6 tours au lieu de 4."],
  opts:["Interrompre {pretreN} et lui arracher {relique}.","Chanter le chant à l'envers pendant que les autres tiennent les cultistes.","Fuir avec l'otage avant que la chose n'apparaisse."],
  r4:{k:"perso",role:"pretre",b:["sorcier","lieutenant"],troupe:"humains",diff:"rude"},
  sec:["{AncienN} faisait partie du culte autrefois, et c'est {luiancien} qui a appris le rituel à {pretreN}.","La chose est déjà à moitié réveillée : même renvoyée, elle a laissé une marque sur l'un des coureurs."],
  fiches:[["Le grand prêtre","pretre"],["Celui qui a lu","ancien"],["Le cultiste repenti","espion"],["L'allié","allie"]]},

 it:{g:"horreur",t:["Ça revient","Les peurs d'enfance","Sous {village}"],
  pitch:"Tous les vingt-sept ans, des enfants disparaissent à {village}. Une chose sans nom revient, prend la forme de ce qui fait le plus peur, et se nourrit de cette peur. Les coureurs, ou les gens qui les ont engagés, l'ont déjà affrontée enfants ; ils avaient juré de revenir.",
  a1:"{AllieD} appelle les coureurs : un enfant a disparu à {village}, et un signe familier, comme autrefois, a été retrouvé près de {repaire}. {AllieN} se souvient de la dernière fois, et de la promesse faite.\nPaie : {rec}.",
  a2:"La chose se nourrit de peur. Chaque nuit, elle prend une forme nouvelle.",
  prep:[
   {t:"Les souvenirs",voir:"Dans {savoir}, les anciens récits racontent les disparitions, tous les vingt-sept ans.",qui:"{AncienD} a survécu à la chose, enfant, et sait ce qui la blesse : qu'on n'ait pas peur d'elle.",gagne:"le secret de la chose : elle s'affaiblit quand on lui rit au nez, ou qu'on refuse d'avoir peur.",rate:"les souvenirs restent flous ; les coureurs ne savent pas ce qui la blesse."},
   {t:"Les enfants",voir:"Au parc, les enfants de {village} ont vu la chose, chacun sous une forme différente.",qui:"{TemoinN}, un enfant courageux, veut aider.",gagne:"l'entrée de son repaire, que les enfants ont trouvée.",rate:"l'enfant disparaît à son tour."},
   {t:"Les adultes",voir:"Les adultes de {village} ne voient rien, ou ne veulent rien voir. Certains servent la chose sans le savoir.",qui:"{CapitaineD} est sous son influence et menace les coureurs.",gagne:"{capitaineN} se libère de l'influence et prête main-forte.",rate:"{capitaineN} attaque les coureurs.",renc:{k:"humains",diff:"facile",siRate:1}}],
  a3:"La chose sépare les coureurs : chacun voit sa pire peur, seul. Un enfant a été emporté dans le repaire.",r3:{k:"monstre",diff:"equilibre",nom:"Une peur"},
  a4:"Sous {village}, dans {repaire}, la chose montre sa vraie forme. Les enfants disparus flottent, endormis, autour d'elle.",
  si:["S'ils connaissent son secret : chaque coureur qui refuse d'avoir peur lui inflige des dégâts doubles.","S'ils connaissent l'entrée : ils arrivent ensemble, et la chose ne peut pas les séparer.","Si {capitaineN} est avec eux : {ilcapitaine} sort les enfants pendant le combat."],
  opts:["L'affronter tous ensemble, sans peur.","Arracher les enfants à la chose et fuir.","Sceller {repaire} pour vingt-sept ans de plus."],
  r4:{k:"monstre",diff:"rude",nom:"La chose qui revient"},
  sec:["La chose n'est jamais vraiment morte : elle reviendra, et l'un des coureurs l'a toujours su.","{AllieN} a fait un marché avec la chose, enfant, pour être épargné{allieE}."],
  fiches:[["La chose","monstre","La chose qui revient"],["Le survivant","ancien"],["L'allié","allie"],["L'enfant courageux","temoin"]]},

 gremlins:{g:"horreur",t:["Les trois règles","Après minuit","La fête gâchée"],
  pitch:"{MarchandD} a vendu une petite créature adorable avec trois règles : pas de lumière vive, pas d'eau, jamais de nourriture après minuit. Évidemment, les trois règles ont été enfreintes. Les créatures se multiplient, deviennent méchantes, et {village} s'apprête à célébrer {fete}.",
  a1:"{AllieD} a reçu la créature en cadeau, et a enfreint les règles. Depuis, des petites horreurs se cachent partout. {AllieN} supplie les coureurs de réparer les dégâts avant {fete}.\nPaie : {rec}.",
  a2:"Chaque goutte d'eau multiplie les créatures. Elles veulent faire la fête.",
  prep:[
   {t:"Le vendeur",voir:"Dans la boutique {dmarchandN}, un vieux comptoir couvert de poussière.",qui:"{MarchandN} connaît les créatures et explique ce qui les tue : la lumière vive.",gagne:"le point faible des créatures : la lumière vive les brûle.",rate:"la boutique est vide ; les coureurs devront découvrir ce qui les tue par eux-mêmes."},
   {t:"Le nid",voir:"Dans {lieuPublic}, des cocons gluants : les créatures se transforment.",qui:"La créature originale, gentille, se cache et peut aider.",gagne:"la créature gentille, qui les guide vers le chef de la bande.",rate:"les cocons éclosent pendant qu'ils regardent.",renc:{k:"meute",diff:"facile",nom:"Petits monstres"}},
   {t:"La fête",voir:"Dans {ville}, les préparatifs de {fete} vont bon train. Les créatures comptent s'y rendre.",qui:"{NobleD} refuse d'annuler la fête.",gagne:"un plan pour attirer toutes les créatures au même endroit, loin de la foule.",rate:"la fête a lieu, et la foule sera là."}],
  a3:"Les créatures envahissent {village} : chaos, pannes, rires aigus. Leur chef, plus grand que les autres, prend la tête de la bande.",r3:{k:"meute",diff:"equilibre",nom:"Petits monstres"},
  a4:"Dans {lieuPublic}, les créatures font la fête. Leur chef se prépare à plonger dans l'eau pour se multiplier encore.",
  si:["S'ils connaissent le point faible : une lumière vive les fait fuir, et peut tuer le chef.","Si la créature gentille les aide : elle distrait le chef au moment décisif.","S'ils ont prévu de les attirer : elles sont toutes au même endroit, et la foule est à l'abri."],
  opts:["Allumer une lumière vive au bon moment.","Empêcher le chef d'atteindre l'eau.","Mettre le feu au bâtiment, avec les créatures dedans."],
  r4:{k:"meute",diff:"rude",nom:"Petits monstres"},
  sec:["{MarchandN} voulait que tout cela arrive : {ville} lui doit quelque chose.","Une créature s'est échappée et se cache dans les bagages des coureurs."],
  fiches:[["Les créatures","meute","Petits monstres"],["Le vendeur","marchand"],["L'allié","allie"],["Le notable","noble"]]},

 shining:{g:"horreur",t:["L'hiver dans {lieuIsoleC}","Ce qui hante les lieux","Tout le monde reste"],
  pitch:"Les coureurs passent l'hiver dans {lieuIsole}, coupés du monde, pour garder les lieux. Mais les lieux sont hantés, et les esprits ont choisi {chefD} : jour après jour, {ilchef} devient leur instrument, et veut que tout le monde reste pour toujours.",
  a1:"{ChefD} accueille les coureurs dans {lieuIsoleC} : un hiver de garde, bien payé, sans voir personne. {TemoinD}, qui vit sur place, a un don : {iltemoin} voit des choses que les autres ne voient pas.\nPaie : {rec}.",
  a2:"Les jours passent, et {chefN} change. Les esprits murmurent.",
  prep:[
   {t:"L'histoire des lieux",voir:"Dans {savoir}, de vieux récits racontent qu'un gardien a déjà tué les siens ici, il y a longtemps.",qui:"{TemoinN} voit le fantôme de ce gardien, et sait ce qu'il veut.",gagne:"ce que veulent les esprits : que quelqu'un tue tous les autres, pour qu'ils restent à jamais.",rate:"les coureurs ignorent tout du danger."},
   {t:"La chambre interdite",voir:"Une chambre fermée : derrière la porte, quelque chose frappe.",qui:"Un fantôme élégant offre à boire aux coureurs, et cherche à les convaincre de rester.",gagne:"le point faible des esprits : ils n'ont aucune prise au-delà de l'enceinte.",rate:"un coureur est hanté : il fait des cauchemars et perd quelques points d'esprit."},
   {t:"La sortie",voir:"{Issue} et {appel} sont sabotés.",qui:"{ChefN} jure n'y être pour rien.",gagne:"{issue} réparé en secret : une sortie possible.",rate:"il faudra sortir à pied, dans la neige."}],
  a3:"{ChefN} bascule : une arme à la main, en riant, {ilchef} traque les coureurs dans les couloirs. Les esprits ouvrent les portes devant {luichef}.",r3:false,
  a4:"{ChefN} a coupé toutes les issues sauf une. Les esprits se réunissent dans {lieuPublic} pour une fête qui n'en finit pas.",
  si:["S'ils savent ce que veulent les esprits : ils peuvent parler à {chefN} et le faire douter.","S'ils connaissent le point faible des esprits : il suffit de sortir de l'enceinte pour être en sécurité.","S'ils ont réparé {issue} : ils peuvent fuir en 2 tours."],
  opts:["Fuir par {issue}.","Affronter {chefN} et {lechef} maîtriser.","Mettre le feu aux lieux pour libérer les esprits."],
  r4:{seul:true,k:"perso",role:"chef",b:["veteran","lieutenant"],diff:"rude",suffixe:" (sous l'emprise des esprits)"},
  sec:["{ChefN} a toujours été le gardien des lieux : {ilchef} est là depuis cent ans.","{TemoinN} pourrait retenir les esprits, au prix de sa vie."],
  fiches:[["Le gardien possédé","chef"],["Celui qui voit","temoin"]]},

 dracula:{g:"horreur",t:["Le comte","Le sang des innocents","Les trois cercueils"],
  persos:{comte:"un aristocrate venu de loin"},
  pitch:"{ComteD} s'est installé à {ville}. Depuis, des jeunes gens dépérissent, pâles et rêveurs. {ComteN} est un seigneur ancien qui se nourrit de sang, et qui a préparé plusieurs refuges où dormir le jour. Il faut les trouver avant qu'il ne fasse de {heritierD} sa prochaine victime.",
  a1:"{MedecinD} appelle les coureurs : {heritierN} dépérit chaque nuit un peu plus, et porte deux petites marques au cou. Personne ne veut croire à une histoire de vampire. {ComteN}, nouveau voisin, se montre charmant et ne sort jamais avant le crépuscule.\nPaie : {rec}.",
  a2:"Le jour, {comteN} dort. La nuit, il chasse. Chaque refuge détruit l'affaiblit.",
  prep:[
   {t:"Le savoir ancien",voir:"Dans {savoir}, de vieux récits racontent la légende d'un seigneur buveur de sang.",qui:"{AncienD} connaît les remèdes : ail, eau bénite, pieu, lumière du soleil.",gagne:"ce qui blesse le vampire : la lumière du soleil, le feu, un pieu en plein cœur.",rate:"les coureurs l'affronteront sans savoir le blesser."},
   {t:"Les refuges",voir:"Les livraisons de {comteN} : des caisses de terre, envoyées vers plusieurs refuges.",qui:"{MarchandD}, qui a livré les caisses, a noté les adresses.",gagne:"tous les refuges détruits sauf un : le vampire ne peut plus fuir.",rate:"un refuge reste inconnu : le vampire pourra s'y réfugier.",renc:{k:"mortVivant",diff:"facile",nom:"Serviteurs du vampire"}},
   {t:"La fiancée",voir:"Chaque nuit, {heritierN} est appelé{heritierE} par une voix, et sort dans la nuit.",qui:"{HeritierN}, sous l'emprise {dcomteN}.",gagne:"la protection {dheritierN} : la victime ne lui obéit plus.",rate:"{comteN} enlève {heritierN} et l'emmène dans son dernier refuge."}],
  a3:"{ComteN} sait qu'on le traque. Il frappe : un allié mordu, des serviteurs lâchés sur les coureurs.",r3:{k:"mortVivant",diff:"equilibre",nom:"Serviteurs du vampire"},
  a4:"Dans son dernier refuge, au crépuscule, {comteN} se réveille. {HeritierN} est à ses côtés.",
  si:["S'ils savent ce qui le blesse : un pieu ou le feu le tuent, et le soleil le brûle.","S'ils ont détruit les autres refuges : il ne peut pas fuir sous forme de brume.","Si {heritierN} est protégé{heritierE} : la victime ne se retourne pas contre eux."],
  opts:["Le frapper au cœur avant qu'il ne se réveille complètement.","L'attirer à la lumière du jour.","Mettre le feu au refuge."],
  r4:{k:"perso",role:"comte",b:["vampire","rakshasa","lieutenant"],troupe:"mortVivant",diff:"rude"},
  sec:["{ComteN} et {ancienN} se connaissent depuis des siècles.","Le comte a déjà mordu l'un des coureurs, qui ne le sait pas encore."],
  fiches:[["Le vampire","comte"],["La victime","heritier"],["Le savant","ancien"],["Le médecin","medecin"]]},

 mouche:{g:"horreur",t:["La métamorphose","L'expérience","Ce qu'il reste d'humain"],
  rdef:{_:"une expérience de transformation"},
  pitch:"{SavantD} a réussi l'impossible grâce à {ressort}. Mais quelque chose s'est mêlé au processus. Jour après jour, {savantN} gagne en force, perd son humanité, et cherche une solution désespérée : fusionner avec quelqu'un pour redevenir « entier ».",
  a1:"{AllieD}, proche {dsavantN}, appelle les coureurs : {savantN} ne dort plus, mange du sucre à pleines mains, et sa peau change. Les bêtes qu'il gardait ont disparu.\nPaie : {rec}.",
  a2:"La transformation s'accélère. Il faut comprendre, avant qu'il ne soit trop tard.",
  prep:[
   {t:"Les notes",voir:"Dans le repaire {dsavantN}, des notes et des croquis de plus en plus fous.",qui:"{SavantN} lui-même, encore lucide par moments.",gagne:"comprendre l'expérience : il veut fusionner avec {allieN}.",rate:"les notes sont illisibles."},
   {t:"La source",voir:"Au cœur de son repaire, ce qui l'a transformé : {ressort}.",qui:"{MedecinD} pense pouvoir s'en servir pour inverser le processus, avec du temps.",gagne:"un moyen de détruire ou de saboter ce qui l'a transformé.",rate:"la source de la transformation reste intacte."},
   {t:"Les victimes",voir:"Dans {basFonds}, on retrouve des animaux, puis des gens, attaqués.",qui:"{CapitaineD} enquête sur une bête.",gagne:"{capitaineN} prête main-forte au climax.",rate:"{capitaineN} accuse les coureurs.",renc:{k:"humains",diff:"facile",siRate:1}}],
  a3:"{SavantN} a perdu presque toute son humanité. Il enlève {allieN}.",r3:false,
  a4:"Dans son repaire, {savantN} veut fusionner avec {allieN}. Il lui reste 3 tours.",
  si:["S'ils savent ce qu'il veut : ils savent où il va, et arrivent avant le début.","S'ils ont saboté la source : la fusion échoue.","Si {capitaineN} est là : il sort {allieN} pendant le combat."],
  opts:["Détruire la source de la transformation.","Parler à ce qu'il reste d'humain en lui.","Arracher {allieN} à temps."],
  r4:{seul:true,k:"perso",role:"savant",b:["ogre","manticore","troll"],diff:"rude",suffixe:" (transformé)"},
  sec:["{SavantN} a déjà essayé sur quelqu'un d'autre.","{AllieN} a déjà été en contact avec l'expérience : la transformation a commencé chez {luiallie} aussi."],
  fiches:[["Le savant transformé","savant"],["L'allié","allie"],["Le médecin","medecin"],["L'officier","capitaine"]]}
});

/* ============ Exploration ============ */
Object.assign(OEUVRES_H,{
 indiana:{g:"exploration",t:["Les aventuriers {druines}","La course à la relique","Ne regardez pas"],
  persos:{rival:{_:"un pilleur de tombes sans scrupules",prehistoire:"un chasseur de reliques sans scrupules"}},
  pitch:"{SavantD} engage les coureurs pour retrouver {relique}, au fond {druines}. {RivalD} est sur la même piste, avec les hommes {darmee} pour le protéger, et il compte bien laisser les coureurs faire le travail dangereux avant de tout leur prendre.",
  a1:"{SavantN} montre aux coureurs un très vieux récit : {relique} repose dans {ruines}, et seul un médaillon indique l'emplacement exact. {RivalN} vient de faire une offre pour ce médaillon.\nPaie : {rec}.",
  a2:"Le rival a des hommes, de l'argent et une longueur d'avance.",
  prep:[
   {t:"Le médaillon",voir:"Dans {basFonds}, le médaillon est entre les mains {dmarchandN}, qui le vend au plus offrant.",qui:"{MarchandN} fait monter les enchères ; les hommes {drivalN} attendent dehors.",gagne:"le médaillon : on sait où creuser.",rate:"les hommes {drivalN} s'en emparent ; ils creuseront au bon endroit avant les coureurs.",renc:{k:"humains",diff:"facile",siRate:1}},
   {t:"Le guide",voir:"À {village}, au pied des montagnes, {allieD} est le seul à connaître la route.",qui:"{AllieN} ne partira qu'à ses conditions, et en sait plus qu'{ilallie} ne le dit sur les pièges.",gagne:"un guide qui connaît les pièges des lieux.",rate:"les coureurs partent seuls ; le premier piège leur coûtera cher."},
   {t:"Le camp du rival",voir:"Près {druines}, le camp {drivalN} : tentes, porteurs, et de quoi tout incendier.",qui:"{CapitaineD}, au service du rival, n'aime pas ses méthodes.",gagne:"le plan du rival, et un allié dans son camp.",rate:"les coureurs sont repérés, et le rival double la garde."}],
  a3:"Dans {ruines}, les coureurs atteignent la salle de la relique… et le rival leur tombe dessus. Il les enferme avec les serpents, les pièges, ou les morts, et emporte {relique}.",r3:{k:"humains",diff:"equilibre"},
  a4:"Le rival ouvre {relique} devant ses hommes, persuadé d'en tirer un pouvoir immense. Quelque chose s'en échappe : ceux qui regardent meurent. Les coureurs sont ligotés ou cachés tout près.",
  si:["S'ils ont le médaillon : le rival a creusé au mauvais endroit, et la vraie relique est entre les mains des coureurs.","Si le guide est avec eux : {ilallie} sait qu'il ne faut pas regarder, et le leur dit à temps.","Si {capitaineN} les aide : {ilcapitaine} les détache au moment où tout bascule."],
  opts:["Fermer les yeux et attendre que la colère de la relique passe.","Reprendre {relique} avant que le rival ne l'ouvre.","Fuir les ruines pendant que les hommes du rival paniquent."],
  r4:{k:"perso",role:"rival",b:["veteran","lieutenant"],troupe:"humains",diff:"rude"},
  sec:["{SavantN} voulait la relique pour lui seul, et compte la vendre au plus offrant.","{Relique} ne tue que ceux qui la convoitent : ceux qui ne la désirent pas sont épargnés."],
  fiches:[["Le rival","rival"],["Le commanditaire","savant"],["Le guide","allie"],["L'homme du rival","capitaine"]]},

 centre:{g:"exploration",t:["Voyage au centre du monde","La descente","Le monde d'en bas"],
  pitch:"{SavantD} a retrouvé un vieux message : au fond {druines}, une faille descend jusqu'à un monde oublié. Les coureurs l'accompagnent dans la descente. En bas, sous une lumière étrange, survivent des bêtes et des peuples disparus, et la montagne gronde au-dessus de leurs têtes.",
  a1:"{SavantN}, excentrique et passionné, engage les coureurs pour une expédition que tout le monde juge folle. {AllieD} sera le guide. Le message ancien s'achève par un avertissement : « Ne remontez pas par où vous êtes descendus. »\nPaie : {rec}.",
  a2:"Plus on descend, plus il fait chaud, et plus le retour devient incertain.",
  prep:[
   {t:"La mer souterraine",voir:"Une mer immense, sous un ciel de pierre. Il faut la traverser.",qui:"{AllieN} construit un radeau ; quelque chose de gigantesque nage dessous.",gagne:"un radeau solide, pour fuir par la mer au climax.",rate:"le radeau chavire ; les coureurs perdent une partie de leur matériel."},
   {t:"Le peuple d'en bas",voir:"Des êtres qui n'ont jamais vu le soleil vivent dans des grottes lumineuses.",qui:"Leur chef se méfie des étrangers, mais connaît le chemin de la remontée.",gagne:"le chemin vers la cheminée qui remonte à la surface.",rate:"le peuple d'en bas chasse les coureurs, qui doivent chercher seuls.",renc:{k:"humains",diff:"facile",siRate:1}},
   {t:"Les bêtes",voir:"Une plaine où paissent des bêtes géantes, et où chassent des prédateurs.",qui:"{SavantN} veut tout étudier, au mépris du danger.",gagne:"savoir comment éviter les grands prédateurs : ils chassent à l'odeur, pas à la vue.",rate:"une meute flaire le groupe.",renc:{k:"meute",diff:"facile",siRate:1}}],
  a3:"La montagne gronde : le volcan se réveille. Les passages s'effondrent derrière les coureurs, et {geantL} se dresse sur leur route.",r3:{k:"geant",diff:"rude"},r3txt:"À éviter plutôt qu'à combattre.",
  a4:"La seule issue : la cheminée du volcan, au moment où il entre en éruption. Il faut monter, vite, avant que la lave ne rattrape tout le monde.",
  si:["S'ils ont un radeau : ils peuvent fuir par la mer jusqu'au pied de la cheminée, sans croiser les bêtes.","S'ils connaissent le chemin : ils trouvent la cheminée du premier coup.","S'ils savent comment chassent les prédateurs : ils masquent leur odeur et passent sans combat."],
  opts:["Monter dans la cheminée sur le radeau, porté par l'éruption (arts du mouvement, jets groupés).","Retenir les bêtes pendant que les autres préparent la remontée (3 tours).","Laisser {savantN} derrière, s'il refuse d'abandonner ses découvertes."],
  r4:{k:"meute",diff:"rude"},
  sec:["{SavantN} n'est pas le premier à descendre : son propre père n'est jamais remonté, et vit toujours en bas.","Le peuple d'en bas veut que la faille reste secrète : il a provoqué l'éruption."],
  fiches:[["Les prédateurs","meute"],["La grande bête","geant"],["Le savant","savant"],["Le guide","allie"]]},

 pirates:{g:"exploration",t:["Le trésor maudit","L'équipage des damnés","Au clair de lune"],
  persos:{maudit:"un capitaine maudit"},
  pitch:"{MauditD} et son équipage ont volé {tresor}, sans savoir qu'il était maudit : ils ne peuvent ni mourir ni vivre, et au clair de lune, on voit leurs os. Pour lever la malédiction, il leur faut la dernière pièce du trésor, et le sang de celle ou celui qui la porte : {heritierD}.",
  a1:"Une nuit de brume, des silhouettes attaquent {ville} et enlèvent {heritierD}. {AllieD}, qui connaît la légende du trésor maudit, propose aux coureurs de les poursuivre.\nPaie : {rec}.",
  a2:"Il faut rejoindre l'île du trésor avant la prochaine pleine lune.",
  prep:[
   {t:"La légende",voir:"Dans {basFonds}, un vieux conteur raconte la malédiction.",qui:"{AncienD} sait comment la lever : rendre chaque pièce, et un peu du sang de son porteur.",gagne:"la façon de lever la malédiction, et de rendre les damnés mortels.",rate:"les coureurs ignorent comment vaincre des ennemis qui ne meurent pas."},
   {t:"Le navire",voir:"À {port}, il faut un navire rapide, ou un moyen d'atteindre l'île.",qui:"{AllieN} connaît un passage secret à travers les récifs.",gagne:"un passage secret : les coureurs arrivent par surprise.",rate:"il faut aborder par la grande baie, sous les yeux des damnés."},
   {t:"Les damnés",voir:"Les damnés attaquent en mer, ou sur la grève.",qui:"Un damné repenti veut lui aussi lever la malédiction.",gagne:"un allié parmi les damnés, qui sait où ils cachent le trésor.",rate:"les damnés gagnent du terrain.",renc:{k:"mortVivant",diff:"facile",nom:"Damnés"}}],
  a3:"Les damnés retrouvent les coureurs : au clair de lune, ils ne craignent plus rien. {HeritierN} va être sacrifié{heritierE}.",r3:{k:"mortVivant",diff:"equilibre",nom:"Damnés"},
  a4:"Dans la grotte du trésor, au clair de lune, {mauditN} s'apprête à verser le sang {dheritierN} sur la dernière pièce. Ses hommes, mi-chair mi-squelette, l'entourent.",
  si:["S'ils savent comment lever la malédiction : rendre la dernière pièce rend les damnés mortels, et vulnérables.","S'ils ont pris le passage secret : ils arrivent avant que la cérémonie ne commence.","Si le damné repenti est avec eux : il retient une partie de l'équipage."],
  opts:["Rendre la dernière pièce au bon moment.","Libérer {heritierN} et fuir.","Affronter {mauditN} quand il est vulnérable."],
  r4:{k:"perso",role:"maudit",b:["veteran","chevalier","lieutenant"],troupe:"mortVivant",diff:"rude"},
  sec:["{HeritierN} n'était pas la victime : c'est {luiheritier} qui a volé la dernière pièce, et {ilheritier} le savait.","{AllieN} est maudit{allieE}, lui aussi : c'est son ancien équipage."],
  fiches:[["Le capitaine maudit","maudit"],["L'otage","heritier"],["L'allié","allie"],["Celui qui sait","ancien"]]},

 mondeperdu:{g:"exploration",t:["Le monde perdu","Le plateau","Les bêtes d'avant"],
  pitch:"{SavantD} affirme qu'au-delà de {lieuSauvage}, sur un plateau inaccessible, survivent des bêtes disparues. Personne ne le croit. Il engage les coureurs pour en ramener la preuve. Avec eux part {chasseurD}, qui compte bien ramener une bête vivante, quoi qu'il en coûte.",
  a1:"{SavantN}, ridiculisé par ses pairs, monte une expédition. {ChasseurN} paie une partie des frais et ne quitte jamais son arme de chasse.\nPaie : {rec}.",
  a2:"Sur le plateau, le temps s'est arrêté. Le seul chemin du retour s'effondre derrière l'expédition.",
  prep:[
   {t:"Le campement",voir:"Au bord du plateau, il faut un camp solide.",qui:"{AllieD}, porteur, connaît les bêtes.",gagne:"un camp où les bêtes n'osent pas venir.",rate:"les bêtes attaquent la nuit.",renc:{k:"meute",diff:"facile",siRate:1}},
   {t:"Le peuple caché",voir:"Un peuple vit en haut, en guerre contre des êtres brutaux.",qui:"Leur chef accueille les coureurs s'ils l'aident.",gagne:"des alliés, et un autre chemin pour redescendre.",rate:"les coureurs sont pris entre les deux camps."},
   {t:"La preuve",voir:"Un nid de bêtes géantes, avec des œufs.",qui:"{ChasseurN} veut un œuf ou un petit, et propose de partager la gloire.",gagne:"une preuve sans danger : un dessin, une plume, une dent.",rate:"{chasseurN} vole un petit, et la mère le cherche."}],
  a3:"{ChasseurN} a capturé une jeune bête. Sa mère, furieuse, retrouve l'expédition et ravage le camp.",r3:{k:"geant",diff:"rude"},r3txt:"À éviter plutôt qu'à combattre.",
  a4:"Il faut redescendre du plateau, alors que la mère poursuit l'expédition et que {chasseurN} refuse de lâcher sa prise.",
  si:["S'ils ont un camp solide : ils ont assez de vivres et de cordes pour descendre.","S'ils ont des alliés : le peuple caché leur montre un autre chemin et retient les bêtes.","S'ils n'ont pas volé de petit : la mère ne les poursuit pas, seulement {chasseurN}."],
  opts:["Rendre le petit à sa mère.","Descendre la falaise sous les assauts (arts du mouvement).","Abandonner {chasseurN} à son sort."],
  r4:{k:"geant",diff:"rude"},
  sec:["{SavantN} a menti : il a déjà été sur le plateau, et y a laissé quelqu'un.","Les êtres brutaux sont des humains d'un autre âge, et pas des monstres."],
  fiches:[["La mère","geant"],["Le chasseur","chasseur"],["Le savant","savant"],["Le porteur","allie"]]},

 tombraider:{g:"exploration",t:["Le tombeau","Les pièges anciens","La salle du trésor"],
  persos:{rival:{_:"un pilleur de tombes rival",prehistoire:"un chasseur de reliques rival"}},
  pitch:"Au fond {druines} repose {relique}, gardée par des pièges en série. {RivalD} vient de trouver l'entrée, avec des hommes armés. Les coureurs doivent passer les pièges plus vite que lui.",
  a1:"{MarchandD} sait que {rivalN} est parti pour {ruines} et paie les coureurs pour arriver avant lui.\nPaie : {rec}.",
  a2:"Chaque salle est un parcours d'obstacles.",
  prep:[
   {t:"La salle des énigmes",voir:"Une salle couverte de symboles, et une porte sans serrure.",qui:"{AncienD}, qui étudie ces symboles depuis des années, attend dehors.",gagne:"l'énigme résolue : un passage plus court vers la salle du trésor.",rate:"le passage reste fermé ; il faut le chemin long, plein de pièges."},
   {t:"Les pièges",voir:"Des dalles qui s'effondrent, des lames qui jaillissent, des murs qui se referment.",qui:"Les restes d'un ancien pilleur, et son carnet.",gagne:"le carnet : les pièges de la dernière salle sont connus.",rate:"un coureur est blessé (1d8 dégâts)."},
   {t:"Le rival",voir:"Les hommes {drivalN} dynamitent les murs.",qui:"{CapitaineD}, son second, est prêt{capitaineE} à le trahir.",gagne:"un allié dans le camp du rival.",rate:"les coureurs sont repérés.",renc:{k:"humains",diff:"facile"}}],
  a3:"La salle du trésor : {rivalN} y est déjà, et il a pris {relique}. Le tombeau se met à trembler.",r3:{k:"humains",diff:"equilibre"},
  a4:"Le tombeau s'effondre. {RivalN} fuit avec {relique}, et ses hommes couvrent sa retraite.",
  si:["S'ils ont résolu l'énigme : ils prennent le passage court et coupent la route du rival.","S'ils ont le carnet : ils évitent le dernier piège, où le rival tombe.","Si le second du rival est avec eux : {ilcapitaine} retourne une partie des hommes."],
  opts:["Rattraper le rival et lui arracher {relique}.","Fuir le tombeau qui s'effondre (arts du mouvement).","Laisser le rival déclencher le dernier piège."],
  r4:{k:"perso",role:"rival",b:["veteran","lieutenant"],troupe:"humains",diff:"rude"},
  sec:["{Relique} est une fausse : la vraie est encore cachée plus bas.","{MarchandN} travaille aussi pour le rival."],
  fiches:[["Le rival","rival"],["Le commanditaire","marchand"],["Le savant","ancien"],["Le second","capitaine"]]},

 licorne:{g:"exploration",t:["Le secret de l'ancêtre","Les trois messages","Le navire perdu"],
  persos:{freres:"un collectionneur aux mains sales"},
  pitch:"{AllieD} a hérité d'un objet ancien ayant appartenu à un ancêtre aventurier. À l'intérieur, un message : l'ancêtre a caché {tresor}, et deux autres messages complètent le premier. {FreresD} les veut tous, et il a déjà fait tuer pour l'un d'eux.",
  a1:"{AllieN} montre aux coureurs le message trouvé dans l'objet. La nuit même, sa maison est cambriolée. {FreresN} propose d'acheter l'objet, très poliment.\nPaie : une part du trésor.",
  a2:"Trois messages, et une course contre {freresN}.",
  prep:[
   {t:"Le deuxième message",voir:"Un objet identique est vendu à {marche}.",qui:"Un vieux marchand, qui l'a déjà promis à {freresN}.",gagne:"le deuxième message.",rate:"{freresN} l'achète avant eux."},
   {t:"Le troisième message",voir:"Le troisième objet appartient à un collectionneur assassiné ; il est chez {capitaineN}, qui enquête.",qui:"{CapitaineD}, honnête mais méfiant{capitaineE}.",gagne:"le troisième message, et le soutien {dcapitaineN}.",rate:"{capitaineN} soupçonne les coureurs."},
   {t:"Les hommes de main",voir:"Les hommes {dfreresN} suivent les coureurs.",qui:"Un homme de main, peu fidèle.",gagne:"l'endroit où {freresN} cache ce qu'il a volé.",rate:"les hommes de main attaquent.",renc:{k:"humains",diff:"facile"}}],
  a3:"{FreresN} enlève {allieN}, et exige les messages en échange.",r3:{k:"humains",diff:"equilibre"},
  a4:"Au lieu indiqué par les messages, {freresN} et ses hommes fouillent. {AllieN} est avec eux.",
  si:["S'ils ont le deuxième message : ils savent que le trésor est ailleurs.","Si {capitaineN} les soutient : {ilcapitaine} arrive avec ses hommes au troisième tour.","S'ils savent où {freresN} cache son butin : ils ont un moyen de pression."],
  opts:["Libérer {allieN} et trouver le trésor les premiers.","Faire arrêter {freresN}.","L'affronter."],
  r4:{k:"perso",role:"freres",b:["veteran","lieutenant"],troupe:"humains",diff:"rude"},
  sec:["Le trésor est sous les pieds {dallieN}, dans sa propre maison.","{FreresN} est un lointain cousin {dallieN}, et réclame sa part d'héritage."],
  fiches:[["Le collectionneur","freres"],["L'héritier","allie"],["L'enquêteur","capitaine"]]},

 planete:{g:"exploration",t:["Le monde à l'envers","Le procès","La vérité sous le sable"],
  persos:{maitre:"le chef d'un peuple qui se croit le seul civilisé",savante:"une savante curieuse"},
  pitch:"Les coureurs se retrouvent dans une contrée où tout est à l'envers : un autre peuple règne, et pour lui, les gens comme les coureurs sont des bêtes à capturer. {MaitreD} veut les étudier, puis les faire disparaître. Mais au fond de la zone interdite se cache une vérité qui renverserait tout.",
  a1:"Après un naufrage, ou un voyage qui a mal tourné, les coureurs sont capturés par des chasseurs étranges. On les enferme dans des cages. {SavanteD} s'étonne : ces « bêtes » parlent.\nEnjeu : leur liberté.",
  a2:"Personne n'est censé savoir ce qu'il y a dans la zone interdite.",
  prep:[
   {t:"La savante",voir:"Dans son cabinet d'étude, {savanteN} examine les coureurs.",qui:"{SavanteN} veut les aider, mais risque sa place.",gagne:"une alliée qui les fera évader au bon moment.",rate:"{savanteN} est arrêtée, et les coureurs perdent leur seule alliée."},
   {t:"Le procès",voir:"À {palais}, un procès public : les coureurs sont-ils des bêtes, ou des êtres pensants ?",qui:"{MaitreN} préside, et a déjà décidé.",gagne:"le doute dans l'esprit du peuple : une partie de la foule les soutient.",rate:"les coureurs sont condamnés."},
   {t:"La zone interdite",voir:"Les vieux textes parlent d'une zone interdite.",qui:"{AncienD}, qui a des doutes, montre le chemin.",gagne:"le chemin vers la zone interdite.",rate:"les coureurs devront la trouver seuls."}],
  a3:"Les coureurs s'évadent, poursuivis par les chasseurs de {maitreN}.",r3:{k:"humains",diff:"equilibre"},
  a4:"Dans la zone interdite, les coureurs découvrent la vérité : des ruines de leur propre peuple, qui régnait ici autrefois. {MaitreN} les rattrape, et veut que ce secret meure avec eux.",
  si:["Si la savante les aide : elle retient les chasseurs.","Si la foule doute : {maitreN} hésite à les tuer devant témoins.","S'ils connaissent le chemin : ils arrivent avant les chasseurs."],
  opts:["Révéler la vérité aux chasseurs.","Fuir plus loin.","Affronter {maitreN}."],
  r4:{k:"perso",role:"maitre",b:["veteran","lieutenant"],troupe:"humains",diff:"rude"},
  sec:["{MaitreN} connaît la vérité depuis toujours.","Les coureurs ne sont pas là par hasard : quelqu'un les a envoyés pour découvrir la vérité."],
  fiches:[["Le maître","maitre"],["La savante","savante"],["Le sage","ancien"]]},

 fallout:{g:"exploration",t:["L'abri","La pièce manquante","Dehors"],
  rdef:{_:"l'abri qui rouvre après la catastrophe"},
  pitch:"Dans {ressort}, la pièce qui fait marcher le purificateur d'eau est tombée en panne. Il en faut une neuve, et la seule se trouve dehors, quelque part dans {lieuSauvage}. Les coureurs sont envoyés la chercher, au milieu de factions et de ruines. {ChefGangD}, qui règne sur la région, veut l'abri pour lui.",
  a1:"{ChefD} confie aux coureurs une mission vitale : trouver une pièce de rechange avant que l'eau ne manque. Ils ont 150 jours, ou beaucoup moins.\nPaie : la survie de l'abri.",
  a2:"Dehors, tout se paie, et chacun veut quelque chose.",
  prep:[
   {t:"Le marché",voir:"À {marche}, on vend de tout, même des pièces d'avant.",qui:"{MarchandD} sait où trouver la pièce, et la vend cher.",gagne:"l'endroit exact où trouver la pièce.",rate:"les coureurs paient trop cher, ou se font voler."},
   {t:"La faction",voir:"{Patron} garde les vieilles technologies.",qui:"Un de ses membres, {allieD}, peut aider.",gagne:"des alliés armés pour le climax.",rate:"la faction exige un service qui fait perdre du temps."},
   {t:"Les pillards",voir:"Les hommes {dchefGangN} contrôlent les routes.",qui:"Un pillard capturé parle de ce que veut son chef.",gagne:"le plan {dchefGangN} : il veut suivre les coureurs jusqu'à l'abri.",rate:"les pillards suivent les coureurs.",renc:{k:"humains",diff:"facile"}}],
  a3:"La pièce est dans {ruines}, gardée par des créatures. Les hommes {dchefGangN} attendent dehors.",r3:{k:"mortVivant",diff:"equilibre"},
  a4:"La pièce en main, les coureurs rentrent… mais {chefGangN} les a suivis. Ses hommes forcent la porte de l'abri, et lui veut tout : l'eau, les vivres, les gens.",
  si:["S'ils connaissaient l'endroit exact : ils ont la pièce sans avoir perdu de temps.","Si la faction est avec eux : ses guerriers défendent l'abri.","S'ils connaissent le plan : ils ont tendu un piège aux pillards."],
  opts:["Tenir la porte de l'abri pendant qu'on installe la pièce (3 tours).","Affronter {chefGangN} : sans chef, ses hommes se dispersent.","Négocier : partager l'eau contre la paix."],
  r4:{k:"perso",role:"chefGang",b:["veteran","lieutenant","seigneur"],troupe:"humains",diff:"rude"},
  sec:["{ChefN} savait que la pièce était en panne depuis des mois.","L'abri n'était pas fait pour protéger : c'était une expérience."],
  fiches:[["Le seigneur","chefGang"],["Le chef de l'abri","chef"],["Le marchand","marchand"],["L'allié","allie"]]},

 jumanji:{g:"exploration",t:["Le jeu","Les dés sont jetés","Finir la partie"],
  rdef:{_:"un vieux jeu de plateau"},
  pitch:"{AllieD} a trouvé {ressort} dans une cache oubliée et lancé les dés « pour voir ». Depuis, chaque lancer déchaîne une épreuve : une meute, une crue, une plante géante. On ne peut pas arrêter la partie, seulement la finir. Et le jeu a lâché un chasseur sur les joueurs.",
  a1:"{AllieN} appelle les coureurs : des bêtes sauvages courent dans {ville}, et c'est à cause du jeu. Pour tout effacer, il faut finir la partie, ensemble.\nPaie : {rec}.",
  a2:"Chaque tour de jeu déclenche une épreuve. Les coureurs jouent à tour de rôle.",
  prep:[
   {t:"Le premier lancer",voir:"Le jeu annonce une énigme, et une meute surgit.",qui:"{AllieN}, terrorisé{allieE}.",gagne:"comprendre les règles : chaque énigme annonce ce qui va arriver.",rate:"la meute ravage tout.",renc:{k:"meute",diff:"facile"}},
   {t:"Le joueur perdu",voir:"Un joueur d'une ancienne partie est resté coincé dans le jeu pendant des années.",qui:"{AncienD}, ancien joueur, connaît le jeu.",gagne:"un allié qui connaît les pièges.",rate:"l'ancien joueur refuse d'y retourner."},
   {t:"Le chasseur",voir:"Le chasseur du jeu traque les joueurs.",qui:"{ChasseurD}, sorti du jeu, ne vit que pour la chasse.",gagne:"un moyen de le tenir à distance.",rate:"le chasseur blesse un coureur."}],
  a3:"Une crue, puis un tremblement : la maison s'effondre, et le chasseur rattrape les coureurs.",r3:{k:"perso",role:"chasseur",b:["veteran","lieutenant"],diff:"equilibre"},
  a4:"Dernière case. Tout ce que le jeu a libéré converge vers les joueurs. Il faut finir la partie.",
  si:["S'ils comprennent les règles : ils devinent les épreuves avant qu'elles ne frappent.","Si l'ancien joueur est là : il retient une épreuve.","S'ils peuvent tenir le chasseur à distance : il ne gêne pas le dernier lancer."],
  opts:["Lancer les dés et finir la partie.","Protéger le lanceur.","Tricher."],
  r4:{k:"perso",role:"chasseur",b:["veteran","lieutenant"],troupe:"meute",diff:"rude"},
  sec:["Le chasseur est l'ancien joueur, transformé par le jeu.","Le jeu cherche toujours de nouveaux joueurs : il réapparaîtra ailleurs."],
  fiches:[["Le chasseur","chasseur"],["L'allié","allie"],["L'ancien joueur","ancien"]]}
});

 oceans:{g:"casse",t:["Le coup du siècle","Onze contre un","Le plan à double fond"],

 mission:{g:"casse",t:["Mission impossible","La taupe","Cette mission, si vous l'acceptez"],

   {t:"La taupe",voir:"Des messages chiffrés partent de l'équipe vers l'ennemi.",qui:"{ChefEquipeN} soupçonne {espionN}, mais pas pour les bonnes raisons.",gagne:"le nom de la taupe : c'est {chefEquipeN} lui-même.",rate:"les coureurs soupçonnent la mauvaise personne."}],

 lupin:{g:"casse",t:["Le gentleman cambrioleur","Le vol annoncé","Sous le nez de la garde"],
