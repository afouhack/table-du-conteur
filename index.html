<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Outils du Conteur pour le jeu de rôle Coureurs d'Orages : aventures par thème, bestiaire adapté au groupe, suivi de combat et générateurs.">
<meta name="theme-color" content="#7a3e1b">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icone-192.png">
<link rel="apple-touch-icon" href="icone-192.png">
<title>Table du Conteur</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&family=Alegreya:ital,wght@0,400;0,600;1,400&family=Alegreya+Sans:ital,wght@0,400;1,400&family=Alegreya+Sans+SC:wght@500;700&family=MedievalSharp&family=Pirata+One&family=Rye&family=Oswald:wght@500&family=Special+Elite&family=Orbitron:wght@600&family=Exo+2:wght@600&family=Audiowide&family=Caveat+Brush&family=Cinzel:wght@600&family=Limelight&family=Stardos+Stencil:wght@700&family=Playfair+Display+SC:wght@700&display=swap">
<style>
/* Même famille visuelle que la Forge de Coureurs ; accent rouille pour distinguer l'outil du Conteur. */
:root{
  --bg:#ebe7e1; --surface:#f7f5f1; --ink:#1f1c18; --muted:#635b52; --line:#c8bfb3;
  --accent:#8a4b22; --accent-ink:#ffffff; --accent-soft:#f0dccb; --spark:#a8781e;
  --ok:#3d6b3a; --ko:#a3332a; --ok-soft:#dce8d6; --ko-soft:#f3d9d5;
  --f-display:"IM Fell English SC","Times New Roman",serif;
  --f-body:"Alegreya",Georgia,serif;
  --f-label:"Alegreya Sans SC","Trebuchet MS",sans-serif;
  --f-small:"Alegreya Sans","Trebuchet MS",sans-serif;
  --th-font:var(--f-display); --th-acc:var(--accent);
  --nav-h:0px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#15130f; --surface:#1e1b16; --ink:#ece6dc; --muted:#a59b8e; --line:#3a342c;
  --accent:#e0956a; --accent-ink:#1a120c; --accent-soft:#3b2619; --spark:#e2b455;
  --ok:#8cc483; --ko:#ee8a7f; --ok-soft:#1f3320; --ko-soft:#3d1d19; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#15130f; --surface:#1e1b16; --ink:#ece6dc; --muted:#a59b8e; --line:#3a342c;
  --accent:#e0956a; --accent-ink:#1a120c; --accent-soft:#3b2619; --spark:#e2b455;
  --ok:#8cc483; --ko:#ee8a7f; --ok-soft:#1f3320; --ko-soft:#3d1d19; color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:12px}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;
  padding:calc(18px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(40px + var(--nav-h) + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.tete{display:flex;flex-direction:column;gap:4px;align-items:flex-start}
.eyebrow{font-family:var(--f-label);letter-spacing:.08em;color:var(--muted);font-size:14px}
h1{font-family:var(--f-display);font-weight:400;font-size:clamp(32px,6vw,50px);line-height:1;margin:0}
h2{font-family:var(--f-display);font-weight:400;font-size:24px;margin:0;line-height:1.15;text-wrap:balance}
h3{font-family:var(--f-display);font-weight:400;font-size:19px;margin:0;line-height:1.2}
.bolt{display:block;width:min(420px,100%);height:14px;color:var(--spark)}
.resume{margin-top:6px;font-family:var(--f-small);letter-spacing:0;font-size:14px;padding:5px 12px;border-radius:999px;background:var(--surface);color:var(--muted)}
.resume b{color:var(--ink);font-weight:600}
p{margin:0}
.muted{color:var(--muted)}
.small{font-family:var(--f-small);font-size:14px}
button{font-family:var(--f-label);font-size:15px;letter-spacing:.05em;border-radius:4px;padding:9px 14px;cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--ink);line-height:1.15}
button:hover{border-color:var(--accent)}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
button.ghost{background:transparent}
button.mini{font-size:13px;padding:5px 9px}
button.danger{color:var(--ko)}
button:disabled{opacity:.45;cursor:default}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,[contenteditable]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
label{font-family:var(--f-label);font-size:13px;letter-spacing:.06em;color:var(--muted);display:flex;flex-direction:column;gap:3px}
select,input,textarea{font:inherit;font-family:var(--f-body);font-size:16px;letter-spacing:0;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:7px 9px;width:100%;min-width:0}
textarea{resize:vertical;min-height:90px;line-height:1.4}
input[type=checkbox]{width:auto}

/* Onglets : en haut sur grand écran, barre fixe en bas sur téléphone */
.onglets{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:4px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 6px);z-index:20}
.onglets button{flex:1;display:flex;align-items:center;justify-content:center;gap:7px;border:0;background:transparent;padding:9px 6px;border-radius:5px;color:var(--muted)}
.onglets svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.onglets button[aria-current="page"]{background:var(--accent);color:var(--accent-ink)}
.onglets .pastille{min-width:18px;height:18px;border-radius:9px;background:var(--spark);color:#fff;font-size:11px;display:inline-grid;place-items:center;padding:0 5px;font-family:var(--f-small);letter-spacing:0}
@media (max-width:760px){
  :root{--nav-h:62px}
  .onglets{position:fixed;left:0;right:0;bottom:0;top:auto;border-radius:0;border-width:1px 0 0;padding:4px max(4px,env(safe-area-inset-left,0px)) calc(4px + env(safe-area-inset-bottom,0px));gap:2px}
  .onglets button{flex-direction:column;gap:2px;font-size:11px;letter-spacing:.03em;padding:6px 2px}
  .onglets .pastille{position:absolute;margin:-4px 0 0 22px}
  .onglets button{position:relative}
}
.vue{display:none;flex-direction:column;gap:16px}
.vue.active{display:flex}

/* Blocs */
.bloc{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:14px 16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.bloc-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
.bloc-h small{font-family:var(--f-small);font-size:14px;color:var(--muted)}
.sub{font-family:var(--f-label);font-size:13px;letter-spacing:.06em;color:var(--muted);margin:0}
.rangee{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.rangee.fin{justify-content:flex-end}
.grille2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:14px;align-items:start}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:5px;overflow:hidden;flex-wrap:wrap}
.seg button{border:0;border-radius:0;border-right:1px solid var(--line);background:var(--bg);font-size:14px;padding:8px 12px}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:5px;overflow:hidden;background:var(--bg)}
.stepper button{border:0;border-radius:0;padding:8px 13px;font-size:18px;background:transparent}
.stepper output{min-width:2.2em;text-align:center;font-family:var(--f-display);font-size:22px;font-variant-numeric:tabular-nums}
.toggle{display:flex;align-items:center;gap:8px;flex-direction:row;font-family:var(--f-small);font-size:15px;letter-spacing:0;color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-family:var(--f-small);letter-spacing:0;font-size:13.5px;padding:3px 9px;border-radius:999px;background:var(--bg);border:1px solid var(--line);color:var(--ink)}
button.chip{cursor:pointer}
.chip.cap{border-color:var(--spark);color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

/* Thèmes */
.themes{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.theme{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;padding:10px 12px;font-family:var(--f-body);letter-spacing:0}
.theme b{font-weight:400;font-size:19px;line-height:1.1}
.theme span{font-family:var(--f-small);font-size:13px;color:var(--muted);line-height:1.25}
.theme[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.theme[aria-pressed="true"] span{color:var(--accent-ink);opacity:.85}

/* Aventure */
.av{gap:14px}
.av-titre{font-family:var(--th-font);color:var(--th-acc);font-size:clamp(26px,5vw,38px);line-height:1.05;margin:0}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .av-titre{color:color-mix(in srgb,var(--th-acc) 45%,#fff)}}
:root[data-theme="dark"] .av-titre{color:color-mix(in srgb,var(--th-acc) 45%,#fff)}
.scene{border-left:3px solid var(--line);padding:2px 0 2px 14px;display:flex;flex-direction:column;gap:6px}
.scene.cle{border-left-color:var(--spark)}
.scene-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.scene-h .sub b{color:var(--spark);font-family:var(--f-display);font-size:18px;letter-spacing:0;margin-right:6px;font-weight:400}
.txt{white-space:pre-line;border-radius:3px;padding:1px 3px;margin:-1px -3px}
.txt[contenteditable]:hover{background:var(--bg)}
.txt.edite::after{content:" ✎";color:var(--muted);font-size:13px}
.de{border:0;background:transparent;font-size:18px;padding:2px 6px;color:var(--muted);flex:none}
.de:hover{color:var(--accent)}
.renc{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--bg);border:1px dashed var(--line);border-radius:5px;padding:7px 10px}
.renc b{font-weight:600}
.niv{font-family:var(--f-label);font-size:12px;letter-spacing:.06em;padding:2px 8px;border-radius:999px;border:1px solid currentColor}
.niv.facile{color:var(--ok)} .niv.equilibre{color:var(--spark)} .niv.rude{color:var(--accent)} .niv.mortel{color:var(--ko)}
.table-renc{width:100%;border-collapse:collapse;font-size:15px}
.table-renc td{border-top:1px solid var(--line);padding:6px 6px;vertical-align:top}
.table-renc td:first-child{font-family:var(--f-display);font-size:18px;width:2.2em;text-align:center;color:var(--spark)}
.table-renc tr.tire td{background:var(--accent-soft)}
.table-renc td:last-child{width:1%;white-space:nowrap}
ol.cles{margin:0;padding-left:1.3em;display:flex;flex-direction:column;gap:4px}

/* Fiches de créature */
.cartes{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,290px),1fr));gap:10px}
.crea{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:11px 13px;display:flex;flex-direction:column;gap:7px}
.crea-h{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.crea-h h3{font-size:18px}
.crea .base{font-family:var(--f-small);font-size:12.5px;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:5px}
.stat{border:1px solid var(--line);border-radius:4px;padding:4px 4px 3px;display:flex;flex-direction:column;align-items:center;background:var(--bg);min-width:0}
.stat .k{font-family:var(--f-label);font-size:11px;letter-spacing:.05em;color:var(--muted);line-height:1.1}
.stat b{font-family:var(--f-display);font-weight:400;font-size:21px;line-height:1.15;font-variant-numeric:tabular-nums}
.crea .att{font-family:var(--f-small);font-size:14px}
.crea p.desc{font-style:italic;font-size:15px;color:var(--muted)}
details.capx{font-family:var(--f-small);font-size:14px}
details.capx summary{cursor:pointer;color:var(--muted)}
details.capx dl{margin:6px 0 0;display:grid;gap:4px}
details.capx dt{font-weight:600;color:var(--ink)}
details.capx dd{margin:0 0 4px}
.ajout{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.ajout .stepper output{font-size:18px;min-width:1.8em}
.ajout .stepper button{padding:4px 10px;font-size:16px}
.menace{font-family:var(--f-small);font-size:13px}

/* Combat */
.init{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center}
.init-res{font-family:var(--f-display);font-size:22px;line-height:1.15}
.init-res small{display:block;font-family:var(--f-small);font-size:14px;color:var(--muted)}
.init-res.pj{color:var(--ok)} .init-res.adv{color:var(--ko)}
.d6{width:58px;height:58px;border-radius:10px;border:2px solid currentColor;display:grid;place-items:center;font-family:var(--f-display);font-size:30px}
.groupes{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr));gap:12px;align-items:start}
.grp{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:12px 13px;display:flex;flex-direction:column;gap:9px}
.grp.vaincu{opacity:.55}
.grp-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.grp-h h3{font-size:19px}
.pvs{display:flex;flex-wrap:wrap;gap:5px}
.pv{min-width:46px;padding:5px 7px;border-radius:5px;border:1px solid var(--line);background:var(--bg);font-family:var(--f-display);font-size:18px;line-height:1;display:flex;flex-direction:column;align-items:center;gap:3px;letter-spacing:0}
.pv i{display:block;width:100%;height:4px;border-radius:2px;background:var(--line);overflow:hidden;position:relative}
.pv i::after{content:"";position:absolute;inset:0;width:var(--p,100%);background:var(--ok)}
.pv.bas i::after{background:var(--ko)}
.pv[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.pv.mort{text-decoration:line-through;color:var(--muted);opacity:.6}
.pv.mort i::after{width:0}
.coup{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:5px}
.coup button{padding:9px 4px;font-size:16px;font-family:var(--f-display);letter-spacing:0}
.coup input{grid-column:span 2;text-align:center;font-size:18px}
.coup .soin{color:var(--ok)}
.jets{display:flex;flex-wrap:wrap;gap:6px}
.res{font-family:var(--f-small);font-size:14.5px;min-height:1.3em;color:var(--muted)}
.res b{color:var(--ink);font-family:var(--f-display);font-size:19px;font-weight:400}
.journal{font-family:var(--f-small);font-size:14px;color:var(--muted);max-height:180px;overflow:auto;display:flex;flex-direction:column;gap:2px}
.banniere{background:var(--accent-soft);border:1px solid var(--accent);border-radius:6px;padding:9px 12px;font-family:var(--f-small);font-size:15px;display:flex;gap:10px;align-items:center;justify-content:space-between}

/* Générateurs */
.gen{display:flex;flex-direction:column;gap:8px}
.sortie{background:var(--bg);border:1px solid var(--line);border-radius:5px;padding:10px 12px;min-height:3em;display:flex;flex-direction:column;gap:4px}
.sortie:empty{display:none}
.sortie b{font-weight:600}
.des{display:flex;flex-wrap:wrap;gap:6px}
.des button{font-family:var(--f-display);letter-spacing:0;font-size:17px;padding:8px 12px}
.gros{font-family:var(--f-display);font-size:32px;line-height:1}
.aide dl{margin:0;display:grid;grid-template-columns:minmax(0,1fr);gap:2px}
.aide dt{font-family:var(--f-label);letter-spacing:.05em;font-size:14px;color:var(--accent);margin-top:8px}
.aide dd{margin:0;font-size:15.5px}
.pnj-liste{display:flex;flex-direction:column;gap:8px}
.pnj{border-top:1px solid var(--line);padding-top:8px;display:flex;justify-content:space-between;gap:8px}
.entree{border-top:1px solid var(--line);padding-top:8px;display:flex;flex-direction:column;gap:4px}
.entree time{font-family:var(--f-label);font-size:12.5px;letter-spacing:.06em;color:var(--muted)}
.vide{text-align:center;color:var(--muted);padding:26px 10px;display:flex;flex-direction:column;gap:12px;align-items:center}
.pied{font-family:var(--f-small);font-size:13px;color:var(--muted);text-align:center;max-width:70ch;margin:10px auto 0}
.toast{position:fixed;left:50%;bottom:calc(20px + var(--nav-h) + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);font-family:var(--f-small);font-size:15px;padding:9px 16px;border-radius:6px;opacity:0;pointer-events:none;transition:.2s;z-index:50;max-width:calc(100% - 32px);text-align:center}
.toast.on{opacity:1;transform:translateX(-50%)}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}

@media print{
  body{background:#fff;color:#000;padding:0}
  .onglets,.tete,.pied,.de,.no-print,.toast{display:none!important}
  .vue{display:none!important}
  #v-aventure{display:flex!important}
  .bloc{border:0;padding:0}
  .renc{border:1px solid #999}
}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

[hidden]{display:none!important}
@media (max-width:520px){.init{grid-template-columns:minmax(0,1fr)}.init button.primary{width:100%}}

/* Accueil */
body.a-accueil .onglets{display:none}
body.a-accueil{--nav-h:0px}
.accueil{display:flex;flex-direction:column;gap:16px}
.carte-nouv{flex-direction:row;align-items:center;gap:16px;text-align:left;font-family:var(--f-body);letter-spacing:0;border:2px dashed var(--accent);padding:18px 20px;cursor:pointer}
.carte-nouv .gros{color:var(--accent);font-size:44px}
.carte-nouv:hover{background:var(--accent-soft)}
.parties{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:10px}
.partie-c{border:1px solid var(--line);border-left:4px solid var(--pc,var(--accent));border-radius:6px;background:var(--bg);display:flex;flex-direction:column;gap:2px;padding:4px 6px 6px}
.partie-c .ouvrir{all:unset;cursor:pointer;display:flex;flex-direction:column;gap:3px;padding:8px 8px 4px;border-radius:4px}
.partie-c .ouvrir:focus-visible{outline:2px solid var(--accent)}
.partie-c .ouvrir b{font-weight:400;font-size:21px;line-height:1.15}
.partie-c .danger{align-self:flex-end}
.etape{display:flex;flex-direction:column;gap:8px}
.etape .sub b{color:var(--spark);font-family:var(--f-display);font-size:19px;letter-spacing:0;margin-right:7px;font-weight:400}
/* Groupe */
.coureurs{display:flex;flex-direction:column;gap:6px}
.coureur{display:grid;grid-template-columns:minmax(0,1fr) auto auto auto;gap:6px;align-items:center}
.coureur.absent input{color:var(--muted);text-decoration:line-through}
.stepper.petit output{font-size:16px;min-width:3.4em;font-family:var(--f-small)}
.stepper.petit button{padding:5px 10px;font-size:16px}
@media (max-width:460px){.coureur{grid-template-columns:minmax(0,1fr) auto auto}.coureur input{grid-column:1/-1}}

.chip[data-cact][aria-pressed="false"]{text-decoration:line-through;color:var(--muted)}
.genres{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:7px}
.genre{display:flex;flex-direction:column;align-items:flex-start;gap:1px;text-align:left;padding:8px 11px;font-family:var(--f-body);letter-spacing:0}
.genre b{font-family:var(--f-display);font-weight:400;font-size:18px;line-height:1.1}
.genre span{font-family:var(--f-small);font-size:12.5px;color:var(--muted);line-height:1.25}
.genre[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.genre[aria-pressed="true"] span{color:var(--accent-ink);opacity:.85}
.type-resume{padding:10px 14px}
.type-resume b{font-family:var(--f-display);font-weight:400;font-size:18px}

</style>
</head>
<body>
<div class="wrap">
  <header class="tete">
    <span class="eyebrow">Coureurs d'Orages · outils du Conteur</span>

const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const cap=s=>s?s.charAt(0).toUpperCase()+s.slice(1):s;
function R(n){if(n<=1)return 0;const a=new Uint32Array(1);crypto.getRandomValues(a);return a[0]%n}
const pick=a=>a[R(a.length)];
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=R(i+1);[a[i],a[j]]=[a[j],a[i]]}return a}
const de=n=>R(n)+1;
/* "2d6+1", "d8", "1d4+1d8" → {total, detail} */
function lancer(f){
  let tot=0;const det=[];
  String(f).replace(/\s/g,"").split(/(?=[+-])/).forEach(t=>{
    const sg=t[0]==="-"?-1:1;const u=t.replace(/^[+-]/,"");const m=u.match(/^(\d*)d(\d+)$/i);
    if(m){const n=+(m[1]||1),s=+m[2];for(let i=0;i<n;i++){const v=de(s);tot+=sg*v;det.push(v)}}
    else if(u){tot+=sg*(+u);det.push((sg<0?"−":"+")+u)}
  });
  return {total:tot,detail:det};
}
const fmtJet=(f,r)=>`${f} → <b>${r.total}</b>${r.detail.length>1?` <span class="muted">(${r.detail.join(", ")})</span>`:""}`;
function toast(m){const t=$("toast");t.textContent=m;t.classList.add("on");clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove("on"),2200)}
const uid=()=>Date.now().toString(36)+R(1e6).toString(36);
/* articles : de(x) / a(x) */
function deX(x){if(/^le /i.test(x))return "du "+x.slice(3);if(/^les /i.test(x))return "des "+x.slice(4);if(/^des /i.test(x))return "de "+x.slice(4);if(/^[aeiouyéèêâîôœ]/i.test(x))return "d'"+x;return "de "+x}
function aX(x){if(/^le /i.test(x))return "au "+x.slice(3);if(/^les /i.test(x))return "aux "+x.slice(4);return "à "+x}

/* Le groupe : chaque coureur a son niveau et peut être présent ou non. joueurs/niveau restent tenus à jour pour l'affichage. */
function syncGroupe(p){if(!p.groupe)p.groupe=groupeNeuf(p.joueurs||4,p.niveau||1);const a=p.groupe.filter(c=>c.actif);
  p.joueurs=a.length;p.niveau=a.length?Math.round(a.reduce((s,c)=>s+c.niv,0)/a.length):1}

/* ref : {th,i} adversaire du thème · {b} base du livre / figurant · {p} créature perso · {nom,b,desc} adversaire nommé */
function resoudre(ref){
  if(!ref)return null;
  if(ref.p){const c=DB.perso.find(x=>x.id===ref.p);return c?Object.assign({},c,{ref,origine:"Créature maison"}):null}
  let nom,b,desc="",caps=null,surnat=false;
  if(ref.th){const t=TBY[ref.th];const a=t&&t.advP[ref.i];if(!a)return null;({nom,b,desc,caps,surnat}=a)}
  else{b=ref.b;nom=ref.nom||BASES[b].n;desc=ref.desc||""}
  const base=BASES[b];if(!base)return null;
  const origine=(LIVRE[b]?"D'après le bestiaire : ":"Figurant, profil : ")+base.n.toLowerCase();
  return Object.assign({},base,{nom,desc,cap:caps||base.cap,ref,b,surnat,origine:nom===base.n?(LIVRE[b]?"Bestiaire du livre":"Figurant générique"):origine});
}
const menace=c=>Math.pow(c.dv,1.5);
const DIFFS={facile:["Facile",.6],equilibre:["Équilibré",1],rude:["Rude",1.5],mortel:["Mortel",2.2]};
function budget(diff){return puissance()*DIFFS[diff][1]}
function niveauDe(sum){const r=sum/puissance();return r<.8?"facile":r<1.25?"equilibre":r<1.8?"rude":"mortel"}
const badge=k=>`<span class="niv ${k}">${DIFFS[k][0]}</span>`;
function vileniePar(c){return c.dv>=9?3:c.dv>=7?2:0}
function poolTheme(){const t=T(),p=P();let l=t.advP.filter(a=>p.surnat||!a.surnat);if(!l.length)l=t.advP;return l.map(a=>({th:t.id,i:a.i}))}
/* Choisit une rencontre. Renvoie {lead,troupe,diff} ; les effectifs sont recalculés à l'affichage selon le groupe. */
function tirerRencontre(diff,opt={}){
  const B=budget(diff);const pool=(opt.pool||poolTheme()).map(r=>({r,c:resoudre(r)})).filter(x=>x.c);
  const m=x=>menace(x.c);
  if(opt.lead){return {lead:opt.lead,troupe:pickTroupe(pool,B,menace(resoudre(opt.lead))),diff}}
  const opts=[];
  const solos=pool.filter(x=>m(x)>=.7*B&&m(x)<=1.4*B);if(solos.length)opts.push(()=>({lead:pick(solos).r,troupe:null,diff}));
  const chefs=pool.filter(x=>m(x)>=.3*B&&m(x)<.75*B&&x.c.dv>=3);
  if(chefs.length)opts.push(()=>{const l=pick(chefs);return {lead:l.r,troupe:pickTroupe(pool.filter(x=>x!==l),B,m(l)),diff}});
  let troupes=pool.filter(x=>m(x)<=.5*B&&m(x)>=B/12);if(!troupes.length)troupes=pool.filter(x=>m(x)<=.5*B).sort((x,y)=>m(y)-m(x)).slice(0,2);if(troupes.length)opts.push(()=>({lead:null,troupe:pick(troupes).r,diff}));
  if(!opts.length){const plusFaible=pool.slice().sort((a,b)=>m(a)-m(b))[0];return {lead:plusFaible.r,troupe:null,diff}}
  return pick(opts)();
}
function pickTroupe(pool,B,ml){const reste=B-ml;if(reste<1)return null;const ok=x=>menace(x.c)<=Math.max(1,.35*B);let c=pool.filter(x=>ok(x)&&menace(x.c)>=reste/8);if(!c.length)c=pool.filter(ok).sort((x,y)=>menace(y.c)-menace(x.c)).slice(0,2);return c.length?pick(c).r:null}
function effectifs(sp){
  if(!sp)return [];const B=budget(sp.diff);const out=[];let ml=0;
  if(sp.lead){const c=resoudre(sp.lead);if(c){out.push({c,n:1});ml=menace(c)}}
  if(sp.troupe){const c=resoudre(sp.troupe);if(c){const n=Math.max(sp.lead?0:1,Math.min(sp.lead?8:12,Math.round((B-ml)/menace(c))));if(n>0)out.push({c,n})}}
  return out;
}
function texteRencontre(sp){const e=effectifs(sp);if(!e.length)return "—";const tot=e.reduce((s,x)=>s+menace(x.c)*x.n,0);
  return e.map(x=>`<b>${x.n>1?x.n+" × ":""}${esc(x.c.nom)}</b>`).join(" et ")+" "+badge(niveauDe(tot))}
function rencHTML(sp,where){const e=effectifs(sp);const mort=e.length&&niveauDe(e.reduce((s,x)=>s+menace(x.c)*x.n,0))==="mortel";
  return `<div class="renc">${texteRencontre(sp)}${mort?`<span class="small muted" style="flex-basis:100%">Trop fort pour un affrontement de face : prévois une ruse, une faiblesse, des alliés ou une issue.</span>`:""}<span style="flex:1"></span><button class="mini" data-act="vers-combat" data-where="${esc(where)}">→ Combat</button></div>`}

function accesSorts(niv){return niv>=6?3:niv>=4?2:niv>=2?1:0}
function genParchemin(t,niv){t=t||T();niv=niv||P().niveau;const max=Math.max(1,accesSorts(niv));const l=SORTS_BASE.map((s,i)=>Object.assign({n:t.sortsNoms[i]},s)).filter(s=>s.niv<=max);const s=pick(l);
  return {n:s.n,niv:s.niv,e:s.e,un:t.sortsUn,lisible:accesSorts(niv)>=s.niv}}

function remplir(s,c,extra){const v=varsCtx(c,extra);if(c.F)v.F=c.F;let out=s;
  for(let k=0;k<3;k++){const av=out;out=out.replace(/\{(\w+)\}/g,(m,key)=>{if(v[key]!=null)return "\u0001"+v[key];const lo=key.charAt(0).toLowerCase()+key.slice(1);if(v[lo]!=null)return "\u0001"+cap(v[lo]);return m});if(av===out)break}
  return contracter(out)}

function contracter(s){return s
  .replace(/(^|[\s'(])([àÀ]) \u0001le /gi,(m,a,b)=>a+(b==="À"?"Au":"au")+" ").replace(/(^|[\s'(])([àÀ]) \u0001les /gi,(m,a,b)=>a+(b==="À"?"Aux":"aux")+" ")
  .replace(/(^|[\s'(])([dD])e \u0001le /g,(m,a,b)=>a+b+"u ").replace(/(^|[\s'(])([dD])e \u0001les /g,(m,a,b)=>a+b+"es ").replace(/(^|[\s'(])([dD])e \u0001des /g,(m,a,b)=>a+b+"e ")
  .replace(/(^|[\s'(])([dD])e \u0001([aeiouyéèêâîôœAEIOUYÉÈ])/g,(m,a,b,c)=>a+b+"'"+c).replace(/\u0001/g,"")}

function libelleType(c){if(!c.genre)return "";let s=GENRES[c.genre].nom;if(c.genre2&&GENRES[c.genre2]&&c.genre2!==c.genre)s+=" × "+GENRES[c.genre2].nom;if(c.inspi&&INSPI[c.inspi])s+=", dans l'esprit de « "+INSPI[c.inspi].ref.split(",")[0]+" »";return s}
function choisirProie(){const B=budget("rude");const pool=poolTheme().map(r=>({r,c:resoudre(r)})).filter(x=>x.c&&!(MODELES[x.c.b]&&!["bete","betegeante","engin"].includes(x.c.b)));
  const ok=pool.filter(x=>menace(x.c)>=.5*B&&menace(x.c)<=1.6*B);if(ok.length)return pick(ok).r;const s=pool.sort((a,b)=>menace(b.c)-menace(a.c)).filter(x=>menace(x.c)<=2*B);return (s[0]||pool[0]||{}).r}
function nouvelleAventure(){
  const p=P(),t=T();const c=ctxNeuf(t);const blocs=[];
  const add=(k,j)=>{const b={k,j:j||0,r:BLOCS[k].tirer(j||0,c)};blocs.push(b);return b};
  c.genre=p.genre&&GENRES[p.genre]?p.genre:pick(Object.keys(GENRES));c.genreDom=GENRES[p.genre]?p.genre:null;
  c.inspi=p.inspi&&INSPI[p.inspi]&&INSPI[p.inspi].g===c.genre?p.inspi:null;
  c.genre2=p.genre2&&GENRES[p.genre2]&&p.genre2!==c.genre?p.genre2:null;
  if(c.genre==="chasse"||c.genre2==="chasse"){const pr=choisirProie();if(pr){c.proie=pr;c.proieNom=resoudre(pr).nom}}

    add("pnj",0);add("pnj",1);
  }else{

    const n=Math.max(3,Math.min(5,7-p.niveau));for(let j=0;j<n;j++){const b=add("chapitre",j);b.n=n;b.r.renc=tirerRencontre(b.r.diff);if(j===n-1)b.r.troupe=tirerRencontre("rude",{lead:{b:c.a.b}}).troupe}
    [0,1,2].forEach(j=>add("pnj",j));
  }
  const tg={enquete:"L'affaire "+deX(c.o),horreur:"L'ombre "+deX(c.l1),exploration:"Les secrets "+deX(c.l1),casse:"Le coup "+deX(c.l1),escorte:"La route "+deX(c.l1),siege:"La dernière nuit "+deX(c.l0),intrigue:"Les masques "+deX(c.l0),chasse:"La traque "+deX(c.proieNom?c.proieNom.toLowerCase():"la bête")}[c.genre];
  const titres=p.type==="oneshot"?[tg,tg,cap(c.o),"Le prix "+deX(c.o),"Les ombres "+deX(c.l1),"La nuit "+deX(nomCourt(c.a))]:["La chute "+deX(nomCourt(c.a)),"Le règne "+deX(nomCourt(c.a)),"Les secrets "+deX(c.lieux[6]),"Sous l'ombre "+deX(nomCourt(c.a))];
  p.av={type:p.type,theme:t.id,titre:pick(titres),c,blocs,cree:Date.now()};

  sauver();
}

function quand(t){const j=Math.floor((Date.now()-t)/864e5);if(j<1)return "aujourd'hui";if(j<2)return "hier";if(j<30)return `il y a ${j} jours`;return "le "+new Date(t).toLocaleDateString("fr-BE")}
function exemple(){const pool=poolTheme().map(r=>resoudre(r)).filter(Boolean);const B=budget("equilibre");
  const tr=pool.filter(c=>c.dv<=2).sort((a,b)=>b.dv-a.dv)[0]||pool[0];const n=Math.max(1,Math.round(B/menace(tr)));
  const solo=pool.filter(c=>menace(c)>=.7*B&&menace(c)<=1.4*B)[0];
  return `${n} × ${tr.nom.toLowerCase()}`+(solo?`, ou un seul adversaire comme ${solo.nom.toLowerCase()}`:"")}

function ajouterCombat(c,n){
  const cb=C();n=Math.max(1,n||1);

  const g={id:uid(),nom:c.nom,dv:c.dv,d:c.d,att:c.att,def:c.def,pvMax:c.pv,na:c.na,dmg:c.dmg,cap:caps,pv:Array(n).fill(c.pv),cible:0,etats:[],vil:vileniePar(c),flamme:-9,surplus:n>1};
  cb.grp.push(g);journal(`${n>1?n+" × ":""}${c.nom} entre${n>1?"nt":""} en scène.`);

function journal(m){const cb=C();cb.log.unshift((cb.tour?`T${cb.tour} · `:"")+m);cb.log=cb.log.slice(0,40)}
function vivants(g){return g.pv.filter(v=>v>0).length}
function frapper(g,dmg){
  if(!(dmg>0))return;let i=g.pv[g.cible]>0?g.cible:g.pv.findIndex(v=>v>0);if(i<0)return;const tues=[];
  while(dmg>0&&i>=0){const v=g.pv[i];const prend=Math.min(v,dmg);g.pv[i]=v-prend;dmg-=prend;if(g.pv[i]<=0)tues.push(i+1);
    if(!g.surplus)break;i=g.pv.findIndex(v=>v>0)}
  if(g.pv[g.cible]<=0){const n=g.pv.findIndex(v=>v>0);if(n>=0)g.cible=n}
  if(tues.length)journal(`${g.nom}${g.pv.length>1?" ("+tues.map(n=>"n° "+n).join(", ")+")":""} hors de combat.`);
  if(!vivants(g))journal(`Tous les ${g.nom} sont vaincus.`);
}

   <div class="rangee"><button class="primary" data-act="g-danger">Tirer un danger</button></div><div class="sortie" id="sDanger"></div>
   <p class="small muted">Peut tuer un homme : 1d8 · un cheval : 2d8 · un ogre : 4d8. Rarement plus.</p></div>

   <div class="sortie" id="sDes"></div></div>
  <div class="bloc gen"><div class="bloc-h"><h2>Réputation</h2><small>Le coureur est-il reconnu ?</small></div>
   <label>Coureur<select id="repC">${p.groupe.filter(c=>c.actif).map(c=>`<option value="${c.niv}">${esc(c.nom)} (niv. ${c.niv})</option>`).join("")}</select></label>
   <div class="rangee"><div class="seg">${["d4","d6","d8","d10","d12"].map(d=>`<button data-rep="${d}" aria-pressed="${d==="d8"}">${d}</button>`).join("")}</div><button class="primary" data-act="g-rep">Lancer</button></div>
   <p class="small muted">Dé + niveau, 9 ou plus : reconnu. d8 sur son terrain ; plus petit loin de chez lui, plus grand au cœur de son fief.</p><div class="sortie" id="sRep"></div></div>
  <div class="bloc aide"><div class="bloc-h"><h2>Aide-mémoire</h2></div><dl>
   <dt>Jet standard</dt><dd>1d20 + niveau contre 16. Attaques, sauvegardes, tout le reste.</dd>
   <dt>Arts du mouvement</dt><dd>1d20 + niveau + 6 − armure contre 16 : acrobatie, athlétisme, discrétion. Sert aussi de « jet d'équipement ».</dd>
   <dt>Avantage, désavantage</dt><dd>2d20, garder le meilleur ou le pire. Récompense une bonne idée ou une belle description, jamais un simple aspect.</dd>
   <dt>Action de groupe</dt><dd>Réussie si la majorité réussit. Égalité : 1d6, 4 ou plus, c'est un succès.</dd>
   <dt>Critiques (option)</dt><dd>d20 naturel de 18 ou plus : spectaculaire ; 3 ou moins : échec critique.</dd>
   <dt>Récupération</dt><dd>Repos long de 8 h, une fois par 24 h : tous les DH reviennent, les DV peuvent être relancés.</dd>
   <dt>Dés de vilenie</dt><dd>Créatures légendaires, 1 à 6 dés : retirer 1d6 au jet d'un joueur, ou ajouter 1d6 aux dégâts.</dd>
   <dt>Progression</dt><dd>Tu décides : après un moment clé, une séance ou un scénario. Six niveaux.</dd></dl></div>
  </div>`;
}

/* ============ Navigation et rendu ============ */
let ONGLET="accueil";
const RENDUS={accueil:rendreAccueil,partie:rendrePartie,aventure:rendreAventure,bestiaire:rendreBestiaire,combat:rendreCombat,outils:rendreOutils,notes:rendreNotes};
function rendre(){if(!P()&&ONGLET!=="accueil")ONGLET="accueil";document.body.classList.toggle("a-accueil",ONGLET==="accueil");rendreResume();RENDUS[ONGLET]();
  document.querySelectorAll(".vue").forEach(v=>v.classList.toggle("active",v.id==="v-"+ONGLET));
  document.querySelectorAll("[data-tab]").forEach(b=>b.setAttribute("aria-current",b.dataset.tab===ONGLET?"page":"false"))}
function aller(o){ONGLET=o;if(o!=="accueil"){P().vu=Date.now();sauver()}rendre();window.scrollTo({top:0})}
function ouvrir(id){DB.cur=id;BEST.renc=null;PROP.liste=[];P().vu=Date.now();sauver();aller(P().av?"aventure":"partie")}

/* ============ Événements ============ */
document.addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b)return;const d=b.dataset;const p=P();
  if(d.tab){aller(d.tab);return}
  if(d.go){aller(d.go);return}
  /* Partie */
  if(d.theme){p.theme=d.theme;if(d.theme==="medieval")p.surnat=false;BEST.renc=null;sauver();rendre();return}
  if(d.cniv!=null){const c=p.groupe[+d.cniv];c.niv=Math.max(1,Math.min(6,c.niv+(+d.d)));syncGroupe(p);sauver();rendre();return}
  if(d.cact!=null){const c=p.groupe[+d.cact];c.actif=!c.actif;syncGroupe(p);sauver();rendre();toast(`${c.nom} : ${c.actif?"présent":"absent"}.`);return}
  if(d.csup!=null){if(!confirmer(b,"Sûr ?"))return;p.groupe.splice(+d.csup,1);syncGroupe(p);sauver();rendre();return}
  if(d.act==="c-ajout"){const niv=p.niveau||1;p.groupe.push({id:uid(),nom:"Coureur "+(p.groupe.length+1),niv,actif:true});syncGroupe(p);sauver();rendre();return}
  if(d.act==="c-monte"){p.groupe.forEach(c=>{if(c.actif&&c.niv<6)c.niv++});syncGroupe(p);sauver();rendre();toast("Les coureurs présents montent d'un niveau.");return}
  /* Accueil */
  if(d.act==="nouv"){NOUV={theme:(p&&p.theme)||"fantasy",n:4,niv:1,type:"oneshot",surnat:true,genre:"hasard"};rendreAccueil();window.scrollTo({top:0});return}
  if(d.act==="nouv-annuler"){NOUV=null;rendreAccueil();return}
  if(d.ntheme){NOUV.theme=d.ntheme;if(d.ntheme==="medieval")NOUV.surnat=false;rendreAccueil();return}
  if(d.nn){NOUV.n=Math.max(1,Math.min(8,NOUV.n+(+d.nn)));rendreAccueil();return}
  if(d.nniv){NOUV.niv=+d.nniv;rendreAccueil();return}
  if(d.ntype){NOUV.type=d.ntype;rendreAccueil();return}
  if(d.act==="nouv-go"){nouvellePartie(NOUV);NOUV=null;nouvelleAventure();BEST.renc=null;PROP.liste=[];aller("aventure");return}
  if(d.ouvrir){ouvrir(d.ouvrir);return}
  if(d.suppr){if(!confirmer(b,"Toucher encore pour supprimer"))return;delete DB.parties[d.suppr];if(DB.cur===d.suppr)DB.cur=Object.keys(DB.parties)[0]||null;sauver();rendreAccueil();toast("Partie supprimée.");return}
  /* Combat : propositions */
  if(d.pd){PROP.diff=d.pd;p.diff=d.pd;proposer();sauver();rendreCombat();return}
  if(d.act==="proposer"){proposer();rendreCombat();return}
  if(d.act==="prop-go"){effectifs(PROP.liste[+d.i]).forEach(x=>ajouterCombat(x.c,x.n));PROP.liste=[];rendreCombat();rendreResume();toast("Adversaires ajoutés au combat.");window.scrollTo({top:document.querySelector(".groupes")?.offsetTop-80||0,behavior:"smooth"});return}
  if(d.type){p.type=d.type;sauver();rendre();return}
  if(b.id==="btCode"){const code=btoa(unescape(encodeURIComponent(JSON.stringify(DB))));copier(code,"Code copié : colle-le sur l'autre appareil.");return}
  if(b.id==="btImport"){const z=$("zoneCode");if(z.hidden){z.hidden=false;z.focus();b.textContent="Importer";return}
    try{const x=JSON.parse(decodeURIComponent(escape(atob(z.value.trim()))));if(!x.parties)throw 0;Object.assign(DB.parties,x.parties);(x.perso||[]).forEach(c=>{if(!DB.perso.some(y=>y.id===c.id))DB.perso.push(c)});sauver();rendre();toast("Parties importées.")}catch(err){toast("Ce code n'est pas valide.")}return}
  /* Aventure */
  if(d.genre){p.genre=d.genre;if(p.inspi&&(!INSPI[p.inspi]||INSPI[p.inspi].g!==d.genre))p.inspi="";if(p.genre2===d.genre)p.genre2="";sauver();rendreAventure();return}
  if(d.inspi!=null&&d.act==null&&b.classList.contains("chip")&&b.closest("#v-aventure")){p.inspi=d.inspi;sauver();rendreAventure();return}
  if(d.act==="choix-ouvrir"){CHOIX_OUVERT=true;rendreAventure();return}
  if(d.act==="choix-fermer"){CHOIX_OUVERT=false;rendreAventure();return}
  if(d.ngenre){NOUV.genre=d.ngenre;if(NOUV.inspi&&INSPI[NOUV.inspi].g!==d.ngenre)NOUV.inspi="";if(NOUV.genre2===d.ngenre)NOUV.genre2="";rendreAccueil();return}
  if(d.ninspi!=null){NOUV.inspi=d.ninspi;rendreAccueil();return}
  if(d.act==="av-neuve"){if(p.av&&!confirmer(b,"Toucher encore : l'aventure actuelle sera remplacée"))return;nouvelleAventure();CHOIX_OUVERT=false;aller("aventure");return}
  if(d.act==="relancer"){const bl=p.av.blocs[+d.ix];bl.r=BLOCS[bl.k].tirer(bl.j,p.av.c);delete bl.t;
    if(bl.k==="lieu"){bl.r.amb=1+R(4);bl.r.q=1+R(4)}
    if(bl.k==="final")bl.r.troupe=tirerRencontre(bl.r.diff,{lead:{b:p.av.c.a.b}}).troupe;
    if(bl.k==="chapitre"){bl.r.renc=tirerRencontre(bl.r.diff);if(bl.j===bl.n-1)bl.r.troupe=tirerRencontre("rude",{lead:{b:p.av.c.a.b}}).troupe}
    sauver();rendreAventure();return}
  if(d.act==="ctx"){const t=TBY[p.av.theme],c=p.av.c;
    if(d.k==="a"){c.a=Object.assign({},antagonisteAdapte(t,c.a.nom));p.av.blocs.forEach(bl=>{if(bl.k==="final"||(bl.k==="gscene"&&sceneDe(c,bl.j).renc==="final"))bl.r.troupe=tirerRencontre(bl.r.diff||"rude",{lead:{b:c.a.b}}).troupe})}
    if(d.k==="comm")c.comm=pick(t.commanditaires.filter(x=>x!==c.comm));
    if(d.k==="o"){c.o=pick(t.objets.filter(x=>x!==c.o));c.p=pick(t.personnes.filter(x=>x!==c.p))}
    if(d.k==="l"){const ls=shuffle(t.lieux);c.l0=ls[0];c.l1=ls[1]}
    sauver();rendreAventure();toast("Les scènes non retouchées suivent le changement.");return}
  if(d.act==="lancer-table"){const r=lancer("1d4+1d8");$("resTable").innerHTML=fmtJet("1d4+1d8",r);document.querySelectorAll(".table-renc tr").forEach(tr=>tr.classList.toggle("tire",+tr.dataset.n===r.total));
    const tr=document.querySelector(`.table-renc tr[data-n="${r.total}"]`);if(tr)tr.scrollIntoView({block:"nearest",behavior:"smooth"});return}
  if(d.act==="faction-cachee"||d.act==="faction-cachee2"){const t=TBY[p.av.theme],c=p.av.c;const v=de(12);const m=v<=3?`<b>${v}</b> : ce figurant appartient en secret ${esc(aX(t.facP[c.f[v-1]].nom))}.`:`<b>${v}</b> : rien à cacher, il est ce qu'il paraît.`;
    const el=$(d.act==="faction-cachee"?"resCachee":"sPnj");if(d.act==="faction-cachee2")el.insertAdjacentHTML("beforeend",`<p>${m}</p>`);else el.innerHTML=m;return}
  if(d.act==="imprimer"){window.print();return}
  if(d.act==="vers-combat"){const sp=specDepuis(d.where);const e=effectifs(sp);if(!e.length)return;e.forEach(x=>ajouterCombat(x.c,x.n));aller("combat");toast("Adversaires ajoutés au combat.");return}
  /* Bestiaire */
  if(d.bf){BEST.filtre=d.bf;rendreBestiaire();return}
  if(d.rd){BEST.diff=d.rd;p.diff=d.rd;sauver();rendreBestiaire();return}
  if(d.act==="tirer-renc"){BEST.renc=tirerRencontre(BEST.diff||p.diff);rendreBestiaire();return}
  if(d.act==="nb"){BEST.nb[d.k]=Math.max(1,Math.min(20,(BEST.nb[d.k]||1)+(+d.d)));rendreBestiaire();return}
  if(d.act==="ajout-combat"){const c=resoudre(JSON.parse(d.k));ajouterCombat(c,BEST.nb[d.k]||1);rendreResume();toast(`${(BEST.nb[d.k]||1)>1?(BEST.nb[d.k])+" × ":""}${c.nom} : ajouté au combat.`);return}
  if(d.act==="suppr-perso"){DB.perso=DB.perso.filter(c=>c.id!==d.id);sauver();rendreBestiaire();return}
  if(d.cr){CREA.dv=Math.max(1,Math.min(10,CREA.dv+(+d.d)));rendreBestiaire();return}
  if(d.crd){CREA.d=+d.crd;rendreBestiaire();return}
  if(d.cra){CREA.arm=+d.cra;rendreBestiaire();return}
  if(d.crg){CREA.dmg=d.crg;rendreBestiaire();return}
  if(d.crc){const i=CREA.cap.indexOf(d.crc);if(i>=0)CREA.cap.splice(i,1);else if(CREA.cap.length<3)CREA.cap.push(d.crc);else toast("Trois capacités au plus.");rendreBestiaire();return}
  if(d.act==="creer"){const x=calcCrea();const nom=(CREA.nom||"").trim()||"Créature sans nom";if(!CREA.cap.length){toast("Choisis au moins une capacité.");return}
    DB.perso.push({id:uid(),n:nom,nom,dv:CREA.dv,d:CREA.d,att:x.att,def:x.def,pv:x.pv,na:x.na,dmg:CREA.dmg,cap:CREA.cap.slice(),desc:""});sauver();BEST.filtre="perso";CREA={nom:"",dv:3,d:8,arm:2,dmg:"d8",cap:[]};rendreBestiaire();toast(`${nom} rejoint « Mes créatures ».`);return}
  /* Combat */
  if(d.act==="tour"){const cb=C();cb.tour++;const v=de(6);const multi=cb.grp.filter(g=>vivants(g)&&typeof g.na==="string").map(g=>{const r=lancer(g.na).total;g.naTour=r;return `${g.nom} : ${r} attaques ce tour`});
    cb.init={v,na:multi.join(" · ")};journal(`Initiative : ${v}, ${v>=4?"les coureurs d'abord":"les adversaires d'abord"}.`);sauver();rendreCombat();return}
  if(d.act==="ajout-rapide"){const f=$("formRapide");f.hidden=!f.hidden;if(!f.hidden)f.nom.focus();return}
  if(d.act==="fin-combat"){if(!confirmer(b,"Toucher encore pour vider le combat"))return;const cb=C();cb.grp=[];cb.tour=0;cb.init=null;cb.log=[];sauver();rendreCombat();rendreResume();return}
  const g=d.g!=null?C().grp[+d.g]:null;
  if(d.act==="retirer"){C().grp.splice(+d.g,1);sauver();rendreCombat();rendreResume();return}
  if(d.act==="cible"){g.cible=+d.i;sauver();rendreCombat();return}
  if(d.act==="pv"){frapper(g,+d.d);sauver();rendreCombat();rendreResume();return}
  if(d.act==="pv-in"){const inp=document.querySelector(`[data-in="${d.g}"]`);const v=parseInt(inp.value,10);if(v>0){frapper(g,v);journal(`${g.nom} encaisse ${v} dégâts.`);sauver();rendreCombat();rendreResume()}else inp.focus();return}
  if(d.act==="soin"){const i=g.pv[g.cible]>0?g.cible:g.pv.findIndex(v=>v>0);if(i>=0){g.pv[i]=Math.min(g.pvMax*2,g.pv[i]+1)}sauver();rendreCombat();return}
  if(d.act==="degats"){const r=lancer(g.dmg);resGrp(d.g,`Dégâts : ${fmtJet(g.dmg,r)}`);return}
  if(d.act==="nbatt"){const r=lancer(g.na);g.naTour=r.total;sauver();resGrp(d.g,`Attaques ce tour : <b>${r.total}</b>`);return}
  if(d.act==="flamme"){const r=lancer("4d8");g.flamme=C().tour;journal(`${g.nom} projette des flammes : ${r.total} dégâts de zone.`);sauver();rendreCombat();resGrp(d.g,`Flammes : ${fmtJet("4d8",r)} · moitié sur un jet standard réussi. Pas de nouvelles flammes au prochain tour.`);return}
  if(d.act==="vilenie"){if(g.vil<=0)return;g.vil--;const r=de(6);journal(`${g.nom} dépense un dé de vilenie : ${r}.`);sauver();rendreCombat();resGrp(d.g,`Dé de vilenie : <b>${r}</b> à retirer d'un jet de joueur ou à ajouter aux dégâts. Reste ${g.vil}.`);return}
  if(d.act==="vil-plus"){g.vil++;sauver();rendreCombat();return}
  if(d.act==="etat"){const i=g.etats.indexOf(d.e);if(i>=0)g.etats.splice(i,1);else g.etats.push(d.e);sauver();rendreCombat();return}
  if(d.act==="capinfo"){const el=document.querySelector(`[data-capres="${d.g}"]`);const t=`${d.c} : ${CAPACITES[d.c]}`;if(!el.hidden&&el.textContent===t)el.hidden=true;else{el.textContent=t;el.hidden=false}return}
  /* En jeu */
  if(d.act==="g-pnj"){const n=genPNJ();const t=textePNJ(n);$("sPnj").innerHTML=`<p>${esc(t)}</p><div class="rangee fin"><button class="mini" data-act="garder-pnj">Garder dans les notes</button></div>`;$("sPnj").dataset.t=t;return}
  if(d.act==="g-nom"){$("sPnj").innerHTML=`<p class="gros" style="font-size:24px">${esc(genNom())}</p>`;return}
  if(d.act==="garder-pnj"){p.pnjs.unshift({t:$("sPnj").dataset.t});sauver();b.disabled=true;b.textContent="Gardé";return}
  if(d.act==="g-butin"){$("sButin").innerHTML=genButin().map(x=>`<p>${esc(x)}</p>`).join("");return}
  if(d.act==="g-parch"){$("sButin").innerHTML=`<p>${esc(texteParchemin(genParchemin()))}</p>`;return}
  if(d.act==="g-danger"){$("sDanger").innerHTML=`<p>${esc(genDanger())}</p>`;return}
  if(d.de){const r=lancer(d.de);$("sDes").innerHTML=`<p class="gros">${r.total}</p><p class="small muted">${d.de}${r.detail.length>1?" : "+r.detail.join(" + "):""}</p>`;return}
  if(d.rep){document.querySelectorAll("[data-rep]").forEach(x=>x.setAttribute("aria-pressed",x===b));return}
  if(d.act==="g-rep"){const dd=(document.querySelector('[data-rep][aria-pressed="true"]')||{}).dataset?.rep||"d8";const nv=+(($("repC")||{}).value||p.niveau);const r=de(+dd.slice(1));const tot=r+nv;$("sRep").innerHTML=`<p>${dd} = ${r}, + niveau ${nv} = <b>${tot}</b> : ${tot>=9?"reconnu.":"personne ne le remet."}</p>`;return}
  /* Notes */
  if(d.act==="ajout-journal"){const v=$("nvEntree").value.trim();if(!v)return;p.journal.unshift({d:Date.now(),t:v});sauver();rendreNotes();return}
  if(d.act==="suppr-journal"){if(!confirmer(b,"Encore ?"))return;p.journal.splice(+d.i,1);sauver();rendreNotes();return}
  if(d.act==="suppr-pnj"){p.pnjs.splice(+d.i,1);sauver();rendreNotes();return}
});
function resGrp(gi,html){const el=document.querySelector(`[data-res="${gi}"]`);if(el)el.innerHTML=html}
function specDepuis(w){const p=P();if(w==="best")return BEST.renc;const [k,a,n]=w.split(":");
  if(k==="bloc")return specBloc(p.av.blocs[+a]);
  if(k==="table"){const e=p.av.blocs[+a].r.e[+n];const c=p.av.c;return e.ant?{lead:{nom:cap(nomCourt(c.a)),b:c.a.b,desc:c.a.secret},troupe:e.sp.troupe,diff:"mortel"}:e.sp}}
function confirmer(b,msg){if(b.dataset.arme==="1")return true;const ancien=b.textContent;b.dataset.arme="1";b.textContent=msg;setTimeout(()=>{if(b.isConnected){b.dataset.arme="";b.textContent=ancien}},3000);return false}
function copier(txt,msg){(navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).then(()=>toast(msg)).catch(()=>{const z=$("zoneCode");z.hidden=false;z.value=txt;z.select();toast("Copie le texte affiché.")})}

document.addEventListener("input",e=>{const el=e.target;const p=P();
  if(el.dataset.cnom!=null){p.groupe[+el.dataset.cnom].nom=el.value;sauver();return}
  if(el.id==="qBest"){BEST.q=el.value;const pos=el.selectionStart;rendreBestiaire();const q=$("qBest");q.focus();q.setSelectionRange(pos,pos);return}
  if(el.id==="cNom"){CREA.nom=el.value;return}
  if(el.id==="notes"){p.notes=el.value;sauver();return}
});
document.addEventListener("change",e=>{const el=e.target;const p=P();
  if(el.id==="nSurnat"){NOUV.surnat=el.checked;return}
  if(el.id==="genre2"){p.genre2=el.value;sauver();rendreAventure();return}
  if(el.id==="nGenre2"){NOUV.genre2=el.value;rendreAccueil();return}
  if(el.id==="surnat"){p.surnat=el.checked;BEST.renc=null;sauver();rendre();return}
  if(el.dataset.surplus!=null){C().grp[+el.dataset.surplus].surplus=el.checked;sauver();return}
  if(el.id==="veille"){veille(el.checked);return}
});
/* Textes retouchés à la main : enregistrés en quittant le champ */
document.addEventListener("focusout",e=>{const el=e.target;if(!el.isContentEditable)return;const p=P();const v=el.innerText.trim();
  if(el.dataset.edit==="titre"){p.av.titre=v||p.av.titre;sauver();rendreResume();return}
  if(el.dataset.bloc!=null){const bl=p.av.blocs[+el.dataset.bloc];if(v!==texteBloc(Object.assign({},bl,{t:null}))){bl.t=v;el.classList.add("edite")}else{delete bl.t;el.classList.remove("edite")}sauver();return}
  if(el.dataset.journal!=null){p.journal[+el.dataset.journal].t=v;sauver();return}
  if(el.dataset.pnj!=null){p.pnjs[+el.dataset.pnj].t=v;sauver();return}
});
document.addEventListener("keydown",e=>{const el=e.target;
  if(e.key==="Enter"&&el.dataset&&el.dataset.in!=null){e.preventDefault();document.querySelector(`[data-act="pv-in"][data-g="${el.dataset.in}"]`).click()}
  if(e.key==="Enter"&&el.dataset&&el.dataset.edit==="titre"){e.preventDefault();el.blur()}
});
document.addEventListener("submit",e=>{if(e.target.id!=="formRapide")return;e.preventDefault();const f=e.target;const n=Math.max(1,Math.min(20,+f.n.value||1));const pv=Math.max(1,+f.pv.value||1);
  ajouterCombat({nom:f.nom.value.trim()||"Adversaire",dv:1,d:8,att:+f.att.value||13,def:+f.def.value||12,pv,na:1,dmg:"d6",cap:[]},n);rendreCombat();rendreResume()});

/* Garder l'écran allumé pendant le combat */
let VEILLE=null;
async function veille(on){try{if(on&&"wakeLock"in navigator){VEILLE=await navigator.wakeLock.request("screen");toast("L'écran reste allumé.")}else if(VEILLE){await VEILLE.release();VEILLE=null}}catch(err){toast("Ce navigateur ne peut pas garder l'écran allumé.")}}
document.addEventListener("visibilitychange",()=>{if(VEILLE&&document.visibilityState==="visible")veille(true)});

rendre();

</script>
