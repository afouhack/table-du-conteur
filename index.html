<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Outils du Conteur pour le jeu de rôle Coureurs d'Orages : aventures par thème, bestiaire adapté au groupe, suivi de combat et générateurs.">
<meta name="theme-color" content="#7a3e1b">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icone-192.png">
<link rel="apple-touch-icon" href="icone-192.png">
<title>Table du Conteur</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&family=Alegreya:ital,wght@0,400;0,600;1,400&family=Alegreya+Sans:ital,wght@0,400;1,400&family=Alegreya+Sans+SC:wght@500;700&family=MedievalSharp&family=Pirata+One&family=Rye&family=Oswald:wght@500&family=Special+Elite&family=Orbitron:wght@600&family=Exo+2:wght@600&family=Audiowide&family=Caveat+Brush&family=Cinzel:wght@600&family=Limelight&family=Stardos+Stencil:wght@700&family=Playfair+Display+SC:wght@700&display=swap">
<style>
/* Même famille visuelle que la Forge de Coureurs ; accent rouille pour distinguer l'outil du Conteur. */
:root{
  --bg:#ebe7e1; --surface:#f7f5f1; --ink:#1f1c18; --muted:#635b52; --line:#c8bfb3;
  --accent:#8a4b22; --accent-ink:#ffffff; --accent-soft:#f0dccb; --spark:#a8781e;
  --ok:#3d6b3a; --ko:#a3332a; --ok-soft:#dce8d6; --ko-soft:#f3d9d5;
  --f-display:"IM Fell English SC","Times New Roman",serif;
  --f-body:"Alegreya",Georgia,serif;
  --f-label:"Alegreya Sans SC","Trebuchet MS",sans-serif;
  --f-small:"Alegreya Sans","Trebuchet MS",sans-serif;
  --th-font:var(--f-display); --th-acc:var(--accent);
  --nav-h:0px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#15130f; --surface:#1e1b16; --ink:#ece6dc; --muted:#a59b8e; --line:#3a342c;
  --accent:#e0956a; --accent-ink:#1a120c; --accent-soft:#3b2619; --spark:#e2b455;
  --ok:#8cc483; --ko:#ee8a7f; --ok-soft:#1f3320; --ko-soft:#3d1d19; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#15130f; --surface:#1e1b16; --ink:#ece6dc; --muted:#a59b8e; --line:#3a342c;
  --accent:#e0956a; --accent-ink:#1a120c; --accent-soft:#3b2619; --spark:#e2b455;
  --ok:#8cc483; --ko:#ee8a7f; --ok-soft:#1f3320; --ko-soft:#3d1d19; color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:12px}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;
  padding:calc(18px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(40px + var(--nav-h) + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.tete{display:flex;flex-direction:column;gap:4px;align-items:flex-start}
.eyebrow{font-family:var(--f-label);letter-spacing:.08em;color:var(--muted);font-size:14px}
h1{font-family:var(--f-display);font-weight:400;font-size:clamp(32px,6vw,50px);line-height:1;margin:0}
h2{font-family:var(--f-display);font-weight:400;font-size:24px;margin:0;line-height:1.15;text-wrap:balance}
h3{font-family:var(--f-display);font-weight:400;font-size:19px;margin:0;line-height:1.2}
.bolt{display:block;width:min(420px,100%);height:14px;color:var(--spark)}
.resume{margin-top:6px;font-family:var(--f-small);letter-spacing:0;font-size:14px;padding:5px 12px;border-radius:999px;background:var(--surface);color:var(--muted)}
.resume b{color:var(--ink);font-weight:600}
p{margin:0}
.muted{color:var(--muted)}
.small{font-family:var(--f-small);font-size:14px}
button{font-family:var(--f-label);font-size:15px;letter-spacing:.05em;border-radius:4px;padding:9px 14px;cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--ink);line-height:1.15}
button:hover{border-color:var(--accent)}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
button.ghost{background:transparent}
button.mini{font-size:13px;padding:5px 9px}
button.danger{color:var(--ko)}
button:disabled{opacity:.45;cursor:default}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,[contenteditable]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
label{font-family:var(--f-label);font-size:13px;letter-spacing:.06em;color:var(--muted);display:flex;flex-direction:column;gap:3px}
select,input,textarea{font:inherit;font-family:var(--f-body);font-size:16px;letter-spacing:0;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:7px 9px;width:100%;min-width:0}
textarea{resize:vertical;min-height:90px;line-height:1.4}
input[type=checkbox]{width:auto}

/* Onglets : en haut sur grand écran, barre fixe en bas sur téléphone */
.onglets{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:4px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 6px);z-index:20}
.onglets button{flex:1;display:flex;align-items:center;justify-content:center;gap:7px;border:0;background:transparent;padding:9px 6px;border-radius:5px;color:var(--muted)}
.onglets svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.onglets button[aria-current="page"]{background:var(--accent);color:var(--accent-ink)}
.onglets .pastille{min-width:18px;height:18px;border-radius:9px;background:var(--spark);color:#fff;font-size:11px;display:inline-grid;place-items:center;padding:0 5px;font-family:var(--f-small);letter-spacing:0}
@media (max-width:760px){
  :root{--nav-h:62px}
  .onglets{position:fixed;left:0;right:0;bottom:0;top:auto;border-radius:0;border-width:1px 0 0;padding:4px max(4px,env(safe-area-inset-left,0px)) calc(4px + env(safe-area-inset-bottom,0px));gap:2px}
  .onglets button{flex-direction:column;gap:2px;font-size:11px;letter-spacing:.03em;padding:6px 2px}
  .onglets .pastille{position:absolute;margin:-4px 0 0 22px}
  .onglets button{position:relative}
}
.vue{display:none;flex-direction:column;gap:16px}
.vue.active{display:flex}

/* Blocs */
.bloc{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:14px 16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.bloc-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
.bloc-h small{font-family:var(--f-small);font-size:14px;color:var(--muted)}
.sub{font-family:var(--f-label);font-size:13px;letter-spacing:.06em;color:var(--muted);margin:0}
.rangee{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.rangee.fin{justify-content:flex-end}
.grille2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:14px;align-items:start}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:5px;overflow:hidden;flex-wrap:wrap}
.seg button{border:0;border-radius:0;border-right:1px solid var(--line);background:var(--bg);font-size:14px;padding:8px 12px}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:5px;overflow:hidden;background:var(--bg)}
.stepper button{border:0;border-radius:0;padding:8px 13px;font-size:18px;background:transparent}
.stepper output{min-width:2.2em;text-align:center;font-family:var(--f-display);font-size:22px;font-variant-numeric:tabular-nums}
.toggle{display:flex;align-items:center;gap:8px;flex-direction:row;font-family:var(--f-small);font-size:15px;letter-spacing:0;color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-family:var(--f-small);letter-spacing:0;font-size:13.5px;padding:3px 9px;border-radius:999px;background:var(--bg);border:1px solid var(--line);color:var(--ink)}
button.chip{cursor:pointer}
.chip.cap{border-color:var(--spark);color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

/* Thèmes */
.themes{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.theme{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;padding:10px 12px;font-family:var(--f-body);letter-spacing:0}
.theme b{font-weight:400;font-size:19px;line-height:1.1}
.theme span{font-family:var(--f-small);font-size:13px;color:var(--muted);line-height:1.25}
.theme[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.theme[aria-pressed="true"] span{color:var(--accent-ink);opacity:.85}

/* Aventure */
.av{gap:14px}
.av-titre{font-family:var(--th-font);color:var(--th-acc);font-size:clamp(26px,5vw,38px);line-height:1.05;margin:0}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .av-titre{color:color-mix(in srgb,var(--th-acc) 45%,#fff)}}
:root[data-theme="dark"] .av-titre{color:color-mix(in srgb,var(--th-acc) 45%,#fff)}
.scene{border-left:3px solid var(--line);padding:2px 0 2px 14px;display:flex;flex-direction:column;gap:6px}
.scene.cle{border-left-color:var(--spark)}
.scene-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.scene-h .sub b{color:var(--spark);font-family:var(--f-display);font-size:18px;letter-spacing:0;margin-right:6px;font-weight:400}
.txt{white-space:pre-line;border-radius:3px;padding:1px 3px;margin:-1px -3px}
.txt[contenteditable]:hover{background:var(--bg)}
.txt.edite::after{content:" ✎";color:var(--muted);font-size:13px}
.de{border:0;background:transparent;font-size:18px;padding:2px 6px;color:var(--muted);flex:none}
.de:hover{color:var(--accent)}
.renc{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--bg);border:1px dashed var(--line);border-radius:5px;padding:7px 10px}
.renc b{font-weight:600}
.niv{font-family:var(--f-label);font-size:12px;letter-spacing:.06em;padding:2px 8px;border-radius:999px;border:1px solid currentColor}
.niv.facile{color:var(--ok)} .niv.equilibre{color:var(--spark)} .niv.rude{color:var(--accent)} .niv.mortel{color:var(--ko)}
.table-renc{width:100%;border-collapse:collapse;font-size:15px}
.table-renc td{border-top:1px solid var(--line);padding:6px 6px;vertical-align:top}
.table-renc td:first-child{font-family:var(--f-display);font-size:18px;width:2.2em;text-align:center;color:var(--spark)}
.table-renc tr.tire td{background:var(--accent-soft)}
.table-renc td:last-child{width:1%;white-space:nowrap}
ol.cles{margin:0;padding-left:1.3em;display:flex;flex-direction:column;gap:4px}

/* Fiches de créature */
.cartes{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,290px),1fr));gap:10px}
.crea{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:11px 13px;display:flex;flex-direction:column;gap:7px}
.crea-h{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.crea-h h3{font-size:18px}
.crea .base{font-family:var(--f-small);font-size:12.5px;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:5px}
.stat{border:1px solid var(--line);border-radius:4px;padding:4px 4px 3px;display:flex;flex-direction:column;align-items:center;background:var(--bg);min-width:0}
.stat .k{font-family:var(--f-label);font-size:11px;letter-spacing:.05em;color:var(--muted);line-height:1.1}
.stat b{font-family:var(--f-display);font-weight:400;font-size:21px;line-height:1.15;font-variant-numeric:tabular-nums}
.crea .att{font-family:var(--f-small);font-size:14px}
.crea p.desc{font-style:italic;font-size:15px;color:var(--muted)}
details.capx{font-family:var(--f-small);font-size:14px}
details.capx summary{cursor:pointer;color:var(--muted)}
details.capx dl{margin:6px 0 0;display:grid;gap:4px}
details.capx dt{font-weight:600;color:var(--ink)}
details.capx dd{margin:0 0 4px}
.ajout{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.ajout .stepper output{font-size:18px;min-width:1.8em}
.ajout .stepper button{padding:4px 10px;font-size:16px}
.menace{font-family:var(--f-small);font-size:13px}

/* Combat */
.init{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center}
.init-res{font-family:var(--f-display);font-size:22px;line-height:1.15}
.init-res small{display:block;font-family:var(--f-small);font-size:14px;color:var(--muted)}
.init-res.pj{color:var(--ok)} .init-res.adv{color:var(--ko)}
.d6{width:58px;height:58px;border-radius:10px;border:2px solid currentColor;display:grid;place-items:center;font-family:var(--f-display);font-size:30px}
.groupes{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr));gap:12px;align-items:start}
.grp{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:12px 13px;display:flex;flex-direction:column;gap:9px}
.grp.vaincu{opacity:.55}
.grp-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.grp-h h3{font-size:19px}
.pvs{display:flex;flex-wrap:wrap;gap:5px}
.pv{min-width:46px;padding:5px 7px;border-radius:5px;border:1px solid var(--line);background:var(--bg);font-family:var(--f-display);font-size:18px;line-height:1;display:flex;flex-direction:column;align-items:center;gap:3px;letter-spacing:0}
.pv i{display:block;width:100%;height:4px;border-radius:2px;background:var(--line);overflow:hidden;position:relative}
.pv i::after{content:"";position:absolute;inset:0;width:var(--p,100%);background:var(--ok)}
.pv.bas i::after{background:var(--ko)}
.pv[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.pv.mort{text-decoration:line-through;color:var(--muted);opacity:.6}
.pv.mort i::after{width:0}
.coup{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:5px}
.coup button{padding:9px 4px;font-size:16px;font-family:var(--f-display);letter-spacing:0}
.coup input{grid-column:span 2;text-align:center;font-size:18px}
.coup .soin{color:var(--ok)}
.jets{display:flex;flex-wrap:wrap;gap:6px}
.res{font-family:var(--f-small);font-size:14.5px;min-height:1.3em;color:var(--muted)}
.res b{color:var(--ink);font-family:var(--f-display);font-size:19px;font-weight:400}
.journal{font-family:var(--f-small);font-size:14px;color:var(--muted);max-height:180px;overflow:auto;display:flex;flex-direction:column;gap:2px}
.banniere{background:var(--accent-soft);border:1px solid var(--accent);border-radius:6px;padding:9px 12px;font-family:var(--f-small);font-size:15px;display:flex;gap:10px;align-items:center;justify-content:space-between}

/* Générateurs */
.gen{display:flex;flex-direction:column;gap:8px}
.sortie{background:var(--bg);border:1px solid var(--line);border-radius:5px;padding:10px 12px;min-height:3em;display:flex;flex-direction:column;gap:4px}
.sortie:empty{display:none}
.sortie b{font-weight:600}
.des{display:flex;flex-wrap:wrap;gap:6px}
.des button{font-family:var(--f-display);letter-spacing:0;font-size:17px;padding:8px 12px}
.gros{font-family:var(--f-display);font-size:32px;line-height:1}
.aide dl{margin:0;display:grid;grid-template-columns:minmax(0,1fr);gap:2px}
.aide dt{font-family:var(--f-label);letter-spacing:.05em;font-size:14px;color:var(--accent);margin-top:8px}
.aide dd{margin:0;font-size:15.5px}
.pnj-liste{display:flex;flex-direction:column;gap:8px}
.pnj{border-top:1px solid var(--line);padding-top:8px;display:flex;justify-content:space-between;gap:8px}
.entree{border-top:1px solid var(--line);padding-top:8px;display:flex;flex-direction:column;gap:4px}
.entree time{font-family:var(--f-label);font-size:12.5px;letter-spacing:.06em;color:var(--muted)}
.vide{text-align:center;color:var(--muted);padding:26px 10px;display:flex;flex-direction:column;gap:12px;align-items:center}
.pied{font-family:var(--f-small);font-size:13px;color:var(--muted);text-align:center;max-width:70ch;margin:10px auto 0}
.toast{position:fixed;left:50%;bottom:calc(20px + var(--nav-h) + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);font-family:var(--f-small);font-size:15px;padding:9px 16px;border-radius:6px;opacity:0;pointer-events:none;transition:.2s;z-index:50;max-width:calc(100% - 32px);text-align:center}
.toast.on{opacity:1;transform:translateX(-50%)}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}

@media print{
  body{background:#fff;color:#000;padding:0}
  .onglets,.tete,.pied,.de,.no-print,.toast{display:none!important}
  .vue{display:none!important}
  #v-aventure{display:flex!important}
  .bloc{border:0;padding:0}
  .renc{border:1px solid #999}
}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

[hidden]{display:none!important}
@media (max-width:520px){.init{grid-template-columns:minmax(0,1fr)}.init button.primary{width:100%}}

/* Accueil */
body.a-accueil .onglets{display:none}
body.a-accueil{--nav-h:0px}
.accueil{display:flex;flex-direction:column;gap:16px}
.carte-nouv{flex-direction:row;align-items:center;gap:16px;text-align:left;font-family:var(--f-body);letter-spacing:0;border:2px dashed var(--accent);padding:18px 20px;cursor:pointer}
.carte-nouv .gros{color:var(--accent);font-size:44px}
.carte-nouv:hover{background:var(--accent-soft)}
.parties{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:10px}
.partie-c{border:1px solid var(--line);border-left:4px solid var(--pc,var(--accent));border-radius:6px;background:var(--bg);display:flex;flex-direction:column;gap:2px;padding:4px 6px 6px}
.partie-c .ouvrir{all:unset;cursor:pointer;display:flex;flex-direction:column;gap:3px;padding:8px 8px 4px;border-radius:4px}
.partie-c .ouvrir:focus-visible{outline:2px solid var(--accent)}
.partie-c .ouvrir b{font-weight:400;font-size:21px;line-height:1.15}
.partie-c .danger{align-self:flex-end}
.etape{display:flex;flex-direction:column;gap:8px}
.etape .sub b{color:var(--spark);font-family:var(--f-display);font-size:19px;letter-spacing:0;margin-right:7px;font-weight:400}
/* Groupe */
.coureurs{display:flex;flex-direction:column;gap:6px}
.coureur{display:grid;grid-template-columns:minmax(0,1fr) auto auto auto;gap:6px;align-items:center}
.coureur.absent input{color:var(--muted);text-decoration:line-through}
.stepper.petit output{font-size:16px;min-width:3.4em;font-family:var(--f-small)}
.stepper.petit button{padding:5px 10px;font-size:16px}
@media (max-width:460px){.coureur{grid-template-columns:minmax(0,1fr) auto auto}.coureur input{grid-column:1/-1}}

.chip[data-cact][aria-pressed="false"]{text-decoration:line-through;color:var(--muted)}
.genres{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:7px}
.genre{display:flex;flex-direction:column;align-items:flex-start;gap:1px;text-align:left;padding:8px 11px;font-family:var(--f-body);letter-spacing:0}
.genre b{font-family:var(--f-display);font-weight:400;font-size:18px;line-height:1.1}
.genre span{font-family:var(--f-small);font-size:12.5px;color:var(--muted);line-height:1.25}
.genre[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.genre[aria-pressed="true"] span{color:var(--accent-ink);opacity:.85}
.type-resume{padding:10px 14px}
.type-resume b{font-family:var(--f-display);font-weight:400;font-size:18px}
.adn{font-family:var(--f-small);font-size:15px;color:var(--muted);border-left:3px solid var(--th-acc);padding:4px 0 4px 12px;margin:0}
.adn b{color:var(--ink);font-weight:600}
.crans{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:2px 0 0 17px}
.cran{width:36px;height:32px;padding:0;font-family:var(--f-display);font-size:17px;letter-spacing:0}

/* ==========================================================================
   Types d'aventure, version « situations ».
   Règles d'écriture (à respecter pour tout ajout) :
   1. Variété : un nom propre, un lieu ou un objet n'apparaît qu'une fois par bloc ; ensuite
      pronom ({il}, {lui}) ou synonyme ({a2}, {o2}, {comm2}, {l2}).
   2. Pas de rails : un problème de départ, puis 3 pistes jouables dans n'importe quel ordre.
      Chaque piste rapporte un atout utile au climax.
   3. Antagoniste actif : au climax il agit (rituel, otage, marché, fuite), avec un compte à rebours
      et plusieurs façons de s'en sortir autres que taper.
   4. Grain de sable : chaque scénario a une ambiguïté morale, une trahison ou un effet secondaire.
   5. ADN : chaque type et chaque inspiration donnent une consigne d'ambiance au Conteur.
   Repères : {a} antagoniste (1re mention), {a2} sa désignation, {il}/{Il} son pronom, {lui} pronom tonique,
   {dea}/{aa} « de/à » + nom ; {o}/{o2} objet ; {p} personne ; {comm}/{comm2} commanditaire ;
   {l0} lieu de départ, {l1} lieu du climax, {lieu} lieu de la piste ; {F1} {F2} factions ;
   {proie}, {signe}, {salle}, {danger}, {indice}, {revel}, {revelP}, {pnj}, {pnjsec}, {rec}.
   ========================================================================== */

  {t:"La réception",v:"Une soirée se donne à {lieu}, et {a} s'y montre. Un verre de trop, une confidence, et l'on apprend ce qui {lui} fait peur.",at:"faiblesse",obst:"social"}],

  {mode:"fuite",v:"Le coup a presque réussi. À {l1}, l'alarme hurle, les portes se ferment une à une, et {a} arrive avec sa garde. 3 tours avant que la dernière issue soit bloquée.",opts:["Foncer vers la sortie repérée (arts du mouvement groupé).","Retourner la situation : prendre le maître des lieux en otage.","Se fondre parmi les gardes (jet standard, avec avantage si un complice aide)."]},
  {mode:"marche",v:"À {l1}, devant le coffre ouvert, {a} attend les coureurs. {Il} savait tout. Une proposition : travailler pour {lui}, ou pourrir au cachot.",opts:["Accepter… et doubler tout le monde.","Révéler à ses hommes ce qu'on sait sur leur maître.","Faire jouer un moyen de pression pour sortir libres, et riches."]}],
 grains:["La prise n'appartient pas vraiment à {a} : elle a été volée à une famille ruinée, qui la réclame.","{Comm2} a déjà revendu la prise à un tiers, et prévoit de livrer les coureurs à la garde pour effacer les traces."]},

escorte:{nom:"Escorte",desc:"Mener quelqu'un ou quelque chose à bon port",
 adn:"Voyage sous tension : la route use les corps, la personne escortée cache quelque chose, et la confiance se gagne ou se perd à chaque étape.",
 synopsis:[
  "{P} doit atteindre {l1}, et beaucoup préféreraient l'en empêcher. {Comm} confie le voyage aux coureurs. En chemin, la question changera : faut-il vraiment livrer la personne qu'on protège ?",
  "De {l0} à {l1}, la route est longue et surveillée. {A} a mis un prix sur la tête de {p}. Trois chemins s'offrent aux coureurs ; aucun n'est sûr."],
 accroche:[
  "Avant l'aube, à {l0}, {comm} confie {p} aux coureurs. Destination : {l1}. Pas de questions, pas de détours.\nPaie : {rec} à l'arrivée.",
  "{Comm} attend les coureurs à {l0} avec un chariot, des vivres, et {p}. Les hommes {dea} sont déjà en ville.\nPaie : {rec}."],
 horloge:["Les chasseurs de l'ennemi retrouvent la piste.","La personne escortée tombe malade, ou tente de fuir.","Un pont, un col ou un gué est coupé : il faut passer par le pire chemin.","{A} attend à destination : le piège est en place."],
 pistes:[
  {t:"La route marchande",v:"Par {lieu} : rapide, fréquentée, mais chaque relais a des yeux. Des informateurs vendent le passage du groupe.",at:"preuve",renc:"facile"},
  {t:"Le raccourci sauvage",v:"Par {lieu} : personne ne l'emprunte, pour de bonnes raisons ({danger}). Un ermite y vit, qui connaît l'ennemi.",at:"faiblesse",obst:"danger"},
  {t:"Le refuge",v:"À {lieu}, un vieil ami de la personne escortée offre l'asile. La nuit, il révèle que {revelP}.",at:"levier",obst:"social"},
  {t:"Les passeurs",v:"À {lieu}, des contrebandiers promettent un chemin discret contre une faveur douteuse.",at:"passage",obst:"social"}],
 climax:[
  {mode:"otage",v:"Aux portes de {l1}, {a} attend. {Il} a capturé un proche de la personne escortée et propose l'échange, ici et maintenant.",opts:["Faire l'échange, puis tenter de tout récupérer.","Entrer par un autre chemin pendant qu'un coureur fait traîner les pourparlers.","Retourner les hommes de main avec une preuve des mensonges de leur chef."]},
  {mode:"fuite",v:"L'embuscade se referme à {l1}. {A} n'est pas venu pour se battre : seule compte la personne escortée, et {il} la veut vivante.",opts:["Couvrir la fuite : un coureur retient l'ennemi 3 tours.","Provoquer une diversion par le terrain (éboulement, incendie, cohue).","Livrer la personne… si le groupe a appris ce qu'elle cache."]}],
 grains:["La personne escortée n'est pas la victime qu'on croit : elle fuit une juste punition.","{Comm2} ne veut pas sauver la personne escortée : elle lui sert de monnaie d'échange."]},

siege:{nom:"Siège",desc:"Tenir jusqu'à l'aube",
 adn:"Tenir : chaque préparatif compte, les défenseurs doutent, l'ennemi cherche la faille. Fais sentir le temps qui passe et la fatigue qui monte.",
 synopsis:[
  "{A} marche sur {l0}, et ses hommes seront là à la nuit tombée. Ni murs dignes de ce nom ni soldats : il y a les coureurs, quelques jours, et des habitants qui n'ont jamais tenu une arme.",
  "{L0} est encerclé ; l'ennemi attend que la faim fasse le travail. {Comm} confie aux coureurs une mission désespérée : briser l'étau ou tenir jusqu'aux renforts."],
 accroche:[
  "Un éclaireur s'effondre sur la place de {l0} : {a} arrive. {Comm} réunit ceux qui peuvent se battre et se tourne vers les coureurs.\nPaie : {rec}, et la gratitude d'une ville.",
  "{Comm} reçoit les coureurs à {l0}. Les vivres tiendront cinq jours ; les renforts, s'ils viennent, en mettront sept.\nPaie : {rec}."],
 horloge:["Les éclaireurs ennemis repèrent les points faibles.","Le puits est empoisonné, ou les vivres sabotés.","Une première brèche ; les habitants veulent se rendre.","L'assaut final est lancé."],
 pistes:[
  {t:"L'armurerie oubliée",v:"Sous {lieu}, des armes et de quoi tenir, si l'on ose descendre ({danger}).",at:"contre",obst:"danger"},
  {t:"Le camp ennemi",v:"Une incursion nocturne à {lieu} : compter les hommes, saboter les machines, repérer la tente du chef.",at:"faiblesse",renc:"facile"},
  {t:"Les déserteurs",v:"À {lieu}, des soldats adverses en ont assez. Ils changeraient de camp contre des garanties.",at:"allie",obst:"social"},
  {t:"Le traître",v:"Depuis {lieu}, quelqu'un envoie des signaux à l'ennemi. Le démasquer permet de retourner la manœuvre.",at:"preuve",obst:"epreuve"}],
 climax:[
  {mode:"rituel",v:"L'assaut s'abat sur {l1}. {A} ne se bat pas en première ligne : {il} fait avancer un bélier, une machine ou une horreur qui enfoncera les défenses en 4 tours.",opts:["Détruire la machine (feu, sabotage, jet standard).","Frapper le chef par surprise (avec un accès secret).","Tenir la brèche avec les habitants : chaque allié compte."]},
  {mode:"marche",v:"Avant l'assaut, {a} envoie un émissaire à {l1} : qu'on lui livre une seule personne, et la ville sera épargnée.",opts:["Gagner du temps en négociant (un jet standard par tour gagné).","Livrer la personne… ou un leurre.","Frapper pendant les pourparlers : déshonorant, mais efficace."]}],
 grains:["Les habitants ont provoqué ce siège : ils ont trahi {a} il y a des années.","Les renforts attendus ont reçu l'ordre de laisser tomber la ville."]},

intrigue:{nom:"Intrigue",desc:"Complots, faveurs et coups de poignard",
 adn:"Masques et poignards : tout le monde ment un peu, les alliances tournent, une parole vaut une épée. Donne à chaque PNJ une chose qu'il veut et une chose qu'il cache.",
 synopsis:[
  "À {l0}, {F1} et {F2} se disputent le pouvoir à coups de sourires et de poison. {Comm} veut que les coureurs fassent pencher la balance. Dans l'ombre, {a} attend que les deux camps s'épuisent.",
  "Une soirée, des masques, des alliances qui se nouent et se défont. {Comm} engage les coureurs pour récupérer {o} avant qu'on s'en serve pour un chantage. Chaque faction le veut ; chacune a de quoi payer."],
 accroche:[
  "{Comm} glisse aux coureurs une invitation pour {l0} et une liste de noms. Objectif : savoir qui complote, et pour qui.\nPaie : {rec}.",
  "Une lettre anonyme attend les coureurs à {l0} : {o} change de mains ce soir. {Comm} offre {rec} pour que la transaction tourne à son avantage."],
 horloge:["Une rumeur salit le nom du commanditaire.","Un témoin gênant est empoisonné.","{F1} et {F2} concluent un accord sur le dos des coureurs.","{A} prend le pouvoir à la faveur du chaos."],
 pistes:[
  {t:"Le salon",v:"À {lieu}, les gens d'influence échangent des secrets contre des secrets. {pnj} y sait tout ; il {pnjsec}.",at:"levier",obst:"social"},
  {t:"Les archives",v:"À {lieu} dorment contrats, dettes et testaments. Une page manque, et quelqu'un paie pour qu'elle reste introuvable.",at:"preuve",obst:"epreuve"},
  {t:"Le bas-fond",v:"À {lieu}, les hommes de main de toutes les factions boivent ensemble. Les langues se délient, les couteaux aussi.",at:"faiblesse",renc:"facile"},
  {t:"L'émissaire",v:"À {lieu}, un envoyé de {F2} propose aux coureurs de changer de camp. Son offre est sincère, pour l'instant.",at:"allie",obst:"social"}],
 climax:[
  {mode:"marche",v:"À {l1}, devant toute la cour, {a} se dévoile et offre aux coureurs une place à ses côtés. Refuser, c'est devenir l'ennemi de tous.",opts:["Le confondre en public avec une preuve.","Accepter, et trahir au moment choisi.","Retourner {F1} ou {F2} contre {lui}."]},
  {mode:"otage",v:"Le banquet de réconciliation, à {l1}, tourne au guet-apens : portes closes, gardes en armes. {A} tient les chefs des factions à sa merci.",opts:["Libérer les otages un à un (arts du mouvement, un par tour).","Négocier au nom de tous, avec un moyen de pression.","Abattre l'instigateur dans la confusion (frappe vicieuse avec un accès secret)."]}],
 grains:["Le camp que servent les coureurs est pire que celui qu'ils combattent.","{O} contient une vérité qui ruinerait aussi le commanditaire."]},

chasse:{nom:"Chasse",desc:"Traquer une bête, ou un homme",
 adn:"Traque : lire les signes, choisir son terrain, et ne jamais oublier que la proie chasse aussi. Les meilleures rencontres arrivent quand le groupe est divisé.",
 synopsis:[
  "Une bête, {proie}, ravage les alentours de {l0}. Les battues reviennent bredouilles, ou ne reviennent pas. {Comm} offre une prime. Mais la créature n'agit pas seule, et {a} a ses raisons de la protéger.",
  "{Comm} a tout perdu à cause de {proie} et offre ce qui lui reste pour sa tête. La traque mènera les coureurs jusqu'à {l1}, et vers un secret que la région préférerait oublier."],
 accroche:[
  "À {l0}, {comm} cloue une prime sur la porte de l'auberge : {rec} pour {proie}. La nuit dernière, la bête a emporté un berger.",
  "{Comm} reçoit les coureurs devant un enclos dévasté, à {l0}. Les traces sont bien trop grandes pour un loup.\nPrime : {rec}."],
 horloge:["La bête frappe une ferme isolée.","Elle s'en prend à un hameau entier.","La foule organise une battue qui tourne au massacre.","Elle change de territoire, ou met bas."],
 pistes:[
  {t:"Les traces",v:"Autour de {lieu}, les signes ne mentent pas : {signe}. Un jet standard groupé pour suivre la piste sans la perdre.",at:"faiblesse",obst:"epreuve"},
  {t:"Le vieux trappeur",v:"À {lieu} vit un chasseur qui a déjà affronté la créature. Il en garde une cicatrice et une haine tenace.",at:"allie",obst:"social"},
  {t:"Le repaire",v:"{Lieu} : des os, une odeur de fauve… et des chaînes. La bête n'est pas sauvage.",at:"preuve",renc:"facile"},
  {t:"L'appât",v:"À {lieu}, on peut tendre un piège : un appât, un terrain favorable. Le terrain lui-même mord ({danger}).",at:"passage",obst:"danger"}],
 climax:[
  {mode:"rituel",v:"À {l1}, {a} lâche la bête sur les coureurs et l'excite à chaque tour. Tant que le maître tient la laisse, elle ne fuit pas et ne recule pas.",opts:["Briser le lien : abattre le maître ou détruire l'instrument qui la commande.","Retourner la bête contre son dresseur (avec un point faible).","Fuir vers un terrain choisi d'avance (avec un accès secret)."]},
  {mode:"fuite",v:"La proie attire les coureurs sur son territoire, à {l1}. {A} observe de loin, prêt à achever les survivants.",opts:["Déclencher le piège préparé (premier tour avec avantage).","Diviser pour régner : un coureur attire la bête, les autres frappent le maître.","Se replier et revenir avec des renforts."]}],
 grains:["La bête protège ses petits : la tuer laisse une portée affamée dans les bois.","{Comm2} a créé la bête par accident, et veut surtout qu'on enterre l'affaire avec elle."]}
};

/* Grains de sable communs à tous les types */
const GRAINS=[
 "{Comm2} a menti sur un point essentiel : la paie promise n'existe pas.",
 "Un allié des coureurs travaille en secret pour {a}.",
 "{A} a raison sur un point, et le découvrir trouble la suite.",
 "Ce que l'on cherche a un effet secondaire fâcheux : celui qui le garde n'en dort plus.",
 "La victime n'est pas innocente.",
 "Une autre équipe a été engagée pour le même travail, et elle ne fait pas de quartier.",
 "Réussir la mission ruinera des gens qui n'ont rien demandé.",
 "La garde locale touche sa part : elle protégera le coupable.",
 "{Comm2} compte se débarrasser des coureurs une fois le travail fait.",
 "Le vrai danger n'est pas {a2}, mais ce qu'{il} retient encore."];

/* Le plan de l'antagoniste en campagne (compte à rebours sur plusieurs séances) */
const HORLOGE_CAMPAGNE=["{A} gagne l'appui de {F1}, par la ruse ou la peur.","Un lieu de la région tombe sous sa coupe.","Un allié des coureurs est éliminé.","Son plan aboutit : {o} est entre ses mains."];

/* Phrase de bascule quand un second type est croisé : il fournit le climax. */
const BASCULES={
 enquete:"Mais un détail cloche, et l'affaire tourne à l'enquête : quelqu'un ment depuis le début.",
 horreur:"Puis vient la nuit où {signe}, et plus rien n'est comme avant.",
 exploration:"La piste mène pourtant plus loin, vers des terres où personne n'a mis les pieds depuis des siècles.",
 casse:"Pour en finir, il faudra pourtant monter un vol en règle, sous le nez de gardiens bien éveillés.",
 escorte:"Il faudra bientôt mettre quelqu'un à l'abri, et lui faire traverser un pays hostile.",
 siege:"Et l'ennemi arrive plus tôt que prévu : il faudra tenir jusqu'à l'aube.",
 intrigue:"Derrière tout cela se joue une partie de pouvoir entre {F1} et {F2}.",
 chasse:"Et dans les bois rôde {proie}, qu'il faudra bien affronter."
};

/* Inspirations : forme et ambiance d'une œuvre connue, transposées dans le thème ; jamais son histoire ni ses personnages.
   adn = consigne au Conteur ; synopsis/accroche remplacent ceux du type ; piste remplace la première piste ; climax remplace le climax. */
const INSPI={
 huisclos:{g:"enquete",nom:"Huis clos meurtrier",ref:"Ils étaient dix, d'Agatha Christie",
  adn:"Un groupe d'invités coupés du monde, un mort par nuit, et chacun soupçonne tout le monde. Fais tomber les suspects un à un.",
  accroche:["Une invitation sans signature attend les coureurs à {l0} : un séjour à {l1}, tous frais payés, et {rec} pour « un service discret ». Les autres invités ont reçu la même lettre."],
  synopsis:["Invités à {l1} par un hôte qui ne se montre jamais, les coureurs et une poignée d'inconnus se retrouvent coupés du monde. Le premier mort tombe dès la première nuit. Chacun cache une faute ancienne, et quelqu'un a décidé de les faire payer un par un."],
  climax:{mode:"rituel",v:"La dernière nuit à {l1} : {a} se dévoile parmi les survivants et achève sa liste. Il reste 3 tours avant la prochaine victime, peut-être un coureur.",opts:["Démasquer le coupable avec les preuves réunies : les autres invités se retournent contre lui.","Protéger la victime désignée (arts du mouvement pour s'interposer).","Retourner son propre piège contre l'assassin."]}},
 communaute:{g:"enquete",nom:"Crimes dans une communauté fermée",ref:"Le Nom de la rose, d'Umberto Eco",
  adn:"Une communauté repliée, des règles qu'on ne discute pas, un savoir interdit au centre. Les réponses viennent par énigmes.",
  accroche:["{Comm} reçoit les coureurs à la porte de {l0}, en baissant la voix : deux morts en une semaine, et la communauté refuse toute aide extérieure. Ils entreront comme simples visiteurs.\nPaie : {rec}."],
  synopsis:["Dans la communauté close de {l0}, les morts se succèdent, et tous avaient approché {o}. {Comm} fait venir les coureurs à condition qu'ils respectent les règles du lieu. Ceux qui gardent le secret préféreraient tout brûler plutôt que de le livrer."],
  climax:{mode:"rituel",v:"{A} met le feu à {l1} pour que le savoir interdit disparaisse avec {lui}. Les flammes gagnent : 4 tours avant que tout s'effondre.",opts:["Sauver {o2} des flammes (arts du mouvement, 1d8 dégâts en cas d'échec).","Arracher des aveux au coupable avant qu'il ne périsse.","Évacuer les innocents (un par tour)."]}},
 strangerthings:{g:"enquete",nom:"Disparition de quartier et monde à l'envers",ref:"Stranger Things",
  adn:"Une petite communauté tranquille, une disparition, des voisins qui savent des bribes, puis le basculement brutal : de l'autre côté du réel, tout est inversé. Garde un ton d'aventure, avec des PNJ attachants.",
  accroche:["{Comm} attend les coureurs à {l0}, une photo de {p} à la main. Aucune nouvelle depuis deux nuits, pas un bruit, pas une trace. Depuis, les lampes grésillent chaque fois qu'on prononce son nom.\nPaie : {rec}."],
  synopsis:["À {l0}, la vie suivait son cours jusqu'à la disparition de {p}. Les lumières clignotent, les chiens hurlent, et un voisin jure avoir vu une porte qui n'existe pas. {Comm} cherche de l'aide là où personne ne la cherche. Derrière la porte, un autre monde, et {a} qui veut l'ouvrir en grand."],
  piste:{t:"La porte",v:"À {lieu}, l'air se plie. Une fissure s'ouvre la nuit sur un reflet sombre du monde. On peut y entrer… et en revenir, peut-être.",at:"passage",renc:"facile"},
  climax:{mode:"rituel",v:"À {l1}, {a} élargit la brèche entre les deux mondes. Ce qui vit de l'autre côté se presse contre elle : 4 tours avant qu'elle ne se referme plus jamais.",opts:["Refermer la brèche de l'intérieur (jet standard, un coureur reste en arrière un tour).","Ramener la personne disparue à travers la fissure.","Briser l'objet qui maintient le passage ouvert."]}},
 tintin:{g:"enquete",nom:"Grand reportage et piste internationale",ref:"Les Aventures de Tintin, d'Hergé",
  adn:"Un détail intrigant lance une enquête qui fait voyager : déguisements, filatures, rebondissements en série et méchants grandiloquents. Garde le rythme vif, le danger réel mais jamais glauque.",
  accroche:["Sur un marché de {l0}, un inconnu propose aux coureurs une somme folle pour un bibelot qu'ils viennent d'acheter. Le soir, leur chambre est fouillée. {Comm} les contacte le lendemain.\nPaie : {rec}."],
  synopsis:["Tout commence par un détail : un objet acheté sur un marché de {l0}, que trois inconnus veulent racheter à tout prix. Le lendemain, l'un d'eux est retrouvé assommé. {Comm} met les coureurs sur la piste. Elle les mènera loin, jusqu'à {l1}, et jusqu'au réseau {dea}."],
  piste:{t:"La filature",v:"À {lieu}, un suspect mène les coureurs en bateau : déguisements, ruelles, faux rendez-vous. Le perdre, c'est perdre des jours.",at:"preuve",obst:"epreuve"}},
 alien:{g:"horreur",nom:"Huis clos face à une créature",ref:"Alien, de Ridley Scott",
  adn:"Un lieu fermé, une chose qui chasse un par un, des ressources qui s'épuisent, et quelqu'un qui savait. Montre la créature le moins possible.",
  accroche:["{Comm} engage les coureurs pour accompagner une cargaison jusqu'à {l1}, au départ de {l0}. Rien à signaler, promet-on. La caisse est scellée, et elle est tiède au toucher.\nPaie : {rec}."],
  synopsis:["En route vers {l1}, les coureurs partagent le voyage avec une cargaison qu'on leur a dit banale. Elle ne l'est pas. Quelque chose en est sorti, et chasse dans les recoins. L'aide est à des jours. Pire : quelqu'un à bord savait ce qu'on transportait."],
  piste:{t:"Les recoins",v:"{Lieu} : conduits, soutes, galeries trop étroites. La chose y circule. On y trouve ses mues, et ses restes de repas.",at:"faiblesse",renc:"facile"},
  climax:{mode:"fuite",v:"La chose est partout à la fois. {A} veut la ramener vivante et a saboté les issues. Il faut quitter {l1} : 4 tours avant que tout soit verrouillé.",opts:["Larguer la créature (sas, cale, falaise) avec un appât (arts du mouvement).","Démasquer le saboteur devant les survivants.","Tout faire sauter, et fuir avec ce qui reste."]}},
 thing:{g:"horreur",nom:"L'un de nous n'est plus humain",ref:"The Thing, de John Carpenter",
  adn:"Isolement, paranoïa, la confiance qui s'effrite. N'importe quel PNJ peut être la chose. Rends chaque test de vérité terrifiant.",
  accroche:["À {l0}, le dernier relais avant l'hiver, {comm} demande aux coureurs d'examiner un corps retrouvé dans la neige. Le lendemain, le corps a disparu, et un chien aussi.\nPaie : {rec}."],
  synopsis:["À {l0}, coupés de tout, les coureurs découvrent un corps qui n'est pas mort comme il devrait. Bientôt, certains se mettent à agir étrangement. La chose prend l'apparence de ceux qu'elle dévore, et plus personne ne peut prouver qu'il est encore lui-même."],
  piste:{t:"Le test",v:"À {lieu}, un vieux savoir donne un moyen de démasquer la chose : le feu, le sang, une question que seul le vrai connaîtrait.",at:"contre",obst:"epreuve"}},
 lovecraft:{g:"horreur",nom:"Horreur cosmique et savoir qui rend fou",ref:"L'Appel de Cthulhu, de H. P. Lovecraft",
  adn:"Le sentiment d'insignifiance : ce qui menace est immense, ancien, indifférent. Chaque vérité coûte un peu de raison (points d'esprit, p. 30). Victoire possible : retarder, jamais vaincre.",
  accroche:["{Comm} reçoit les coureurs à {l0}, livide, une liasse de notes griffonnées sur les genoux. Leur auteur s'est noyé la semaine dernière en souriant.\nPaie : {rec}."],
  synopsis:["À {l0}, les rêves de tout le monde se ressemblent depuis un mois : une cité engloutie, une voix qui appelle. {Comm} a trouvé dans les affaires d'un défunt des notes qui relient ces rêves à {l1}. {A} sait ce qui s'y prépare, et en veut sa part."],
  climax:{mode:"rituel",v:"À {l1}, sous un ciel qui n'a plus la bonne couleur, {a} récite les derniers versets. Quelque chose d'immense répond. Il reste 4 tours ; chaque tour regardé en face coûte 1d4 points d'esprit.",opts:["Interrompre la récitation : la voix de l'officiant doit se taire.","Détruire l'idole ou le livre (contre-mesure : automatique).","Fuir sans se retourner, et brûler toutes les notes."]}},
 indiana:{g:"exploration",nom:"Course au trésor et rival sans scrupules",ref:"Les Aventuriers de l'arche perdue",
  adn:"Course-poursuite, pièges mortels, rivalité mesquine : le rival triche, vole, s'allie à pire que lui. Chaque scène se termine sur un danger immédiat.",
  synopsis:["{O} a disparu il y a des siècles quelque part dans {l1}. Les coureurs ont un fragment de carte ; {a} a l'autre, une petite armée et aucun scrupule. Pièges, énigmes de bâtisseurs oubliés, et un trésor que certains feraient mieux de ne pas toucher."],
  piste:{t:"La poursuite",v:"Sur la route de {lieu}, les hommes du rival rattrapent les coureurs : chariots, montures, ponts de corde. Celui qui garde la carte garde l'avance.",at:"passage",renc:"facile"}},
 centre:{g:"exploration",nom:"Descente vers un monde perdu",ref:"Voyage au centre de la Terre, de Jules Verne",

dracula:{g:"horreur",nom:"Le seigneur ancien qui vient en ville",ref:"Dracula, de Bram Stoker",
 adn:"Gothique : un aristocrate séduisant et millénaire, des proies qui dépérissent, une chasse menée avec du savoir ancien, de l'ail et du courage.",
 accroche:["À {l0}, une jeune femme s'affaiblit chaque nuit, et deux marques rouges ornent son cou. {Comm} supplie les coureurs. Le nouveau voisin, arrivé avec ses caisses de terre, ne sort jamais le jour.\nPaie : {rec}."],
 synopsis:["Un seigneur ancien s'est installé à {l0}. Il séduit, il boit, il transforme. Pour l'arrêter, il faudra trouver ses refuges, détruire sa terre natale et le surprendre au jour. {A} le sert, ou le croit."],
 piste:{t:"Les caisses de terre",v:"À {lieu} sont cachées les caisses de terre où dort le maître. Chaque caisse détruite le prive d'un refuge.",at:"contre",renc:"facile"}},
mouche:{g:"horreur",nom:"L'expérience qui transforme son créateur",ref:"La Mouche, de David Cronenberg",
 adn:"Horreur du corps : un génie, une expérience réussie… presque. La transformation est lente, tragique, et l'antagoniste reste un peu humain jusqu'au bout.",
 accroche:["{Comm} s'inquiète pour un savant de {l0} : brillant, euphorique depuis sa dernière expérience, il ne dort plus, mange du sucre à la poignée, et sa peau change.\nPaie : {rec}."],
 synopsis:["Une expérience a réussi au-delà de toute espérance, puis quelque chose s'est mêlé au processus. {A} change, jour après jour : plus de force, plus de vitesse, et de moins en moins d'humanité. Faut-il sauver ce qui en reste, ou arrêter la créature avant qu'elle ne recommence sur d'autres ?"],
 climax:{mode:"otage",v:"À {l1}, au terme de sa transformation, {a} veut fusionner avec quelqu'un pour redevenir « entier ». {Il} tient sa victime près de la machine : 3 tours.",opts:["Détruire la machine plutôt que de combattre la créature.","Parler à ce qui reste d'humain en {lui} (jet standard avec un moyen de pression).","Arracher la victime à temps (arts du mouvement)."]}},
/* ---------- Exploration ---------- */
mondeperdu:{g:"exploration",nom:"Le plateau où survivent des bêtes disparues",ref:"Le Monde perdu, d'Arthur Conan Doyle",
 adn:"Expédition scientifique, plateau isolé, créatures d'un autre âge. L'émerveillement compte autant que le danger, et le retour est le vrai défi.",
 accroche:["Un savant ridiculisé, {comm}, affirme qu'au-delà de {l0} survivent des bêtes disparues depuis des millénaires. Il recrute les coureurs pour en ramener la preuve.\nPaie : {rec}."],
 synopsis:["Au sommet d'un plateau inaccessible, le temps s'est arrêté : bêtes géantes, peuples oubliés, végétation démesurée. L'expédition y monte… et le seul chemin du retour s'effondre derrière elle. {A} veut ramener une créature vivante, à n'importe quel prix."],
 piste:{t:"Le plateau",v:"Sur {lieu}, une créature d'un autre âge broute, chasse ou garde son nid. Un peuple oublié observe les intrus de loin.",at:"allie",renc:"equilibre"}},
tombraider:{g:"exploration",nom:"Pillage acrobatique de tombeaux",ref:"Tomb Raider",
 adn:"Acrobaties, énigmes mécaniques, pièges en série : chaque salle est un parcours d'obstacles. Le pilleur rival est armé, et le tombeau ne se laisse pas faire.",
 accroche:["{Comm} fournit les coureurs en cordes, grappins et torches : {o} repose au fond de {l1}, et une organisation rivale y descend déjà.\nPaie : {rec}."],
 synopsis:["{O} repose au fond d'un tombeau conçu pour tuer les voleurs. Sauts dans le vide, plafonds qui descendent, mécanismes millénaires : chaque salle est une épreuve. {A} et ses mercenaires sont sur la même piste."],
 piste:{t:"La salle des mécanismes",v:"{Lieu} : un parcours d'obstacles (passerelles, leviers, lames). Trois jets d'arts du mouvement ; chaque échec coûte 1d8 et un objet perdu.",at:"passage",obst:"danger"}},
licorne:{g:"exploration",nom:"Trois parchemins et le trésor d'un ancêtre",ref:"Le Secret de la Licorne, d'Hergé",
 adn:"Chasse au trésor en trois morceaux, rivaux louches, maquettes et documents anciens. L'aventure mène d'une ville à la mer, ton enjoué.",
 accroche:["Les coureurs achètent par hasard un vieil objet à {l0}. Dedans, un parchemin : le premier de trois. Le soir même, des inconnus tentent de s'en emparer. {Comm} sait où chercher les deux autres.\nPaie : {rec}."],
 synopsis:["Un ancêtre a caché son trésor et dispersé trois parchemins qui, réunis, en donnent l'emplacement. {A} possède déjà l'un des trois, et ne reculera devant rien pour les autres. Le trésor se trouve à {l1}, ou plutôt pas exactement là où tout le monde croit."],
 piste:{t:"Le deuxième parchemin",v:"À {lieu}, le deuxième parchemin dort dans un objet ancien. Des voleurs le cherchent aussi.",at:"levier",renc:"facile"}},
planete:{g:"exploration",nom:"Le monde où l'humain est la bête",ref:"La Planète des singes, de Pierre Boulle",
 adn:"Monde inversé : une société évoluée tient les humains (ou les coureurs) pour des bêtes. Choc culturel, procès, évasion, et une révélation finale qui retourne tout.",
 accroche:["Après une tempête, un naufrage ou un portail, les coureurs échouent près de {l0}. Ici, une autre espèce règne, et les humains sont chassés comme du gibier.\nPaie : survivre, et comprendre."],
 synopsis:["Dans ce pays, l'espèce dominante n'est pas la leur. Les coureurs sont capturés, étudiés, jugés. Pour s'enfuir, il faudra des alliés dans l'autre camp, et une vérité interdite que {a} protège : ce monde est peut-être le leur."],
 climax:{mode:"fuite",v:"Le procès tourne mal à {l1} : les coureurs doivent fuir avec la preuve de la vérité. {A} lance la chasse. 3 tours avant que les portes se ferment.",opts:["Fuir avec l'aide d'un allié de l'autre espèce.","Révéler la preuve en public : le doute paralyse les gardes.","Tout abandonner et disparaître dans la zone interdite."]}},
/* ---------- Casse ---------- */
lupin:{g:"casse",nom:"Gentleman cambrioleur et panache",ref:"Arsène Lupin, de Maurice Leblanc",
 adn:"Élégance, déguisements, cartes de visite laissées sur les lieux : le vol est un art, l'humiliation du riche une victoire. On prévient la victime, et on réussit quand même.",
 accroche:["{Comm} propose un défi aux coureurs : voler {o} à {a}, après l'avoir prévenu par lettre de la date et de l'heure.\nPaie : {rec}, et la gloire."],
 synopsis:["Voler {o}, c'est facile. Le voler après avoir annoncé le jour et l'heure, sous le nez de la police, c'est un art. {A} a mobilisé toutes ses gardes à {l1}. Les coureurs ont des masques, des complices… et une idée de génie."],
 piste:{t:"Le déguisement",v:"À {lieu}, se faire passer pour quelqu'un d'autre : un domestique, un policier, un invité. Il faut un costume, un accent, une histoire.",at:"passage",obst:"social"}},
inception:{g:"casse",nom:"Voler une idée dans un rêve",ref:"Inception, de Christopher Nolan",
 adn:"Rêves imbriqués : chaque niveau a ses règles, le temps s'y étire, et la cible a des défenses mentales armées. Ne pas oublier ce qui est réel.",
 accroche:["{Comm} propose aux coureurs un travail impossible : entrer dans les rêves {dea} et y voler, ou y planter, une idée. Un sorcier ou une machine les y conduira.\nPaie : {rec}."],
 synopsis:["Le butin n'est pas un objet : c'est un secret, enfoui dans l'esprit {dea}. Il faut descendre de rêve en rêve, chaque niveau plus instable, pendant que les défenses de la cible traquent les intrus. Et un membre de l'équipe porte ses propres fantômes."],
 climax:{mode:"rituel",v:"Au plus profond du rêve, à {l1}, le coffre mental de {a} s'ouvre, mais ses défenses déferlent et le rêve s'effondre : 4 tours avant le réveil forcé.",opts:["Ouvrir le coffre pendant que les autres tiennent (jet standard).","Provoquer le réveil synchronisé de toute l'équipe.","Planter l'idée au lieu de la voler : plus rapide, plus risqué."]}},
cerclerouge:{g:"casse",nom:"Le casse silencieux et la fatalité",ref:"Le Cercle rouge, de Jean-Pierre Melville",
 adn:"Silence, gestes précis, loyauté entre truands, et un flic obstiné. Peu de dialogues, beaucoup de tension. Tout le monde finit par payer.",
 accroche:["Un évadé, un ancien tireur d'élite et les coureurs se retrouvent liés par le hasard à {l0}. Un coup les attend : {o}, gardé à {l1}. Un policier tenace est déjà sur la piste.\nPaie : {rec}."],
 synopsis:["Un casse minutieux, presque sans un mot : {o} dort à {l1}. Les coureurs ont un plan parfait. Mais un policier obstiné les traque, et {a} vend tout le monde à tout le monde. Dans ce milieu, la loyauté se paie cher."],
 piste:{t:"Le tireur",v:"À {lieu} vit un ancien tireur hors pair, rongé par ses démons. Sans lui, le coup est impossible ; avec lui, il faut le tenir sobre.",at:"allie",obst:"social"}},
gardiens:{g:"casse",nom:"Une bande de marginaux et un objet trop puissant",ref:"Les Gardiens de la Galaxie, de James Gunn",
 adn:"Bande de ratés attachants, répliques qui fusent, musique entraînante. Un vol qui tourne mal, un objet trop puissant, et une famille de fortune qui se forme.",
 accroche:["Les coureurs ont volé {o} pour {comm}, à {l0}. Le problème : tout le monde le veut, y compris {a}, qui a mis leur tête à prix.\nPaie : {rec}, s'ils survivent."],
 synopsis:["Un petit vol de rien du tout… sauf que {o} pourrait raser un monde. Les coureurs se retrouvent pourchassés, emprisonnés, obligés de faire équipe avec pire qu'eux. {A} veut l'objet, et ne négocie jamais."],
 climax:{mode:"rituel",v:"À {l1}, {a} brandit {o2} et s'apprête à libérer sa puissance : 4 tours. Seul, aucun coureur ne pourrait le tenir.",opts:["Toucher l'objet tous ensemble : chacun encaisse 1d8, mais le pouvoir est partagé et contenu.","Distraire l'adversaire par n'importe quel moyen, même ridicule (une danse, un défi, une insulte).","Lui arracher l'objet au vol."]}},
/* ---------- Escorte ---------- */
terminator:{g:"escorte",nom:"Protéger quelqu'un d'un tueur qu'on n'arrête pas",ref:"Terminator, de James Cameron",
 adn:"Poursuite implacable : le tueur ne dort pas, ne ressent rien, ne s'arrête jamais. On ne le bat pas : on le ralentit, on l'évite, on le piège.",
 accroche:["{Comm} surgit devant les coureurs à {l0}, haletant : {p} va être tué cette nuit par quelque chose qui ne s'arrêtera jamais. Il faut fuir, maintenant.\nPaie : {rec}."],
 synopsis:["Un tueur venu d'ailleurs traque {p}, pour une raison qui ne s'éclairera que plus tard. Il encaisse les balles, les chutes, le feu, et revient toujours. Les coureurs doivent protéger leur protégé jusqu'à {l1}, où un moyen d'en venir à bout existe peut-être. {A} a envoyé la machine."],
 climax:{mode:"fuite",v:"La machine, mutilée mais debout, rattrape le groupe à {l1}. Elle ne ralentit pas, ne recule pas. Il faut l'écraser, la fondre ou la broyer.",opts:["L'attirer dans une presse, une fonderie, un gouffre (arts du mouvement).","Tenir 3 tours pour que la personne escortée atteigne la sortie.","Retourner ses armes contre elle (avec un point faible)."]}},
et:{g:"escorte",nom:"Ramener chez elle une créature venue d'ailleurs",ref:"E.T. l'extra-terrestre, de Steven Spielberg",
 adn:"Tendresse et émerveillement : une créature étrange, perdue et douce, que les adultes veulent capturer. La protéger, la cacher, l'aider à rentrer chez elle.",
 accroche:["Dans une remise de {l0}, les coureurs découvrent une créature étrange, perdue, terrifiée. Elle montre le ciel du doigt. Dès le lendemain, des hommes en uniforme fouillent le quartier.\nPaie : aucune, sinon la bonne action."],
 synopsis:["Une créature venue d'ailleurs s'est égarée. Elle doit atteindre {l1} avant que son peuple ne reparte, et elle s'affaiblit chaque jour. {A} et ses hommes veulent la capturer pour l'étudier. Les coureurs n'ont que leur ruse, et quelques gamins du quartier."],
 piste:{t:"Le signal",v:"À {lieu}, on peut bricoler de quoi appeler les siens. Il faut des pièces, du temps, et ne pas se faire repérer.",at:"contre",obst:"epreuve"}},
starwars:{g:"escorte",nom:"Livrer des plans volés à travers l'Empire",ref:"Star Wars, de George Lucas",
 adn:"Space opera : une princesse ou un message, un vieux sage, une évasion audacieuse, une course-poursuite, et un seigneur noir qui étrangle les incompétents.",
 accroche:["Un droïde, un messager ou un parchemin arrive jusqu'aux coureurs à {l0}, avec un message : des plans volés doivent atteindre {l1}. Derrière, les troupes {dea} débarquent déjà.\nPaie : {rec}, et l'espoir."],
 synopsis:["Des plans volés révèlent la faille d'une arme terrible. Ils doivent rejoindre {l1}, où la rébellion attend. {A} a lancé toutes ses troupes à la poursuite des coureurs. Il faudra une cantina louche, un pilote douteux et une évasion spectaculaire."],
 piste:{t:"Le pilote douteux",v:"À {lieu}, un contrebandier vantard possède le transport le plus rapide du coin. Il a des dettes, un associé bourru et pas de principes. Enfin, presque.",at:"passage",obst:"social"}},
chevauchee:{g:"escorte",nom:"La diligence et ses passagers disparates",ref:"La Chevauchée fantastique, de John Ford",
 adn:"Huis clos roulant : des passagers que tout oppose (le notable, la paria, le joueur, le hors-la-loi) traversent un territoire hostile. Les préjugés tombent sous les flèches.",
 accroche:["{Comm} cherche des escortes pour une diligence qui part de {l0} vers {l1}. Les passagers se détestent déjà. Le territoire est en guerre.\nPaie : {rec}."],
 synopsis:["Une voiture, six passagers et un territoire en feu. Chacun cache un secret, un crime ou une honte. {A} attend le convoi quelque part sur la route. Arriver à destination demandera de faire confiance à ceux qu'on méprisait au départ."],
 piste:{t:"Le relais pillé",v:"À {lieu}, le relais de poste a été attaqué. Plus de chevaux frais, et un survivant qui sait où l'ennemi attend.",at:"preuve",renc:"facile"}},
odyssee:{g:"escorte",nom:"Le long retour, île après île",ref:"L'Odyssée, d'Homère",
 adn:"Épopée de retour : chaque étape est un monde, une tentation, un monstre ou un dieu capricieux. La ruse vaut mieux que la force, et la patience mieux que la ruse.",
 accroche:["Les coureurs veulent rentrer chez eux, à {l1}. {Comm} leur offre un passage, mais les dieux, les vents ou le hasard ont d'autres projets.\nPaie : rentrer."],
 synopsis:["Le chemin du retour est long et semé d'épreuves : îles enchantées, monstres, tentations qui font oublier pourquoi l'on voyage. Chaque escale coûte quelque chose. Et chez eux, {a} s'est installé en maître."],
 piste:{t:"L'île des tentations",v:"À {lieu}, tout est doux : festins, chants, oubli. Chaque coureur doit réussir un jet standard ou vouloir rester. Un sage du lieu sait comment repartir.",at:"contre",obst:"epreuve"}},
/* ---------- Siège / survie ---------- */
assaut2:{g:"siege",nom:"Un poste isolé encerclé par une bande",ref:"Assaut, de John Carpenter",
 adn:"Nuit sans fin, poste de garde presque vide, ennemi sans visage qui attaque en silence. Flics, prisonniers et passants doivent s'allier pour voir l'aube.",
 accroche:["Les coureurs font halte dans un poste presque vide, à {l0}. Un fugitif s'y réfugie, poursuivi. Puis le courant tombe, et les premiers projectiles silencieux brisent les vitres.\nPaie : survivre."],
 synopsis:["Un poste isolé, une poignée d'occupants, et dehors une bande qui ne parle pas, ne recule pas, et veut l'homme réfugié à l'intérieur. Prisonniers et gardiens devront se battre côte à côte. {A} dirige l'assaut depuis l'ombre."]},
zoulou:{g:"siege",nom:"Une poignée contre une armée",ref:"Zoulou, de Cy Endfield",
 adn:"Disproportion écrasante : une centaine de défenseurs contre des milliers. Discipline, sacrifices et respect mutuel entre adversaires.",
 accroche:["Un messager arrive à {l0} : une armée immense marche sur le poste, et la retraite est impossible. {Comm} décide de tenir.\nPaie : {rec}, et l'honneur."],
 synopsis:["Une poignée de défenseurs, des murs de sacs et de caisses, et face à eux une armée entière qui arrive par vagues. Il faudra tenir une nuit et un jour. {A} commande l'assaut, et respecte ceux qui résistent."]},
mortsvivants:{g:"siege",nom:"La maison barricadée contre les morts",ref:"La Nuit des morts-vivants, de George A. Romero",
 adn:"Huis clos de survie : une maison, des planches, des inconnus qui se disputent, et dehors des morts toujours plus nombreux. Le danger vient aussi de l'intérieur.",
 accroche:["Poursuivis par des silhouettes titubantes, les coureurs se réfugient dans une ferme de {l0}. D'autres survivants sont déjà là, et ils ne sont pas d'accord sur la marche à suivre.\nPaie : survivre jusqu'au matin."],
 synopsis:["Les morts se relèvent et marchent. Une poignée de survivants barricade une maison isolée. Dehors, leur nombre grossit d'heure en heure ; dedans, la peur divise le groupe. {A} n'est peut-être pas celui qu'on croit."],
 climax:{mode:"fuite",v:"Les barricades cèdent à {l1}. Les morts envahissent tout. 3 tours pour atteindre le véhicule, la cave ou le toit.",opts:["Courir vers le véhicule (arts du mouvement groupé).","S'enfermer à la cave et attendre l'aube.","Créer un feu pour repousser la masse, au risque de tout brûler."]}},
jurassic:{g:"siege",nom:"Le parc dont les bêtes se libèrent",ref:"Jurassic Park, de Steven Spielberg",
 adn:"Émerveillement puis panique : un parc magnifique, des bêtes ressuscitées, une panne, et soudain les clôtures ne tiennent plus. La nature trouve toujours un chemin.",
 accroche:["{Comm} invite les coureurs à visiter son parc extraordinaire, à {l0}, avant l'ouverture. Les créatures sont stupéfiantes. Puis l'orage éclate et le courant tombe.\nPaie : {rec}."],
 synopsis:["Un parc rempli de créatures que personne n'aurait dû ramener à la vie. Une trahison coupe le courant, les enclos s'ouvrent. Les coureurs doivent survivre jusqu'au poste central et rétablir le contrôle, pendant que {a} s'enfuit avec ce qu'{il} a volé."],
 piste:{t:"L'enclos ouvert",v:"À {lieu}, une clôture est tombée. Quelque chose de très grand a laissé des traces, et quelque chose de petit chasse en meute.",at:"faiblesse",renc:"equilibre"}},
troopers:{g:"siege",nom:"Des vagues d'insectes géants",ref:"Starship Troopers, de Paul Verhoeven",
 adn:"Guerre totale et propagande : des soldats jeunes et naïfs, des insectes par milliers, des ordres absurdes. Action excessive, satire en filigrane.",
 accroche:["{Comm} envoie les coureurs tenir un avant-poste à {l0}, au milieu d'un territoire infesté. Les communiqués promettent une victoire facile. Les premiers cris arrivent avant le crépuscule.\nPaie : {rec}."],
 synopsis:["Une colonie d'insectes géants ravage la région. Les coureurs défendent un avant-poste que la propagande dit imprenable. Les vagues arrivent par milliers, de plus en plus intelligentes. Quelque part, un esprit dirige la ruche, et {a} en sait plus qu'{il} ne l'avoue."],
 climax:{mode:"rituel",v:"La ruche lance son assaut total sur {l1}. Au cœur de la marée d'insectes, l'esprit de la ruche commande : 4 tours.",opts:["Atteindre et abattre l'esprit de la ruche : la marée se désorganise.","Faire sauter le passage par où ils arrivent.","Tenir jusqu'à l'arrivée du transport (chaque tour compte)."]}},
titanic:{g:"siege",nom:"Le naufrage du navire insubmersible",ref:"Titanic, de James Cameron",
 adn:"Luxe et naufrage : un navire réputé indestructible, des classes sociales cloisonnées, et quelques heures pour survivre quand il s'enfonce. Il n'y a pas assez de canots.",
 accroche:["Les coureurs embarquent sur le plus grand navire jamais construit, au départ de {l0}. {Comm} leur a confié une mission discrète à bord. La troisième nuit, un choc sourd secoue la coque.\nPaie : {rec}."],
 synopsis:["Un navire insubmersible, des passagers de toutes conditions, et une nuit glacée. Le choc a ouvert la coque, et il n'y a pas de canots pour tout le monde. {A} veut sauver {o}, et sa propre peau, quitte à sacrifier les autres."],
 climax:{mode:"fuite",v:"Le navire se dresse vers le ciel. {A} a pris le dernier canot et tient une arme. 3 tours avant que le pont ne disparaisse sous l'eau glacée.",opts:["Atteindre le canot et faire monter les plus faibles.","Se servir d'une épave flottante pour tenir jusqu'aux secours (1d8 par tour de froid).","Ouvrir les grilles de la troisième classe avant qu'il soit trop tard."]}},
/* ---------- Intrigue ---------- */
dune:{g:"intrigue",nom:"La planète-épice et la trahison d'une maison",ref:"Dune, de Frank Herbert",
 adn:"Grande politique et désert mortel : une ressource dont dépend tout un empire, une maison trahie, un peuple du désert qui attend un prophète.",
 accroche:["{Comm} vient de recevoir le gouvernement de {l0}, la terre qui produit la seule ressource que tout l'empire convoite. Il engage les coureurs : il sent le piège.\nPaie : {rec}."],
 synopsis:["{F1} reçoit la garde d'une terre aride mais vitale, à la place de {F2}, son ennemi juré. C'est un cadeau empoisonné : un traître est déjà dans la maison, et {a} prépare l'assaut. Le seul espoir vient du peuple du désert, qu'il faudra gagner."],
 piste:{t:"Le peuple du désert",v:"À {lieu}, le peuple du désert observe les étrangers. Gagner son respect demande une épreuve, un duel ou une parole tenue.",at:"allie",obst:"epreuve"}},
mousquetaires:{g:"intrigue",nom:"Les ferrets de la reine",ref:"Les Trois Mousquetaires, d'Alexandre Dumas",
 adn:"Cape et épée : amitié, panache, duels, chevauchées. Un cardinal manipulateur, une espionne fatale, et l'honneur d'une reine à sauver.",
 accroche:["Une dame de compagnie aborde les coureurs à {l0}, le visage voilé : la reine a offert un bijou à un amant étranger, et le roi exige de la voir le porter au bal, dans quatre jours.\nPaie : {rec}, et la gratitude royale."],
 synopsis:["Pour perdre la reine, {a} a tout prévu : le bijou est loin, le bal est dans quatre jours, et ses espions guettent chaque route. Les coureurs devront chevaucher, se battre et déjouer une espionne aussi belle que mortelle."],
 piste:{t:"L'espionne",v:"À {lieu}, une femme fatale au service de l'adversaire attend les coureurs avec un sourire et un poignard. Elle peut trahir son maître… ou eux.",at:"levier",obst:"social"}},
housecards:{g:"intrigue",nom:"L'ascension politique sans scrupules",ref:"House of Cards",
 adn:"Politique froide : chaque PNJ est un pion, chaque faveur une dette. L'antagoniste parle au public, sourit, et écrase quiconque se met sur son chemin.",
 accroche:["{Comm} engage les coureurs pour une tâche discrète : récupérer un document compromettant à {l0}. Le document vise {a}, la personne la plus aimable et la plus dangereuse de la ville.\nPaie : {rec}."],
 synopsis:["{A} gravit les échelons du pouvoir avec un sourire et un carnet de dettes. Ceux qui le gênent tombent : scandales, accidents, trahisons. Les coureurs se retrouvent entre ses mains, utiles… jusqu'au jour où ils ne le seront plus."],
 climax:{mode:"marche",v:"À {l1}, au sommet de sa gloire, {a} offre aux coureurs un poste, une fortune et l'oubli de leurs crimes, en échange du dernier document qui pourrait le perdre.",opts:["Accepter, et devenir ses complices.","Révéler le document au moment où il triomphe.","Le faire tomber par ses propres méthodes : chantage, rumeur, alliances."]}},
spacejam:{g:"intrigue",nom:"Un match pour sa liberté",ref:"Space Jam",

/* ==========================================================================
   Boîte à outils du Conteur : éléments imposés.
   Un élément n'est jamais un simple décor : il devient le cœur mécanique de l'aventure.
   - f : trois fonctions possibles (ce que l'élément FAIT dans l'histoire), au choix du tirage ;
   - regle : une contrainte de jeu concrète, valable toute la partie ;
   - zones : quatre lieux tirés de l'élément ; les trois premiers servent aux pistes, le dernier au climax ;
   - climax : ce que fait l'élément pendant l'affrontement final ;
   - fin : le dernier cran du compte à rebours, si personne n'agit.
   Repères : {elt} « le phare », {Elt}, {delt} « du phare », {aelt} « au phare ».
   ========================================================================== */

/* Exploration / pillage pur : la dette */
GENRES.exploration.accroche.push("Les coureurs doivent une somme folle à {comm}, et le terme tombe dans sept jours. Une seule issue : piller {l1} avant tout le monde.\nDette : {rec}, à rembourser en entier, ou c'est la prison (ou pire).");
GENRES.exploration.synopsis.push("Les coureurs sont criblés de dettes, et {comm} ne fait plus crédit. Il leur offre une chance : piller {l1}, que personne n'a fouillé depuis des siècles, et partager la prise. {A} a eu la même idée, et compte bien rembourser ses propres créanciers avec la part des autres.");
/* Siège / survie face à une force naturelle */
GENRES.siege.synopsis.push("Ce n'est pas une armée qui menace {l0}, mais le monde lui-même : une marée qui monte, une crue, une tempête de sable, et ce qu'elle charrie. Il faudra tenir jusqu'au matin, vague après vague. {A} a ses raisons de souhaiter que la ville ne voie pas l'aube : {sec}");
GENRES.siege.horloge=["La première vague emporte les défenses extérieures.","Les vivres et l'eau potable sont souillés.","Les habitants se battent entre eux pour les places au sec.","L'assaut final : la vague la plus haute, ou l'ennemi en personne."];
/* Escorte / fuite en avant : quelque chose qui avance tout seul */
GENRES.escorte.synopsis.push("Il faut accompagner une chose qui avance toute seule et ne s'arrêtera pas : un convoi sans conducteur, une machine, un pèlerinage en transe. Les coureurs ne la dirigent pas : ils la protègent, la suivent, et découvrent en route vers quoi elle va. {A} veut qu'elle n'arrive jamais.");

const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const cap=s=>s?s.charAt(0).toUpperCase()+s.slice(1):s;
function R(n){if(n<=1)return 0;const a=new Uint32Array(1);crypto.getRandomValues(a);return a[0]%n}
const pick=a=>a[R(a.length)];
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=R(i+1);[a[i],a[j]]=[a[j],a[i]]}return a}
const de=n=>R(n)+1;
/* "2d6+1", "d8", "1d4+1d8" → {total, detail} */
function lancer(f){
  let tot=0;const det=[];
  String(f).replace(/\s/g,"").split(/(?=[+-])/).forEach(t=>{
    const sg=t[0]==="-"?-1:1;const u=t.replace(/^[+-]/,"");const m=u.match(/^(\d*)d(\d+)$/i);
    if(m){const n=+(m[1]||1),s=+m[2];for(let i=0;i<n;i++){const v=de(s);tot+=sg*v;det.push(v)}}
    else if(u){tot+=sg*(+u);det.push((sg<0?"−":"+")+u)}
  });
  return {total:tot,detail:det};
}
const fmtJet=(f,r)=>`${f} → <b>${r.total}</b>${r.detail.length>1?` <span class="muted">(${r.detail.join(", ")})</span>`:""}`;
function toast(m){const t=$("toast");t.textContent=m;t.classList.add("on");clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove("on"),2200)}
const uid=()=>Date.now().toString(36)+R(1e6).toString(36);
/* articles : de(x) / a(x) */
function deX(x){if(/^le /i.test(x))return "du "+x.slice(3);if(/^les /i.test(x))return "des "+x.slice(4);if(/^des /i.test(x))return "de "+x.slice(4);if(/^[aeiouyéèêâîôœ]/i.test(x))return "d'"+x;return "de "+x}
function aX(x){if(/^le /i.test(x))return "au "+x.slice(3);if(/^les /i.test(x))return "aux "+x.slice(4);return "à "+x}

/* Menace d'une créature : moyenne géométrique de ce qu'elle inflige et de ce qu'elle encaisse face à un coureur de niveau 1
   (attaque d20 + 1, défense d20 + 2), corrigée par ses capacités ; 1 = un orque. Estimation maison. */
const CAPM={"Projection de flammes":2,"Frénésie":1.15,"Éventration":1.15,"Paralysie":1.15,"Drain de vie":1.1,"Malédiction":1.1,"Balayage":1.1,"Double illusoire":1.1,"Carapace":1.05,"Vengeance acide":1.05};

function menaceBrute(c){const na=typeof c.na==="string"?moyDe(c.na):(c.na||1);const cl=x=>Math.min(.95,Math.max(.05,x));
  const off=na*moyDe(c.dmg||"d6")*cl((c.att-3)/20),def=(c.pv||1)/cl((22-c.def)/20);let k=1;(c.cap||[]).forEach(x=>k*=CAPM[x]||1);return Math.sqrt(off*def)*k}

/* Choisit une rencontre. Renvoie {lead,troupe,diff} ; les effectifs sont recalculés à l'affichage selon le groupe. */
function tirerRencontre(diff,opt={}){
  const B=budget(diff);const pool=(opt.pool||poolTheme()).map(r=>({r,c:resoudre(r)})).filter(x=>x.c);
  const m=x=>menace(x.c);
  if(opt.lead){return {lead:opt.lead,troupe:pickTroupe(pool,B,menace(resoudre(opt.lead))),diff}}
  const opts=[];
  const solos=pool.filter(x=>m(x)>=.7*B&&m(x)<=1.4*B);if(solos.length)opts.push(()=>({lead:pick(solos).r,troupe:null,diff}));
  const chefs=pool.filter(x=>m(x)>=.3*B&&m(x)<.75*B&&x.c.dv>=3);
  if(chefs.length)opts.push(()=>{const l=pick(chefs);return {lead:l.r,troupe:pickTroupe(pool.filter(x=>x!==l),B,m(l)),diff}});
  let troupes=pool.filter(x=>m(x)<=.5*B&&m(x)>=B/12);if(!troupes.length)troupes=pool.filter(x=>m(x)<=.5*B).sort((x,y)=>m(y)-m(x)).slice(0,2);if(troupes.length)opts.push(()=>({lead:null,troupe:pick(troupes).r,diff}));
  if(!opts.length){const plusFaible=pool.slice().sort((a,b)=>m(a)-m(b))[0];return {lead:plusFaible.r,troupe:null,diff}}
  return pick(opts)();
}
function pickTroupe(pool,B,ml){const reste=B-ml;if(reste<1)return null;const ok=x=>menace(x.c)<=Math.max(1,.35*B);let c=pool.filter(x=>ok(x)&&menace(x.c)>=reste/8);if(!c.length)c=pool.filter(ok).sort((x,y)=>menace(y.c)-menace(x.c)).slice(0,2);return c.length?pick(c).r:null}

  if(!sp)return [];const B=budget(sp.diff);const out=[];let ml=0;
  if(sp.lead){const c=resoudre(sp.lead);if(c){out.push({c,n:1});ml=menace(c)}}
  if(sp.troupe){const c=resoudre(sp.troupe);if(c){const n=Math.max(sp.lead?0:1,Math.min(sp.lead?8:12,Math.round((B-ml)/menace(c))));if(n>0)out.push({c,n})}}
  return out;
}

   return `<div class="renc">${texteRencontre(sp)}<span style="flex:1"></span><button class="mini" data-act="vers-combat" data-where="${esc(where)}">→ Combat</button><span class="small" style="flex-basis:100%">Avec les atouts : ${[1,2,3].map(k=>`${k} atout${k>1?"s":""} ${badge(nv[k])}`).join(" · ")}. ${nv[0]==="mortel"?"Sans aucun atout : ruse, sabotage ou fuite.":""}</span></div>`}const mort=e.length&&niveauDe(e.reduce((s,x)=>s+menace(x.c)*x.n,0))==="mortel";

function exemple(){const pool=poolTheme().map(r=>resoudre(r)).filter(Boolean);const B=budget("equilibre");

function C(){return P().combat}

function proposer(){const d=PROP.diff||P().diff;const vus=new Set();const out=[];
  for(let k=0;k<30&&out.length<3;k++){const sp=tirerRencontre(d);const cle=JSON.stringify([sp.lead,sp.troupe]);if(vus.has(cle))continue;vus.add(cle);out.push(sp)}PROP.liste=out}
function ajouterCombat(c,n){
  const cb=C();n=Math.max(1,n||1);
  const caps=c.cap.slice();
  const g={id:uid(),nom:c.nom,dv:c.dv,d:c.d,att:c.att,def:c.def,pvMax:c.pv,na:c.na,dmg:c.dmg,cap:caps,pv:Array(n).fill(c.pv),cible:0,etats:[],vil:vileniePar(c),flamme:-9,surplus:n>1};
  cb.grp.push(g);journal(`${n>1?n+" × ":""}${c.nom} entre${n>1?"nt":""} en scène.`);
  if(caps.includes("Malédiction"))journal(`Malédiction de ${c.nom} : le groupe doit dépenser 2 dés d'héroïsme sans effet.`);
  sauver();
}
function journal(m){const cb=C();cb.log.unshift((cb.tour?`T${cb.tour} · `:"")+m);cb.log=cb.log.slice(0,40)}
function vivants(g){return g.pv.filter(v=>v>0).length}
function frapper(g,dmg){
  if(!(dmg>0))return;let i=g.pv[g.cible]>0?g.cible:g.pv.findIndex(v=>v>0);if(i<0)return;const tues=[];
  while(dmg>0&&i>=0){const v=g.pv[i];const prend=Math.min(v,dmg);g.pv[i]=v-prend;dmg-=prend;if(g.pv[i]<=0)tues.push(i+1);
    if(!g.surplus)break;i=g.pv.findIndex(v=>v>0)}
  if(g.pv[g.cible]<=0){const n=g.pv.findIndex(v=>v>0);if(n>=0)g.cible=n}
  if(tues.length)journal(`${g.nom}${g.pv.length>1?" ("+tues.map(n=>"n° "+n).join(", ")+")":""} hors de combat.`);
  if(!vivants(g))journal(`Tous les ${g.nom} sont vaincus.`);
}

});
document.addEventListener("submit",e=>{if(e.target.id!=="formRapide")return;e.preventDefault();const f=e.target;const n=Math.max(1,Math.min(20,+f.n.value||1));const pv=Math.max(1,+f.pv.value||1);
  ajouterCombat({nom:f.nom.value.trim()||"Adversaire",dv:1,d:8,att:+f.att.value||13,def:+f.def.value||12,pv,na:1,dmg:"d6",cap:[]},n);rendreCombat();rendreResume()});

/* Garder l'écran allumé pendant le combat */
let VEILLE=null;
async function veille(on){try{if(on&&"wakeLock"in navigator){VEILLE=await navigator.wakeLock.request("screen");toast("L'écran reste allumé.")}else if(VEILLE){await VEILLE.release();VEILLE=null}}catch(err){toast("Ce navigateur ne peut pas garder l'écran allumé.")}}
document.addEventListener("visibilitychange",()=>{if(VEILLE&&document.visibilityState==="visible")veille(true)});

rendre();

</script>
